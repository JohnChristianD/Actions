name: Isolated linear coupled learner safe gate

on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad']
    paths:
      - 'Exotic/ERL/FullCoupled/LinearCoupledLearnerNoNormLSTM.agda'
      - '.github/workflows/linear-learner-safe.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'Exotic/ERL/FullCoupled/LinearCoupledLearnerNoNormLSTM.agda'
      - '.github/workflows/linear-learner-safe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Verify Agda executable
        run: agda --version
      - name: Safe-check isolated linear coupled learner
        run: agda --safe Exotic/ERL/FullCoupled/LinearCoupledLearnerNoNormLSTM.agda
