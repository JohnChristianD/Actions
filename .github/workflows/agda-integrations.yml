name: Agda integration import sync

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-check:
    name: Check scripted Vehicle imports
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Check external Agda import sync
        env:
        run: |
          set -euo pipefail
          nix develop .#default -c nix run .#mirth-agda-import-sync -- --check
          nix develop .#default -c bash -euo pipefail -c '
            "$AGDA_COMMAND" --allow-exec -l standard-library -i . -i "$VEHICLE_AGDA_SOURCE" FullCoupled/TheoremsMonolith.agda
          '
