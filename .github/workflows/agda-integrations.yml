name: Agda canonical sync

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-check:
    name: Check scripted Vehicle imports
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Check external Agda import sync
        run: |
          set -euo pipefail
          nix run .#mirth-agda-import-sync -- --write
          nix run .#mirth-agda-import-sync -- --check
          nix develop .#default -c bash -euo pipefail -c '
            while IFS= read -r file; do
              "$AGDA_COMMAND" -l standard-library -i . "$file"
            done < <(git ls-files "*.agda" | sort)
          '
      - name: Recompute Mercury theorem graph
        run: |
          set -euo pipefail
          nix develop .#default -c bash -euo pipefail -c '
            cd .ci/discovery
            mmc --make theorem_monolith_egraph_sync
            ./theorem_monolith_egraph_sync
          '
