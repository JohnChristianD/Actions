name: Exact hardsign F4 Safe Agda gate

on:
  push:
    branches: ['main']
    paths:
      - 'Exotic/ERL/FullCoupled/F4HardsignKernel.agda'
      - '.github/workflows/f4-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Check standalone six-state hardsign F4 kernel
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/F4HardsignKernel.agda
