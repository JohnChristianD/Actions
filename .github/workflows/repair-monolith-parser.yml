name: one-shot monolith parser repair

on:
  push:
    branches: ['ci/v149-monolith-dedupe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply canonical parser normalization chain
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/v149-dedupe-monolith.py
          python3 .ci/v149-cvt-parser.py
          python3 .ci/v149-diagonal-parser.py
          python3 .ci/v149-let-bindings.py
          python3 .ci/v149-residual-carrier.py
          python3 .ci/v149-ring-zero-namespace.py
          python3 .ci/final-qualify-ordered-fields.py
          git diff --check
      - name: Kernel-check monolith
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Kernel-check MLP temporal composition
        run: agda --safe Exotic/ERL/MLPTemporalComposition_v150.agda
      - name: Kernel-check Markovian MLP temporal composition
        run: agda --safe Exotic/ERL/MLPMarkovTemporalComposition_v151.agda
      - name: Persist checked source and remove repair machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github-actions[bot].github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda Exotic/ERL/MLPTemporalComposition_v150.agda Exotic/ERL/MLPMarkovTemporalComposition_v151.agda
          git add .ci/v149-dedupe-monolith.py .ci/v149-cvt-parser.py .ci/v149-diagonal-parser.py .ci/v149-let-bindings.py .ci/v149-residual-carrier.py .ci/v149-ring-zero-namespace.py .ci/final-qualify-ordered-fields.py .ci/v149-layernorm-parser.py .ci/normalize-nat-namespace.py
          git commit -m 'fix: persist kernel-checked monolith and MLP composition surfaces'
          git push origin HEAD:ci/v149-monolith-dedupe
