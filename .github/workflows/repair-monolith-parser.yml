name: one-shot monolith parser repair

on:
  push:
    branches: ['ci/v149-representation-layernorm-closure']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Patch canonical accumulator lambda
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '''  accumulate : Fin n → R → EState → EState
  accumulate i c (state s) = state (λ j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j)
'''
          new = '''  accumulate : Fin n → R → EState → EState
  accumulate i c (state s) = state (λ j with finDecEq j i
  ... | yes _ = s j + c
  ... | no _ = s j)
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one accumulator parser target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Kernel-check monolith after minimal repair
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit repaired monolith and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda .github/workflows/repair-monolith-parser.yml
          git commit -m 'fix: repair canonical accumulator with-clause indentation'
          git rm .github/workflows/repair-monolith-parser.yml
          git commit -m 'ci: remove one-shot monolith parser helper'
          git push origin HEAD:ci/v149-representation-layernorm-closure
