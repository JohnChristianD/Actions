name: one-shot monolith parser repair

on:
  push:
    branches: ['ci/v149-monolith-final']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply v149 monolith dedupe
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/v149-dedupe-monolith.py
          python3 .ci/v149-dedupe-duplicate-smooth.py
          python3 .ci/v149-cvt-parser.py
          git diff --check
      - name: Print current parser frontier
        shell: bash
        run: |
          set -euo pipefail
          echo '--- transformed lines 1508-1548 ---'
          nl -ba Exotic/ERL/FullCoupled/CompleteSafe_v147.agda | sed -n '1508,1548p'
      - name: Kernel-check monolith
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Persist checked source and remove repair machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github-actions[bot].github.com'
          rm -f .ci/v149-dedupe-monolith.py .ci/v149-dedupe-duplicate-smooth.py .ci/v149-cvt-parser.py .github/workflows/repair-v149-dedupe.yml .github/workflows/repair-monolith-parser.yml
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda .ci/v149-dedupe-monolith.py .ci/v149-dedupe-duplicate-smooth.py .ci/v149-cvt-parser.py .github/workflows/repair-v149-dedupe.yml .github/workflows/repair-monolith-parser.yml
          git commit -m 'fix: kernel-check canonical monolith dedupe'
          git push origin HEAD:ci/v149-monolith-final
