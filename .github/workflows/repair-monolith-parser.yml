name: one-shot monolith parser repair

on:
  push:
    branches: ['ci/v149-monolith-final']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply v149 monolith normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/repair-agda-syntax.py
          python3 .ci/normalize-completesafe-namespaces.py
          python3 .ci/v149-dedupe-monolith.py
          python3 .ci/v149-dedupe-duplicate-smooth.py
          python3 .ci/v149-cvt-parser.py
          python3 .ci/v149-diagonal-parser.py
          python3 .ci/v149-let-bindings.py
          python3 .ci/v149-residual-carrier.py
          git diff --check
      - name: Print current kernel frontier
        shell: bash
        run: |
          set -euo pipefail
          echo '--- first 150 lines ---'
          nl -ba Exotic/ERL/FullCoupled/CompleteSafe_v147.agda | sed -n '1,150p'
      - name: Kernel-check monolith
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Persist checked source and remove repair machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .ci/repair-agda-syntax.py .ci/normalize-completesafe-namespaces.py .ci/v149-dedupe-monolith.py .ci/v149-dedupe-duplicate-smooth.py .ci/v149-cvt-parser.py .ci/v149-diagonal-parser.py .ci/v149-let-bindings.py .ci/v149-residual-carrier.py .ci/v149-nat-zero-scope.py .github/workflows/repair-v149-dedupe.yml .github/workflows/repair-monolith-parser.yml
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda .ci/repair-agda-syntax.py .ci/normalize-completesafe-namespaces.py .ci/v149-dedupe-monolith.py .ci/v149-dedupe-duplicate-smooth.py .ci/v149-cvt-parser.py .ci/v149-diagonal-parser.py .ci/v149-let-bindings.py .ci/v149-residual-carrier.py .ci/v149-nat-zero-scope.py .github/workflows/repair-v149-dedupe.yml .github/workflows/repair-monolith-parser.yml
          git commit -m 'fix: kernel-check canonical monolith namespace'
          git push origin HEAD:ci/v149-monolith-final
