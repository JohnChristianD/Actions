name: Agda kernel direct
on:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
      - name: Kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
