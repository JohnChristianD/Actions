# Tiny direct kernel gate with deterministic in-repo normalization.
name: Agda kernel direct
on:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
      - name: Canonical repair
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize Nat namespace
        run: python3 .ci/normalize-nat-namespace.py
      - name: Normalize q-retraction structure
        run: python3 .ci/normalize-q-retraction.py
      - name: Kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
