# Authoritative Agda 2.8.0 --safe gate with deterministic normalization and staged theorem witnesses.
name: Agda kernel direct
on:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
      - name: Canonical repair
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize Nat namespace
        run: python3 .ci/normalize-nat-namespace.py
      - name: Normalize equality primitives
        run: python3 .ci/normalize-equality-primitives.py
      - name: Normalize algebra and local aliases
        run: python3 .ci/normalize-algebra-fixity.py
      - name: Normalize hidden aliases
        run: python3 .ci/normalize-hidden-aliases.py
      - name: Normalize q-retraction structure
        run: python3 .ci/normalize-q-retraction.py
      - name: Audit safe algebra surface
        run: python3 .ci/check-agda-safe-surface.py
      - name: Generate staged safe kernel probes
        run: python3 .ci/generate-agda-safe-stages.py
      - name: Kernel check — staged dependency prefixes
        shell: bash
        run: |
          set -o pipefail
          for stage in Exotic/ERL/FullCoupled/CI/Stage*.agda; do
            echo "=== SAFE STAGE: ${stage} ==="
            if ! agda --safe "${stage}" 2>&1 | tee -a agda-stages.log; then
              echo "FIRST_SAFE_STAGE_FAILURE=${stage}" | tee -a agda-stages.log
              exit 42
            fi
          done
      - name: Kernel check — CompleteSafe_v147
        shell: bash
        run: |
          set -o pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda 2>&1 | tee agda-kernel.log
      - name: Safe witness — finite algebra
        run: agda --safe Exotic/ERL/FullCoupled/CheckFiniteAlgebra_v147.agda
      - name: Safe witness — q projection chain
        run: agda --safe Exotic/ERL/FullCoupled/CheckQProjection_v147.agda
      - name: Safe witness — q terminal chain
        run: agda --safe Exotic/ERL/FullCoupled/CheckQTerminal_v147.agda
      - name: Kernel check — CIInterpolation_v147
        shell: bash
        run: |
          set -o pipefail
          agda --safe Exotic/ERL/FullCoupled/CIInterpolation_v147.agda 2>&1 | tee agda-interpolation.log
      - name: Upload kernel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agda-kernel-diagnostics
          path: |
            agda-stages.log
            agda-kernel.log
            agda-interpolation.log
