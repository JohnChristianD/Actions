# Tiny direct kernel gate with only deterministic in-repo normalization.
name: Agda kernel direct
on:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
      - name: Canonical repair
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize q-retraction local declaration
        run: python3 -c 'from pathlib import Path; p=Path("Exotic/ERL/FullCoupled/CompleteSafe_v147.agda"); s=p.read_text(); old="      initialForm : QRun_v142.projection\\n          (initialQRun_v142 D budget p x) ≡ p ="; assert old in s; p.write_text(s.replace(old,"      initialForm =",1))'
      - name: Kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
