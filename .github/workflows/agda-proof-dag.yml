name: Agda safe proof DAG

# Fresh checkpoint: source-level normalization is explicit; --safe remains authoritative.
on:
  push:
    branches: ['ci/agda-v147-kernel-live']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-dag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Repair known canonical syntax
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize CompleteSafe initialForm binding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          pattern = r'(?m)^(\s*)initialForm\s*:\s*QRun_v142\.projection\s*\n\1\s+\(initialQRun_v142 D budget p x\)\s+≡\s+p\s*='
          s2, count = re.subn(pattern, r'\1initialForm =', s, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one initialForm binding, found {count}')
          p.write_text(s2)
          PY
      - name: Normalize qTerminalProjectionUnique proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          marker = 'qTerminalProjectionUnique_v147 t u ha hx hmu ='
          start = s.find(marker)
          if start < 0:
              raise SystemExit('expected qTerminalProjectionUnique theorem body not found')
          sep = s.find('\n------------------------------------------------------------------------', start)
          if sep < 0:
              raise SystemExit('expected separator after qTerminalProjectionUnique theorem not found')
          replacement = '''qTerminalProjectionUnique_v147 t u refl refl refl =
  vectorExt_v147 (λ i →
    trans
      (QTerminalSolution_v147.stationarity t i)
      (sym (QTerminalSolution_v147.stationarity u i)))
'''
          s = s[:start] + replacement + s[sep:]
          p.write_text(s)
          PY
      - name: Check Stage 01 finite algebra
        run: agda --safe Exotic/ERL/Stages/Stage01_FiniteAlgebra.agda
      - name: Check Stage 02 CHAD
        run: agda --safe Exotic/ERL/Stages/Stage02_CHAD.agda
      - name: Check Stage 03 linear replay learner
        run: agda --safe Exotic/ERL/Stages/Stage03_LinearLearner.agda
      - name: Check Stage 04 q-projection boundary
        run: agda --safe Exotic/ERL/Stages/Stage04_QProjection.agda
      - name: Check Stage 05 representation boundary
        run: agda --safe Exotic/ERL/Stages/Stage05_Representation.agda
      - name: Check Stage 06 coupled learner
        run: agda --safe Exotic/ERL/Stages/Stage06_CoupledLearner.agda
      - name: Check Stage 07 finite outer archive
        run: agda --safe Exotic/ERL/Stages/Stage07_OuterFinite.agda
      - name: Check Stage 08 integration
        run: agda --safe Exotic/ERL/Stages/Stage08_Integration.agda
      - name: Authoritative complete kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
