name: One-shot monolith restoration
on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact parent monolith and apply one-character parser fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 6914fce2dda736f2ea1e389d7967a06e1c10d19a
          git checkout 6914fce2dda736f2ea1e389d7967a06e1c10d19a -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '  accumulateAt : Fin n -> R -> Cot -> Cot\n'
          new = '  accumulateAt : Fin n → R → Cot → Cot\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one ASCII-arrow declaration, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git show 6914fce2dda736f2ea1e389d7967a06e1c10d19a:Exotic/ERL/FullCoupled/CompleteSafe_v147.agda > /tmp/CompleteSafe_v147.parent.agda
          changed=$(diff -u /tmp/CompleteSafe_v147.parent.agda Exotic/ERL/FullCoupled/CompleteSafe_v147.agda | grep -E '^[+-][^+-]' | wc -l)
          test "$changed" -eq 2
          ! grep -F '  accumulateAt : Fin n -> R -> Cot -> Cot' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          grep -F '  accumulateAt : Fin n → R → Cot → Cot' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git diff --check
      - name: Kernel-check restored monolith
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit exact restoration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: restore monolithic safe closure with minimal parser repair'
          git rm .github/workflows/repair-efficient-chad.yml
          git commit -m 'ci: remove monolith restoration helper'
          git push origin HEAD:ci/v148-firstclass-lstm-chad
