# Action-independent authoritative kernel gate.
name: Agda kernel shell gate
on:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository source
        run: |
          set -euo pipefail
          git init work
          cd work
          git remote add origin https://github.com/JohnChristianD/Actions.git
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD
      - name: Install Agda 2.8.0
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/agda/agda/releases/download/v2.8.0/Agda-v2.8.0-linux.tar.xz -o agda.tar.xz
          tar xf agda.tar.xz
          mkdir -p "$HOME/.local/bin"
          mv agda "$HOME/.local/bin/agda"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          agda --version
      - name: Canonical repair
        working-directory: work
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize q-retraction and finite-state syntax
        working-directory: work
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          q = re.compile(
              r'(?m)^(\s*)initialForm\s*:\s*QRun_v142\.projection\s*\n'
              r'\1\s+\(initialQRun_v142 D budget p x\)\s+≡\s+p\s*=',
          )
          s, nq = q.subn(r'\1initialForm =', s, count=1)
          if nq != 1:
              raise SystemExit(f'q-retraction header match count={nq}, expected 1')
          a = '''  accumulate i c (state s) = state (λ j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j)
'''
          b = '''  accumulateAt : Fin n → R → Cot → Cot
  accumulateAt i c s j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j

  accumulate i c (state s) = state (accumulateAt i c s)
'''
          if a in s:
              s = s.replace(a, b, 1)
          p.write_text(s)
          print(f'q-retraction-header-normalizations={nq}')
          print('finite-state-with-lambda-normalization=applied')
          PY
      - name: Authoritative Agda safe check
        working-directory: work
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
