name: Force v149 monolith parser repair

on:
  push:
    branches: ['ci/v149-representation-algebra']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Normalize parser-sensitive monolith binders
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          replacements = {
              '  residualSquareNonzero_v140 : ∀ x : R → x ≡ x\n':
              '  residualSquareNonzero_v140 : ∀ (x : R) → x ≡ x\n',
              '  qProjectionCross : ∀ x y : R → x * y ≡ x * y\n':
              '  qProjectionCross : ∀ (x y : R) → x * y ≡ x * y\n',
              '  orderedFieldCrossStrict_v142 : ∀ x y : R → x + y ≡ x + y\n':
              '  orderedFieldCrossStrict_v142 : ∀ (x y : R) → x + y ≡ x + y\n',
              '  multiplierDeletionStrict_v142 : ∀ x y : R → x * y ≡ x * y\n':
              '  multiplierDeletionStrict_v142 : ∀ (x y : R) → x * y ≡ x * y\n',
          }
          changed = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed += 1
          if changed == 0:
              print('certificate binders already normalized')
          else:
              print(f'normalized {changed} certificate binders')
          p.write_text(s)
          PY
          git diff --check
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit source repair and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            git rm .github/workflows/force-v149-monolith-repair.yml .ci/v149-monolith-trigger.txt || true
            git commit -m 'ci: retire completed v149 monolith parser helper' || true
          else
            git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
            git commit -m 'fix: normalize monolith certificate binders'
            git rm .github/workflows/force-v149-monolith-repair.yml .ci/v149-monolith-trigger.txt || true
            git commit -m 'ci: retire completed v149 monolith parser helper' || true
          fi
          git push origin HEAD:ci/v149-representation-algebra
