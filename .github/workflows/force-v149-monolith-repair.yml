name: Force v149 monolith parser repair

on:
  push:
    branches: ['ci/v149-representation-algebra']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply only the known accumulate parser repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old1 = '''  accumulateAt : Fin n -> R -> Cot -> Cot\n  accumulateAt i c s j with finDecEq j i\n    ... | yes _ = s j + c\n    ... | no _ = s j\n'''
          old2 = '''  accumulateAt : Fin n → R → Cot → Cot\n  accumulateAt i c s j with finDecEq j i\n    ... | yes _ = s j + c\n    ... | no _ = s j\n'''
          new = '''  accumulateAt : Fin n → R → Cot → Cot\n  accumulateAt i c s j with finDecEq j i\n  ... | yes _ = s j + c\n  ... | no _ = s j\n'''
          if s.count(old1) == 1:
              s = s.replace(old1, new, 1)
              print('repaired ASCII arrow and with-clause indentation')
          elif s.count(old2) == 1:
              s = s.replace(old2, new, 1)
              print('repaired with-clause indentation')
          elif s.count(new) == 1:
              print('accumulate frontier already repaired')
          else:
              raise SystemExit('fail-closed: accumulate parser frontier not uniquely identifiable')
          p.write_text(s)
          PY
          git diff --check
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit source repair and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            git rm .github/workflows/force-v149-monolith-repair.yml
            git commit -m 'ci: remove completed v149 monolith repair helper'
          else
            git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
            git commit -m 'fix: repair v149 monolith accumulate parser'
            git rm .github/workflows/force-v149-monolith-repair.yml
            git commit -m 'ci: remove completed v149 monolith repair helper'
          fi
          git push origin HEAD:ci/v149-representation-algebra
