name: Force v149 monolith parser repair

on:
  push:
    branches: ['ci/v149-representation-algebra']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Normalize every duplicated accumulate with-clause
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old_ascii = '''  accumulateAt : Fin n -> R -> Cot -> Cot\n  accumulateAt i c s j with finDecEq j i\n    ... | yes _ = s j + c\n    ... | no _ = s j\n'''
          old_unicode = '''  accumulateAt : Fin n → R → Cot → Cot\n  accumulateAt i c s j with finDecEq j i\n    ... | yes _ = s j + c\n    ... | no _ = s j\n'''
          new = '''  accumulateAt : Fin n → R → Cot → Cot\n  accumulateAt i c s j with finDecEq j i\n  ... | yes _ = s j + c\n  ... | no _ = s j\n'''
          count = s.count(old_ascii) + s.count(old_unicode)
          if count == 0:
              if s.count(new) >= 2:
                  print(f'all {s.count(new)} accumulate frontiers already normalized')
              else:
                  raise SystemExit('fail-closed: no uniquely identifiable accumulate parser frontier')
          else:
              s = s.replace(old_ascii, new).replace(old_unicode, new)
              print(f'normalized {count} duplicated accumulate frontiers')
          p.write_text(s)
          PY
          git diff --check
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit source repair and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          if git diff --cached --quiet; then
            git rm .github/workflows/force-v149-monolith-repair.yml
            git commit -m 'ci: remove completed v149 monolith repair helper'
          else
            git commit -m 'fix: normalize duplicated v149 accumulate frontiers'
            git rm .github/workflows/force-v149-monolith-repair.yml
            git commit -m 'ci: remove completed v149 monolith repair helper'
          fi
          git push origin HEAD:ci/v149-representation-algebra
