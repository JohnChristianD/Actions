name: Monolith composite proof gate

on:
  push:
    branches: ['main']
    paths:
      - 'Exotic/ERL/FullCoupled/GeneralFullCoupledLearnerMonolith.agda'
      - 'Exotic/ERL/FullCoupled/MonolithCompositeReservoirTheorem.agda'
      - '.ci/discovery/ProofSearch.py'
      - '.github/workflows/monolith-composite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Check learner monolith
        run: timeout 180s agda --safe Exotic/ERL/FullCoupled/GeneralFullCoupledLearnerMonolith.agda

      - name: Check coupled composite theorem
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/MonolithCompositeReservoirTheorem.agda

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JAxtar A* search engine
        run: python -m pip install --disable-pip-version-check "jaxtar @ git+https://github.com/tinker495/JAxtar@d886571b116d7ca4de1f91a715cf2e73ee3b5acd"

      - name: Run JAxtar proof-graph search and Safe Agda oracle
        run: python .ci/discovery/ProofSearch.py --budget 64
