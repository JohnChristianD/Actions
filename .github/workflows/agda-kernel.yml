name: Agda kernel --safe

on:
  push:
    paths:
      - '**/*.agda'
      - '.github/workflows/agda-kernel.yml'
      - '.ci/repair-agda-syntax.py'
  pull_request:
    paths:
      - '**/*.agda'
      - '.github/workflows/agda-kernel.yml'
      - '.ci/repair-agda-syntax.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
      - name: Repair canonical source
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize diagonal exposure proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          start = s.find('diagonalNewtonExposurePositive_v146 h =')
          stop = s.find('\n------------------------------------------------------------------------', start)
          if start < 0 or stop < 0:
              raise SystemExit('diagonal exposure theorem boundaries not found')
          replacement = '''diagonalNewtonExposurePositive_v146 h =
  let OR = SmoothAlgebra.orderedRing _
      Rg = OrderedRing.ring OR
      t = traceProduct_v146 h
      rt = SmoothAlgebra.recip _ t
      htrace = OrderedRing.mulPos
        (CoupledHyperParameters_v146.gammaPositive h)
        (CoupledHyperParameters_v146.lambdaPositive h)
      hrec = reciprocalNonnegative_v146 htrace
      hlt0 : rt < rt + Ring.one Rg =
        subst (λ z → z < rt + Ring.one Rg)
          (Ring.addZeroR Rg rt)
          (OrderedRing.addLtLeft (OrderedRing.zeroLtOne {orderedRing = OR}) rt)
      hsum : zero < rt + Ring.one Rg =
        OrderedRing.leLt hrec hlt0
  in subst (λ z → zero < z)
       (Ring.addComm Rg rt (Ring.one Rg))
       hsum
'''
          p.write_text(s[:start] + replacement + s[stop:])
          PY
      - name: Kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
