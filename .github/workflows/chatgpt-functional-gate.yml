name: Agda safe kernel gate

on:
  push:
    branches: ["v147-q-chad-agda-safe"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agda-safe:
    name: Canonical v147 Agda --safe closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Setup Agda from Marketplace action
        uses: agda/agda-setup-action@master
        with:
          agda-version: '2.8.0'
      - name: Verify canonical source
        run: |
          test -f Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          test "$(sed -n '2p' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda)" = 'module Exotic.ERL.FullCoupled.CompleteSafe_v147 where'
          grep -q '{-# OPTIONS --safe #-}' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          test -f Exotic/ERL/FullCoupled/QClosure_v147.agda
          test -f Exotic/ERL/FullCoupled/CIInterpolation_v147.agda
          test -f Exotic/ERL/FullCoupled/AlgebraClosure_v147.agda
      - name: Apply deterministic source repair
        run: |
          test "$(grep -c '^residualSquareNonzero_v140 ha hr =' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda)" = 1
          sed -i 's/^residualSquareNonzero_v140 ha hr =/residualSquareNonzero_v140 ha hr hx =/' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          sed -i 's/^-- qProjectionFixedPoint_v147 : ∀ {S n}$/qProjectionFixedPoint_v147 : ∀ {S n}/' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          sed -i 's/(Ring.mulOneL Rg e))))) refl)/(Ring.mulOneL Rg e)))))))/' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          sed -i 's/(Ring.mulOneL Rg d))))) refl)/(Ring.mulOneL Rg d)))))))/' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          sed -i -E 's/^([[:space:]]*)hzero : .*$/\1hzero =/' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          sed -i -E 's/^([[:space:]]*)(hx|hxx|hlt) : .*$/\1\2 =/' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Kernel check canonical algebra
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Kernel check q and CHAD closure
        run: agda --safe Exotic/ERL/FullCoupled/QClosure_v147.agda
      - name: Kernel check interpolation
        run: agda --safe Exotic/ERL/FullCoupled/CIInterpolation_v147.agda
      - name: Kernel check new algebra closure
        run: agda --safe Exotic/ERL/FullCoupled/AlgebraClosure_v147.agda
      - name: Close only on Agda kernel success
        run: echo 'agda-safe-kernel=GREEN'
