name: v149 parser context probe

on:
  push:
    branches: ['ci/v149-monolith-dedupe']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply existing normalizers
        run: |
          python3 .ci/v149-dedupe-monolith.py
          python3 .ci/v149-cvt-parser.py
          python3 .ci/v149-diagonal-proof-parser.py
          python3 .ci/v149-typed-let-parser.py
          python3 .ci/v149-residual-carrier.py
      - name: Print context
        run: |
          nl -ba Exotic/ERL/FullCoupled/CompleteSafe_v147.agda | sed -n '1588,1618p'
      - name: Kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
