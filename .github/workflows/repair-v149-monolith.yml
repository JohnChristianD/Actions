name: v149 monolith parser repair

on:
  push:
    branches: ['ci/v149-representation-algebra', 'ci/v149-representation-layernorm-closure']
    paths:
      - 'Exotic/ERL/FullCoupled/CompleteSafe_v147.agda'
      - '.github/workflows/repair-v149-monolith.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Normalize monolith accumulate with-clause
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '''  accumulateAt : Fin n -> R -> Cot -> Cot
  accumulateAt i c s j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j
'''
          new = '''  accumulateAt : Fin n → R → Cot → Cot
  accumulateAt i c s j with finDecEq j i
  ... | yes _ = s j + c
  ... | no _ = s j
'''
          if s.count(old) == 1:
              s = s.replace(old, new, 1)
              print('patched ASCII arrow + with-clause indentation')
          elif s.count(new) == 1:
              print('already normalized')
          else:
              raise SystemExit('monolith accumulate frontier is neither uniquely broken nor uniquely repaired')
          p.write_text(s)
          PY
          git diff --check
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit source repair and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          if git diff --cached --quiet; then
            git rm .github/workflows/repair-v149-monolith.yml
            git commit -m 'ci: retire completed monolith parser helper'
          else
            git commit -m 'fix: normalize monolithic accumulate with-clause'
            git rm .github/workflows/repair-v149-monolith.yml
            git commit -m 'ci: retire monolith parser helper'
          fi
          git push origin HEAD:ci/v149-representation-layernorm-closure
