name: v149 monolith parser repair

on:
  push:
    branches: ['ci/v149-representation-algebra']
    paths:
      - 'Exotic/ERL/FullCoupled/CompleteSafe_v147.agda'
      - '.github/workflows/repair-v149-monolith.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Normalize monolith accumulate with-clause
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '''  accumulateAt : Fin n -> R -> Cot -> Cot
  accumulateAt i c s j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j
'''
          new = '''  accumulateAt : Fin n → R → Cot → Cot
  accumulateAt i c s j with finDecEq j i
  ... | yes _ = s j + c
  ... | no _ = s j
'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('monolith parser frontier normalized')
          else:
              print('monolith parser frontier already normalized')
          PY
          git diff --check
      - name: Kernel-check monolith
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit source repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            echo 'no source change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: normalize monolithic accumulate with-clause'
          git push origin HEAD:ci/v149-representation-algebra
