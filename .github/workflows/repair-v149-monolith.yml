name: v149 monolith parser repair

on:
  push:
    branches: ['ci/v149-representation-algebra', 'ci/v149-representation-layernorm-closure']
    paths:
      - 'Exotic/ERL/FullCoupled/CompleteSafe_v147.agda'
      - '.github/workflows/repair-v149-monolith.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Normalize monolith parser-sensitive finite syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()

          old = '''  accumulateAt : Fin n -> R -> Cot -> Cot
  accumulateAt i c s j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j
'''
          new = '''  accumulateAt : Fin n → R → Cot → Cot
  accumulateAt i c s j with finDecEq j i
  ... | yes _ = s j + c
  ... | no _ = s j
'''
          if s.count(old) == 1:
              s = s.replace(old, new, 1)
          elif s.count(new) != 1:
              raise SystemExit('accumulate parser frontier is not uniquely identifiable')

          old2 = '''  open import Agda.Builtin.Nat using (Nat; zero; suc; _+_)
'''
          new2 = '''  open import Agda.Builtin.Nat using (Nat; suc; _+_)
'''
          if s.count(old2) == 1:
              s = s.replace(old2, new2, 1)
          elif s.count(new2) != 1:
              raise SystemExit('Nat import frontier is not uniquely identifiable')

          replacements = [
              ('  [] : Vec A zero\n', '  [] : Vec A Nat.zero\n'),
              ('        go {zero} ()\n', '        go {Nat.zero} ()\n'),
              ('  dot {zero} v w = Ring.zero Rg\n', '  dot {Nat.zero} v w = Ring.zero Rg\n'),
          ]
          for old3, new3 in replacements:
              if s.count(old3) != 1:
                  raise SystemExit(f'expected one namespace occurrence: {old3!r}, found {s.count(old3)}')
              s = s.replace(old3, new3, 1)

          p.write_text(s)
          PY
          git diff --check
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit source repair and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: qualify Nat.zero in monolithic finite syntax'
          git rm .github/workflows/repair-v149-monolith.yml
          git commit -m 'ci: retire monolith parser helper'
          git push origin HEAD:ci/v149-representation-layernorm-closure
