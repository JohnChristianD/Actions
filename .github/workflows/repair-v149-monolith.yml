name: v149 monolith parser repair

on:
  workflow_dispatch:
  push:
    branches: ['ci/v149-representation-algebra']
    paths:
      - 'Exotic/ERL/FullCoupled/CompleteSafe_v147.agda'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Normalize monolith accumulate with-clause
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          candidates = [
              ('''  accumulateAt : Fin n -> R -> Cot -> Cot\n  accumulateAt i c s j with finDecEq j i\n    ... | yes _ = s j + c\n    ... | no _ = s j\n''',
               '''  accumulateAt : Fin n → R → Cot → Cot\n  accumulateAt i c s j with finDecEq j i\n  ... | yes _ = s j + c\n  ... | no _ = s j\n'''),
              ('''  accumulateAt : Fin n → R → Cot → Cot\n  accumulateAt i c s j with finDecEq j i\n    ... | yes _ = s j + c\n    ... | no _ = s j\n''',
               '''  accumulateAt : Fin n → R → Cot → Cot\n  accumulateAt i c s j with finDecEq j i\n  ... | yes _ = s j + c\n  ... | no _ = s j\n''')
          ]
          for old, new in candidates:
              if old in s:
                  s = s.replace(old, new, 1)
                  print('patched monolith accumulate frontier')
                  break
          p.write_text(s)
          PY
          git diff --check
      - name: Kernel-check monolith
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            echo 'no source change'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
            git commit -m 'fix: normalize monolithic accumulate with-clause'
            git push origin HEAD:ci/v149-representation-algebra
          fi