name: v149 canonical monolith algebra repair

on:
  push:
    branches: ['ci/v149-representation-layernorm-closure']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Insert canonical SmoothAlgebra scalar-vector-matrix layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          if 'record SmoothAlgebra : Set₁ where' in s:
              raise SystemExit('canonical SmoothAlgebra already present; refusing duplicate insertion')
          marker = '------------------------------------------------------------------------\n-- Seven coupled parameter blocks and finite parameter indices\n------------------------------------------------------------------------\n'
          if marker not in s:
              raise SystemExit('canonical algebra insertion marker missing')
          layer = '''------------------------------------------------------------------------
-- Canonical finite SmoothAlgebra boundary for scalar, vector, and matrix
-- reasoning. Root and reciprocal operations remain total primitives while
-- every theorem that needs a domain or denominator witness carries it.
------------------------------------------------------------------------

record SmoothAlgebra : Set₁ where
  field
    orderedRing : OrderedRing
  open OrderedRing orderedRing public
  open Ring (OrderedRing.base orderedRing) public
  field
    exp log tanh sigmoid : R → R
    dexp dlog dtanh dsigmoid : R → R
    sqrt recip : R → R
    max min : R → R → R
    maxNonnegative : ∀ {a b} → zero ≤ a → zero ≤ b → zero ≤ max a b
    pi : R
    fromNat : Nat → R
    sqrtZero : sqrt zero ≡ zero
    recipZero : recip zero ≡ zero
    fromNatZero : fromNat Nat.zero ≡ zero
    fromNatSuc : ∀ n → fromNat (suc n) ≡ fromNat n + one
    reciprocalLaw : ∀ {d} → zero < d → d * recip d ≡ one

Scalar : SmoothAlgebra → Set
Scalar S = Ring.R (OrderedRing.base (SmoothAlgebra.orderedRing S))

VecS : SmoothAlgebra → Nat → Set
VecS S n = Vec (Scalar S) n

MatS : SmoothAlgebra → Nat → Nat → Set
MatS S m n = Fin m → Fin n → Scalar S

A : Set
A = Nat

vAdd : ∀ {S n} → VecS S n → VecS S n → VecS S n
vAdd {S} = zipWithV (Ring._+_ (OrderedRing.base (SmoothAlgebra.orderedRing S)))

vSub : ∀ {S n} → VecS S n → VecS S n → VecS S n
vSub {S} = zipWithV minus
  where
  Rg = OrderedRing.base (SmoothAlgebra.orderedRing S)
  minus x y = Ring._+_ Rg x (Ring.neg Rg y)

vScale : ∀ {S n} → Scalar S → VecS S n → VecS S n
vScale {S} a = mapV (Ring._*_ (OrderedRing.base (SmoothAlgebra.orderedRing S)) a)

vHadamard : ∀ {S n} → VecS S n → VecS S n → VecS S n
vHadamard {S} = zipWithV (Ring._*_ (OrderedRing.base (SmoothAlgebra.orderedRing S)))

vDot : ∀ {S n} → VecS S n → VecS S n → Scalar S
vDot {S} {n} x y =
  sumFin (Ring._+_ Rg) (Ring.zero Rg) n
    (λ i → Ring._*_ Rg (indexV x i) (indexV y i))
  where
  Rg = OrderedRing.base (SmoothAlgebra.orderedRing S)

vSum : ∀ {S n} → VecS S n → Scalar S
vSum {S} {n} x =
  sumFin (Ring._+_ Rg) (Ring.zero Rg) n (λ i → indexV x i)
  where
  Rg = OrderedRing.base (SmoothAlgebra.orderedRing S)

tabulateV : ∀ {B n} → (Fin n → B) → Vec B n
tabulateV {B = _} {n = Nat.zero} f = []
tabulateV {B = _} {n = suc n} f = f fzero ∷ tabulateV (λ i → f (fsuc i))

matVec : ∀ {S m n} → MatS S m n → VecS S n → VecS S m
matVec {S} {m} {n} M x =
  tabulateV (λ i →
    sumFin (Ring._+_ Rg) (Ring.zero Rg) n
      (λ j → Ring._*_ Rg (M i j) (indexV x j)))
  where
  Rg = OrderedRing.base (SmoothAlgebra.orderedRing S)

matMul : ∀ {S a b c} → MatS S a b → MatS S b c → MatS S a c
matMul {S} {a} {b} {c} M N =
  λ i k →
    sumFin (Ring._+_ Rg) (Ring.zero Rg) b
      (λ j → Ring._*_ Rg (M i j) (N j k))
  where
  Rg = OrderedRing.base (SmoothAlgebra.orderedRing S)

------------------------------------------------------------------------
'''
          s = s.replace(marker, layer + marker, 1)
          s = s.replace('  Rg = OrderedRing.ring orderedRing\n  R = Ring.R Rg', '  Rg = OrderedRing.base orderedRing\n  R = Ring.R Rg', 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Kernel-check canonical monolith
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit checked repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: restore canonical finite monolith algebra layer'
          git rm .github/workflows/repair-v149-monolith.yml
          git commit -m 'ci: remove one-shot v149 monolith helper'
          git push origin HEAD:ci/v149-representation-layernorm-closure
