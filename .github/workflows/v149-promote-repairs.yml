name: v149 promote validated-source candidates

on:
  push:
    branches: ['ci/v149-monolith-dedupe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply idempotent structural repairs
        run: |
          python3 .ci/v149-layernorm-where.py || true
          python3 .ci/v149-accumulate-lambda.py || true
      - name: Commit structural repair candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            echo 'no structural source delta'
            exit 0
          fi
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: promote next Agda structural repair candidate'
          git push origin HEAD:ci/v149-monolith-dedupe
