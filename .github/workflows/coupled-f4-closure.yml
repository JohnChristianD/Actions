name: Coupled F4 theorem closure

on:
  push:
    branches: ['main']
    paths:
      - 'Exotic/ERL/FullCoupled/F4HardsignKernel.agda'
      - 'Exotic/ERL/FullCoupled/CanonicalCoupledF4Learner.agda'
      - 'Exotic/ERL/FullCoupled/CanonicalCoupledCompositionTheorems.agda'
      - 'Exotic/ERL/FullCoupled/GeneralFullCoupledTheoremsMonolith.agda'
      - 'Exotic/ERL/FullCoupled/MonolithCompositeReservoirTheorem.agda'
      - '.github/workflows/coupled-f4-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Check canonical standalone six-state hardsign F4
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/F4HardsignKernel.agda

      - name: Check canonical coupled six-state F4 learner
        run: timeout 180s agda --safe Exotic/ERL/FullCoupled/CanonicalCoupledF4Learner.agda

      - name: Check simultaneous reservoir-depth-scan theorem
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/CanonicalCoupledCompositionTheorems.agda

      - name: Recheck generalized theorem monolith
        run: timeout 180s agda --safe Exotic/ERL/FullCoupled/GeneralFullCoupledTheoremsMonolith.agda

      - name: Recheck composite reservoir theorem
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/MonolithCompositeReservoirTheorem.agda

# ci: re-run closure on the Agda-2.8 typed finite-state kernel repair
# ci: re-run closure after TransitionWitness field rename
# ci: re-run closure after theorem-local order relation rename
# ci: re-run closure after Sion carrier scope repair
