name: One-shot Sion scope repair

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  patch:
    if: "startsWith(github.event.head_commit.message, 'bootstrap: patch Sion scope')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unscoped Z reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Exotic/ERL/FullCoupled/GeneralFullCoupledTheoremsMonolith.agda')
          text = path.read_text()
          old = 'finiteSionSandwich W = refl≤ Z (payoff (xStar (saddle W)) (yStar (saddle W)))\n'
          new = 'finiteSionSandwich W = refl≤ _ (payoff (xStar (saddle W)) (yStar (saddle W)))\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one finiteSionSandwich body')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit source repair and remove patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-sion-scope.yml
          git add Exotic/ERL/FullCoupled/GeneralFullCoupledTheoremsMonolith.agda .github/workflows/patch-sion-scope.yml
          git commit -m "fix: scope Sion reflexivity carrier"
          git push origin HEAD:main
