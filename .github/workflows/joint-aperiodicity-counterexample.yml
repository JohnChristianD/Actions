name: Joint aperiodicity counterexample safe gate

on:
  push:
    branches: ['main']
    paths:
      - 'Exotic/ERL/FullCoupled/JointAperiodicityCounterexample.agda'
      - '.github/workflows/joint-aperiodicity-counterexample.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'Exotic/ERL/FullCoupled/JointAperiodicityCounterexample.agda'
      - '.github/workflows/joint-aperiodicity-counterexample.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'
      - name: Kernel check
        run: agda --safe Exotic/ERL/FullCoupled/JointAperiodicityCounterexample.agda
