name: Canonical Agda Prelude gate

on:
  pull_request:
    branches: [main]
    paths:
      - "FullCoupled/CanonicalLearnerMonolith.agda"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical:
    name: Canonical learner under agda-prelude
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Assert forbidden Agda dependencies are absent
        run: |
          set -euo pipefail
          ! grep -R -nE 'standard-library|extension-types|two-level-tt|agdaWithStdlib'             flake.nix FullCoupled/CanonicalLearnerMonolith.agda
      - name: Type-check canonical learner
        run: |
          set -euo pipefail
          nix develop .#default -c bash -euo pipefail -c '
            test -n "$AGDA_COMMAND"
            "$AGDA_COMMAND" --version
            "$AGDA_COMMAND" -i . FullCoupled/CanonicalLearnerMonolith.agda
          '
