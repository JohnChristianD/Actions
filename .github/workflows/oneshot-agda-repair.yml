name: One-shot Agda source repair
on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply exact finite source repair
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'p = "Exotic/ERL/FullCoupled/CompleteSafe_v147.agda"; a = File.readlines(p); abort "unexpected source at line 471" unless a[470] == "  accumulate : Fin n → R → EState → EState\n"; a[470,6] = ["  accumulateAt : Fin n → R → Cot → Cot\n", "  accumulateAt i c s j with finDecEq j i\n", "    ... | yes _ = s j + c\n", "    ... | no _ = s j\n", "\n", "  accumulate : Fin n → R → EState → EState\n", "  accumulate i c (state s) = state (accumulateAt i c s)\n"]; File.write(p, a.join)'
          git diff --check
      - name: Authoritative Agda check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit repaired source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda .github/workflows/oneshot-agda-repair.yml .ci/closure-trigger.txt
          git commit -m 'Repair parser-sensitive finite algebra proofs' || exit 0
          git rm .github/workflows/oneshot-agda-repair.yml .ci/closure-trigger.txt
          git commit -m 'Remove one-shot closure helper'
          git push origin HEAD:ci/v148-firstclass-lstm-chad
