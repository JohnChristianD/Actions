name: One-shot Agda source repair
on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply exact finite source repairs
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's{residualSquareNonzero_v140 ha hr hx =\n  let hzero : alpha \+ Ring\.neg \(OrderedRing\.ring \(SmoothAlgebra\.orderedRing _\)\)\n        \(mu \* \(hx \* hx\)\) ≡ alpha =\n      trans\n        \(cong \(λ q → alpha \+ Ring\.neg \(OrderedRing\.ring _\) \(mu \* q\)\)\n          \(cong₂ \(Ring\._\*_ \(OrderedRing\.ring _\)\) hx hx\)\)\n        \(Ring\.addZeroR \(OrderedRing\.ring _\) alpha\)\n  in ⊥-elim \(OrderedRing\.notLtFromLe ha \(subst \(λ q → zero ≤ q\) hzero hr\)\)}{residualSquareNonzero_v140 ha hr hx =\n  ⊥-elim (OrderedRing.notLtFromLe ha\n    (subst (λ q → zero ≤ q)\n      (trans\n        (cong (λ q → alpha + Ring.neg (OrderedRing.ring _) (mu * q))\n          (cong₂ (Ring._*_ (OrderedRing.ring _)) hx hx))\n        (Ring.addZeroR (OrderedRing.ring _) alpha))\n      hr))}s' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          ruby -e 'p = "Exotic/ERL/FullCoupled/CompleteSafe_v147.agda"; s = File.read(p); old = "  accumulate : Fin n → R → EState → EState\\n  accumulateAt : Fin n -> R -> Cot -> Cot\\n  accumulateAt i c s j with finDecEq j i\\n    ... | yes _ = s j + c\\n    ... | no _ = s j\\n\\n  accumulate i c (state s) = state (accumulateAt i c s)"; new = "  accumulateAt : Fin n → R → Cot → Cot\\n  accumulateAt i c s j with finDecEq j i\\n    ... | yes _ = s j + c\\n    ... | no _ = s j\\n\\n  accumulate : Fin n → R → EState → EState\\n  accumulate i c (state s) = state (accumulateAt i c s)"; abort "expected accumulate block not found" unless s.include?(old); File.write(p, s.sub(old, new))'
          grep -n -A7 -B2 'accumulateAt : Fin n' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git diff --check
      - name: Authoritative Agda check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit repaired source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda .github/workflows/oneshot-agda-repair.yml .ci/closure-trigger.txt
          git commit -m 'Repair parser-sensitive finite algebra proofs' || exit 0
          git rm .github/workflows/oneshot-agda-repair.yml .ci/closure-trigger.txt
          git commit -m 'Remove one-shot closure helper'
          git push origin HEAD:ci/v148-firstclass-lstm-chad
