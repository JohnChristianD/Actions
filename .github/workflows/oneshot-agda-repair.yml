name: One-shot Agda source repair
on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply exact finite source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              if old not in s:
                  raise SystemExit(f'missing repair target: {label}')
              s = s.replace(old, new, 1)

          replace_once(
'''  runState (state c) = c

  accumulate : Fin n → R → EState → EState
  accumulateAt : Fin n -> R -> Cot -> Cot
  accumulateAt i c s j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j

  accumulate i c (state s) = state (accumulateAt i c s)
''',
'''  runState (state c) = c

  addIfEqual : ∀ {i j : Fin n} → Dec (i ≡ j) → R → R → R
  addIfEqual (yes _) x c = x + c
  addIfEqual (no _) x c = x

  accumulateAt : Fin n → R → Cot → Cot
  accumulateAt i c s j = addIfEqual (finDecEq j i) (s j) c

  accumulate : Fin n → R → EState → EState
  accumulate i c (state s) = state (accumulateAt i c s)
''', 'accumulate')

          start = s.index('residualSquareNonzero_v140 ha hr hx =')
          end = s.index('\n\n------------------------------------------------------------------------\n-- The clean, reusable cross-multiplication theorem', start)
          residual = '''residualSquareNonzero_v140 ha hr hx =
  ⊥-elim (OrderedRing.notLtFromLe ha hcontra)
  where
  Rg = OrderedRing.ring (SmoothAlgebra.orderedRing _)

  hxx : hx * hx ≡ Ring.zero Rg
  hxx = trans (cong₂ (Ring._*_ Rg) hx hx) (Ring.zeroMulR Rg _)

  hmu : mu * (hx * hx) ≡ Ring.zero Rg
  hmu = trans (cong (λ q → mu * q) hxx) (Ring.zeroMulR Rg mu)

  hneg : Ring.neg Rg (mu * (hx * hx)) ≡ Ring.zero Rg
  hneg =
    trans (cong (Ring.neg Rg) hmu)
      (trans (sym (Ring.addZeroL Rg (Ring.neg Rg (Ring.zero Rg))))
        (trans (Ring.addComm Rg (Ring.zero Rg) (Ring.neg Rg (Ring.zero Rg)))
          (Ring.addNegL Rg (Ring.zero Rg))))

  hzero : alpha + Ring.neg Rg (mu * (hx * hx)) ≡ alpha
  hzero = trans (cong (λ q → alpha + q) hneg) (Ring.addZeroR Rg alpha)

  hcontra : Ring.zero Rg ≤ alpha + Ring.neg Rg (mu * (hx * hx))
  hcontra = subst (λ q → Ring.zero Rg ≤ q) hzero (OrderedRing.refl≤ (SmoothAlgebra.orderedRing _) alpha)'''
          s = s[:start] + residual + s[end:]

          q_old = '''  let OR = SmoothAlgebra.orderedRing _
      Rg = OrderedRing.ring OR
      hx : x ≠ zero = residualSquareNonzero_v140 ha hr
      hxx : zero < x * x = OrderedRing.squarePositive hx
      hlt : alpha < mu * (x * x) = OrderedRing.subLtZero hr
      hmul = OrderedRing.mulLtPosLeft hlt hxx
  in'''
          q_new = '''  let OR = SmoothAlgebra.orderedRing _
      Rg = OrderedRing.ring OR
      hx = residualSquareNonzero_v140 ha hr
      hxx = OrderedRing.squarePositive hx
      hlt = OrderedRing.subLtZero hr
      hmul = OrderedRing.mulLtPosLeft hlt hxx
  in'''
          replace_once(q_old, q_new, 'qProjectionCross_v141')

          start = s.index('orderedFieldCrossStrict_v142 a b d e hd he h =')
          end = s.index('\n\n------------------------------------------------------------------------\n-- Strict deletion from a negative residual: yd < nz.', start)
          ordered = '''orderedFieldCrossStrict_v142 a b d e hd he h =
  OrderedRing.mulLtPosCancelLeft (transportLt_v142 leftNorm rightNorm h) hc
  where
  Rg = OrderedRing.ring (SmoothAlgebra.orderedRing _)
  c = d * e
  hc = OrderedRing.mulPos hd he
  rd = SmoothAlgebra.recip _ d
  re = SmoothAlgebra.recip _ e

  innerLeft : rd * c ≡ e
  innerLeft =
    trans (sym (Ring.mulAssoc Rg rd d e))
      (trans (cong (λ q → q * e) (Ring.mulComm Rg rd d))
        (trans (cong (λ q → q * e) (SmoothAlgebra.reciprocalLaw _ hd))
          (Ring.mulOneL Rg e)))

  leftNorm : c * (a * rd) ≡ a * e
  leftNorm =
    trans (Ring.mulComm Rg c (a * rd))
      (trans (Ring.mulAssoc Rg a rd c)
        (cong (λ q → a * q) innerLeft))

  innerRight : re * c ≡ d
  innerRight =
    trans (sym (Ring.mulAssoc Rg re e d))
      (trans (cong (λ q → q * d) (Ring.mulComm Rg re e))
        (trans (cong (λ q → q * d) (SmoothAlgebra.reciprocalLaw _ he))
          (Ring.mulOneL Rg d)))

  rightNorm : c * (b * re) ≡ b * d
  rightNorm =
    trans (Ring.mulComm Rg c (b * re))
      (trans (Ring.mulAssoc Rg b re c)
        (cong (λ q → b * q) innerRight))'''
          s = s[:start] + ordered + s[end:]

          start = s.index('multiplierDeletionStrict_v142 n d y z hd he h =')
          end = s.index('\n\n------------------------------------------------------------------------\n-- Fixed-mask q-projection transpose.', start)
          multiplier = '''multiplierDeletionStrict_v142 n d y z hd he h =
  let Rg = OrderedRing.ring (SmoothAlgebra.orderedRing _)
      hnz = OrderedRing.negLt h
      base = n * d
      lhs = trans (Ring.distrib Rg n d (neg z))
        (cong₂ _+_ refl (sym (Ring.negScale Rg n z)))
      rhs = trans (Ring.distrib Rg d n (neg y))
        (trans (cong₂ _+_ (Ring.mulComm Rg d n) refl)
          (cong₂ _+_ refl
            (trans (Ring.mulComm Rg (neg y) d)
              (sym (Ring.negScale Rg y d)))))
      cross = OrderedRing.addLtLeft hnz base
      cross' = transportLt_v142 lhs rhs cross
  in orderedFieldCrossStrict_v142 n (n + neg y) d (d + neg z) hd he cross'
'''
          s = s[:start] + multiplier + s[end:]

          p.write_text(s)
          PY
          git diff --check
      - name: Authoritative Agda check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit repaired source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda .github/workflows/oneshot-agda-repair.yml .ci/closure-trigger.txt
          git commit -m 'Advance finite algebra closure'
          git rm .github/workflows/oneshot-agda-repair.yml .ci/closure-trigger.txt
          git commit -m 'Remove one-shot closure helper'
          git push origin HEAD:ci/v148-firstclass-lstm-chad
