name: One-shot Agda source repair
on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply exact finite source repairs
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'p = "Exotic/ERL/FullCoupled/CompleteSafe_v147.agda"; s = File.read(p); old = "  runState (state c) = c\n\n  accumulate : Fin n → R → EState → EState\n  accumulateAt : Fin n -> R -> Cot -> Cot\n  accumulateAt i c s j with finDecEq j i\n    ... | yes _ = s j + c\n    ... | no _ = s j\n\n  accumulate i c (state s) = state (accumulateAt i c s)\n"; new = "  runState (state c) = c\n\n  addIfEqual : ∀ {i j : Fin n} → Dec (i ≡ j) → R → R → R\n  addIfEqual (yes _) x c = x + c\n  addIfEqual (no _) x c = x\n\n  accumulateAt : Fin n → R → Cot → Cot\n  accumulateAt i c s j = addIfEqual (finDecEq j i) (s j) c\n\n  accumulate : Fin n → R → EState → EState\n  accumulate i c (state s) = state (accumulateAt i c s)\n"; abort "finite accumulate block not found" unless s.include?(old); s = s.sub(old, new); start = "residualSquareNonzero_v140 ha hr hx ="; a = s.index(start); abort "residual theorem not found" unless a; finish = "\n\n------------------------------------------------------------------------\n-- The clean, reusable cross-multiplication theorem"; b = s.index(finish, a); abort "residual theorem boundary not found" unless b; replacement = "residualSquareNonzero_v140 ha hr hx =\n  ⊥-elim (OrderedRing.notLtFromLe ha\n    (subst (λ q → zero ≤ q)\n      (trans\n        (cong (λ q → alpha + Ring.neg (OrderedRing.ring _) (mu * q))\n          (cong₂ (Ring._*_ (OrderedRing.ring _)) hx hx))\n        (Ring.addZeroR (OrderedRing.ring _) alpha))\n      hr))"; s = s[0...a] + replacement + s[b..]; old2 = "qProjectionCross_v141 ha hr =\n  let OR = SmoothAlgebra.orderedRing _\n      Rg = OrderedRing.ring OR\n      hx : x ≠ zero = residualSquareNonzero_v140 ha hr\n      hxx : zero < x * x = OrderedRing.squarePositive hx\n      hlt : alpha < mu * (x * x) = OrderedRing.subLtZero hr\n      hmul = OrderedRing.mulLtPosLeft hlt hxx\n  in trans\n       (trans\n         (sym (Ring.mulComm Rg alpha (x * x)))\n         hmul)\n       (trans\n         (Ring.mulComm Rg (x * x) (mu * (x * x)))\n         (sym (Ring.mulAssoc Rg mu (x * x) (x * x))))"; new2 = "qProjectionCross_v141 ha hr =\n  let OR = SmoothAlgebra.orderedRing _\n      Rg = OrderedRing.ring OR\n      hx = residualSquareNonzero_v140 ha hr\n      hxx = OrderedRing.squarePositive hx\n      hlt = OrderedRing.subLtZero hr\n      hmul = OrderedRing.mulLtPosLeft hlt hxx\n  in trans\n       (trans\n         (sym (Ring.mulComm Rg alpha (x * x)))\n         hmul)\n       (trans\n         (Ring.mulComm Rg (x * x) (mu * (x * x)))\n         (sym (Ring.mulAssoc Rg mu (x * x) (x * x))))"; abort "cross theorem local block not found" unless s.include?(old2); s = s.sub(old2, new2); s = s.gsub(/^      (leftNorm|rightNorm) : .* =$/) { "      #{$1} =" }; File.write(p, s)'
          git diff --check
      - name: Authoritative Agda check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit repaired source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda .github/workflows/oneshot-agda-repair.yml .ci/closure-trigger.txt
          git commit -m 'Flatten ordered-field local proof bindings'
          git rm .github/workflows/oneshot-agda-repair.yml .ci/closure-trigger.txt
          git commit -m 'Remove one-shot closure helper'
          git push origin HEAD:ci/v148-firstclass-lstm-chad
