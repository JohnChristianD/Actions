name: One-shot Agda source repair
on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply exact finite source repairs
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'p = "Exotic/ERL/FullCoupled/CompleteSafe_v147.agda"; s = File.read(p); old = "  runState (state c) = c\n\n  accumulate : Fin n → R → EState → EState\n  accumulateAt : Fin n -> R -> Cot -> Cot\n  accumulateAt i c s j with finDecEq j i\n    ... | yes _ = s j + c\n    ... | no _ = s j\n\n  accumulate i c (state s) = state (accumulateAt i c s)\n"; new = "  runState (state c) = c\n\n  addIfEqual : ∀ {i j : Fin n} → Dec (i ≡ j) → R → R → R\n  addIfEqual (yes _) x c = x + c\n  addIfEqual (no _) x c = x\n\n  accumulateAt : Fin n → R → Cot → Cot\n  accumulateAt i c s j = addIfEqual (finDecEq j i) (s j) c\n\n  accumulate : Fin n → R → EState → EState\n  accumulate i c (state s) = state (accumulateAt i c s)\n"; abort "finite accumulate block not found" unless s.include?(old); s = s.sub(old, new); start = "residualSquareNonzero_v140 ha hr hx ="; a = s.index(start); abort "residual theorem not found" unless a; finish = "\n\n------------------------------------------------------------------------\n-- The clean, reusable cross-multiplication theorem"; b = s.index(finish, a); abort "residual theorem boundary not found" unless b; replacement = "residualSquareNonzero_v140 ha hr hx =\n  ⊥-elim (OrderedRing.notLtFromLe ha hcontra)\n  where\n  Rg = OrderedRing.ring (SmoothAlgebra.orderedRing _)\n\n  hxx : hx * hx ≡ Ring.zero Rg\n  hxx = trans (cong₂ (Ring._*_ Rg) hx hx) (Ring.zeroMulR Rg _)\n\n  hmu : mu * (hx * hx) ≡ Ring.zero Rg\n  hmu = trans (cong (λ q → mu * q) hxx) (Ring.zeroMulR Rg mu)\n\n  hneg : Ring.neg Rg (mu * (hx * hx)) ≡ Ring.zero Rg\n  hneg =\n    trans (cong (Ring.neg Rg) hmu)\n      (trans (sym (Ring.addZeroL Rg (Ring.neg Rg (Ring.zero Rg))))\n        (trans (Ring.addComm Rg (Ring.zero Rg) (Ring.neg Rg (Ring.zero Rg)))\n          (Ring.addNegL Rg (Ring.zero Rg))))\n\n  hzero : alpha + Ring.neg Rg (mu * (hx * hx)) ≡ alpha\n  hzero = trans (cong (λ q → alpha + q) hneg) (Ring.addZeroR Rg alpha)\n\n  hcontra : Ring.zero Rg ≤ alpha + Ring.neg Rg (mu * (hx * hx))\n  hcontra = subst (λ q → Ring.zero Rg ≤ q) hzero (OrderedRing.refl≤ (OrderedRing.ring (SmoothAlgebra.orderedRing _)) alpha)"; s = s[0...a] + replacement + s[b..]; qstart = "qProjectionCross_v141 ha hr =\n  let OR = SmoothAlgebra.orderedRing _\n      Rg = OrderedRing.ring OR\n      hx : x ≠ zero = residualSquareNonzero_v140 ha hr\n      hxx : zero < x * x = OrderedRing.squarePositive hx\n      hlt : alpha < mu * (x * x) = OrderedRing.subLtZero hr\n      hmul = OrderedRing.mulLtPosLeft hlt hxx\n  in"; qnew = "qProjectionCross_v141 ha hr =\n  let OR = SmoothAlgebra.orderedRing _\n      Rg = OrderedRing.ring OR\n      hx = residualSquareNonzero_v140 ha hr\n      hxx = OrderedRing.squarePositive hx\n      hlt = OrderedRing.subLtZero hr\n      hmul = OrderedRing.mulLtPosLeft hlt hxx\n  in"; abort "qProjection block not found" unless s.include?(qstart); s = s.sub(qstart, qnew); old2a = "orderedFieldCrossStrict_v142 a b d e hd he h =\n  let Rg = OrderedRing.ring (SmoothAlgebra.orderedRing _)"; aa = s.index(old2a); abort "orderedField theorem start not found" unless aa; bb = s.index("\n\n------------------------------------------------------------------------\n-- Strict deletion from a negative residual: yd < nz.", aa); abort "orderedField theorem boundary not found" unless bb; replacement2 = "orderedFieldCrossStrict_v142 a b d e hd he h =\n  OrderedRing.mulLtPosCancelLeft (transportLt_v142 leftNorm rightNorm h) hc\n  where\n  Rg = OrderedRing.ring (SmoothAlgebra.orderedRing _)\n  c = d * e\n  hc = OrderedRing.mulPos hd he\n\n  leftNorm : c * (a * SmoothAlgebra.recip _ d) ≡ a * e\n  leftNorm =\n    trans (Ring.mulComm Rg c (a * SmoothAlgebra.recip _ d))\n      (trans (Ring.mulAssoc Rg a (SmoothAlgebra.recip _ d) c)\n        (trans (cong (λ q → a * q)\n          (trans (sym (Ring.mulAssoc Rg (SmoothAlgebra.recip _ d) d e))\n            (trans (cong (λ q → q * e) (Ring.mulComm Rg (SmoothAlgebra.recip _ d) d))\n              (trans (cong (λ q → q * e) (SmoothAlgebra.reciprocalLaw _ hd))\n                (Ring.mulOneL Rg e))))) refl)\n\n  rightNorm : c * (b * SmoothAlgebra.recip _ e) ≡ b * d\n  rightNorm =\n    trans (Ring.mulComm Rg c (b * SmoothAlgebra.recip _ e))\n      (trans (Ring.mulAssoc Rg b (SmoothAlgebra.recip _ e) c)\n        (trans (cong (λ q → b * q)\n          (trans (sym (Ring.mulAssoc Rg (SmoothAlgebra.recip _ e) e d))\n            (trans (cong (λ q → q * d) (Ring.mulComm Rg (SmoothAlgebra.recip _ e) e))\n              (trans (cong (λ q → q * d) (SmoothAlgebra.reciprocalLaw _ he))\n                (Ring.mulOneL Rg d))))) refl)"; s = s[0...aa] + replacement2 + s[bb..]; File.write(p, s)'
          git diff --check
      - name: Authoritative Agda check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit repaired source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda .github/workflows/oneshot-agda-repair.yml .ci/closure-trigger.txt
          git commit -m 'Close reciprocal finite algebra proof'
          git rm .github/workflows/oneshot-agda-repair.yml .ci/closure-trigger.txt
          git commit -m 'Remove one-shot closure helper'
          git push origin HEAD:ci/v148-firstclass-lstm-chad
