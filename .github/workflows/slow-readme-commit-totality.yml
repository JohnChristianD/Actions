name: Slow README commit totality

on:
  schedule:
    - cron: '17 3 * * 1'
      timezone: "Asia/Manila"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Update README from commit totality
        run: nix run .#slow-readme-update

      - name: Synchronize GitHub-facing documentation index
        run: nix run .#readme-doc-sync -- --write

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README from commit totality"
          git push origin HEAD:main
