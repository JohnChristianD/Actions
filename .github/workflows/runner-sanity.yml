# Minimal authoritative Agda gate.
name: Runner sanity
on:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth=1 https://github.com/JohnChristianD/Actions.git work && cd work && curl -fsSL https://github.com/agda/agda/releases/download/v2.8.0/Agda-v2.8.0-linux.tar.xz -o /tmp/agda.tar.xz && tar xf /tmp/agda.tar.xz && mkdir -p "$HOME/.local/bin" && mv agda "$HOME/.local/bin/agda" && echo "$HOME/.local/bin" >> "$GITHUB_PATH" && agda --version && python3 .ci/repair-agda-syntax.py && python3 -c 'from pathlib import Path; import re; p=Path("Exotic/ERL/FullCoupled/CompleteSafe_v147.agda"); s=p.read_text(); q=re.compile(r"(?m)^(\\s*)initialForm\\s*:\\s*QRun_v142\\.projection\\s*\\n\\1\\s+\\(initialQRun_v142 D budget p x\\)\\s+≡\\s+p\\s*="); s,n=q.subn(r"\\1initialForm =",s,count=1); assert n==1, n; a="  accumulate i c (state s) = state (λ j with finDecEq j i\\n    ... | yes _ = s j + c\\n    ... | no _ = s j)\\n"; b="  accumulateAt : Fin n → R → Cot → Cot\\n  accumulateAt i c s j with finDecEq j i\\n    ... | yes _ = s j + c\\n    ... | no _ = s j\\n\\n  accumulate i c (state s) = state (accumulateAt i c s)\\n"; assert a in s; p.write_text(s.replace(a,b,1))' && agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda