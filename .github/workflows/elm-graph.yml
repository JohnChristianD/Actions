name: Elm graph workload verification

on:
  push:
    branches:
      - main
      - "feat/**"
      - "mirth-general-workload"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elm-graph:
    name: Build Dhall-backed Elm graph and validate Mirth workload
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'

      - name: Build Elm graph bundle
        run: |
          set -euo pipefail
          nix run .#elm-graph-build
          test -s workloads/elm-graph/dist/elm.js

      - name: Validate Dhall source and no JSON source artifacts
        run: |
          set -euo pipefail
          nix run .#ci -- text --file workloads/elm-graph/graph.dhall >/dev/null
          nix run .#ci -- text --file workloads/elm-graph/elm-project.dhall >/dev/null
          test -f workloads/elm-graph/graph.dhall
          test -f workloads/elm-graph/elm-project.dhall
          test ! -e workloads/elm-graph/elm.json
          test ! -e workloads/elm-graph/demo-graph.json
          ! git ls-files '*.json' | grep -q .

      - name: Validate Mirth workload
        run: |
          set -euo pipefail
          nix run nixpkgs#mirth -- -c workloads/mirth/graph-adapter.mth
