name: Elm graph workload verification

on:
  push:
    branches:
      - main
      - "feat/**"
      - "mirth-general-workload"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elm-graph:
    name: Build Dhall-backed Elm graph and validate Mirth workload
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'

      - name: Build Elm graph bundle
        run: |
          set -euo pipefail
          nix run .#elm-graph-build
          test -s workloads/elm-graph/dist/elm.js

      - name: Validate Dhall source and no JSON source artifacts
        run: |
          set -euo pipefail
          nix run .#ci -- text --file workloads/elm-graph/graph.dhall >/dev/null
          nix run .#ci -- text --file workloads/elm-graph/elm-project.dhall >/dev/null
          test -f workloads/elm-graph/graph.dhall
          test -f workloads/elm-graph/elm-project.dhall
          test ! -e workloads/elm-graph/elm.json
          test ! -e workloads/elm-graph/demo-graph.json
          ! git ls-files '*.json' | grep -q .

      - name: Validate Mirth workload
        run: |
          set -euo pipefail
          nix run .#mirth-workload-check

      - name: Prepare GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/elm-pages"
          mkdir -p "${RUNNER_TEMP}/elm-pages/dist"
          cp workloads/elm-graph/index.html "${RUNNER_TEMP}/elm-pages/index.html"
          cp workloads/elm-graph/dist/elm.js "${RUNNER_TEMP}/elm-pages/dist/elm.js"
          touch "${RUNNER_TEMP}/elm-pages/.nojekyll"

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/elm-pages

  deploy:
    name: Deploy Elm graph to GitHub Pages
    needs: elm-graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
