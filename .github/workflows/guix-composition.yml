name: Guix connected composition verification

on:
  push:
    branches: [main, guix-composition-ci]
    paths:
      - ".guix/**"
      - ".ci/**"
      - "oracle/**"
      - "Exotic/ERL/FullCoupled/**"
      - "Exotic/econlib/**"
      - ".github/workflows/guix-composition.yml"
  pull_request:
    branches: [main]
    paths:
      - ".guix/**"
      - ".ci/**"
      - "oracle/**"
      - "Exotic/ERL/FullCoupled/**"
      - "Exotic/econlib/**"
      - ".github/workflows/guix-composition.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: guix-connected-composition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agda-safe:
    name: Guix / Agda --safe connected theorem surface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: jas4711/guix@sha256:1ecca8f90bdc59d0fac97700aa18e6e0677de8b75dc9ffc16bf7452b240d8f52
    defaults:
      run:
        shell: sh
    steps:
      - name: Guile-native source checkout
        run: |
          set -eu
          workspace="${GITHUB_WORKSPACE}"
          repository="${GITHUB_REPOSITORY}"
          sha="${GITHUB_SHA}"
          ref="${GITHUB_REF}"
          mkdir -p "${workspace}"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" init -q
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" remote remove origin >/dev/null 2>&1 || true
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" remote add origin \
              "https://github.com/${repository}.git"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" fetch --depth=1 origin "${ref}"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" checkout --detach "${sha}"
      - name: Run pinned Guix Agda lane
        env:
          CI_LANE: agda-safe
        run: |
          guix time-machine -C .guix/channels.scm -- shell --pure -m .guix/manifest.scm -- guile .guix/ci.scm

  mercury:
    name: Guix / Mercury connected theorem and verifier lane
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: jas4711/guix@sha256:1ecca8f90bdc59d0fac97700aa18e6e0677de8b75dc9ffc16bf7452b240d8f52
    defaults:
      run:
        shell: sh
    steps:
      - name: Guile-native source checkout
        run: |
          set -eu
          workspace="${GITHUB_WORKSPACE}"
          repository="${GITHUB_REPOSITORY}"
          sha="${GITHUB_SHA}"
          mkdir -p "${workspace}"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" init -q
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" remote remove origin >/dev/null 2>&1 || true
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" remote add origin \
              "https://github.com/${repository}.git"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" fetch --depth=1 origin "${sha}"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" checkout --detach "${sha}"
      - name: Run pinned Guix Mercury lane
        env:
          CI_LANE: mercury
        run: |
          guix time-machine -C .guix/channels.scm -- shell --pure -m .guix/manifest.scm -- guile .guix/ci.scm

  discovery:
    name: Guix / Mercury finite discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: jas4711/guix@sha256:1ecca8f90bdc59d0fac97700aa18e6e0677de8b75dc9ffc16bf7452b240d8f52
    defaults:
      run:
        shell: sh
    steps:
      - name: Guile-native source checkout
        run: |
          set -eu
          workspace="${GITHUB_WORKSPACE}"
          repository="${GITHUB_REPOSITORY}"
          sha="${GITHUB_SHA}"
          mkdir -p "${workspace}"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" init -q
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" remote remove origin >/dev/null 2>&1 || true
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" remote add origin \
              "https://github.com/${repository}.git"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" fetch --depth=1 origin "${sha}"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" checkout --detach "${sha}"
      - name: Run pinned Mercury discovery lane
        env:
          CI_LANE: discovery
        run: |
          guix time-machine -C .guix/channels.scm -- shell --pure -m .guix/manifest.scm -- guile .guix/ci.scm
      - name: Verify discovery artifact is present
        run: |
          set -eu
          test -f ".ci/discovery/last-search.json"
          test -f ".ci/discovery/openes-composition-candidate.json"
          test -f ".ci/discovery/gesmr-composition-candidate.json"
          test -f ".ci/discovery/tsts-pvs-composition-candidate.json"
          printf '%s\n' "discovery-report=present"
          printf '%s\n' "openes-composition-report=present"
          printf '%s\n' "gesmr-composition-report=present"
          printf '%s\n' "tsts-pvs-composition-report=present"

  surface:
    name: Guix / no Haskell, Python, JVM, JS, or alternate-language surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: jas4711/guix@sha256:1ecca8f90bdc59d0fac97700aa18e6e0677de8b75dc9ffc16bf7452b240d8f52
    defaults:
      run:
        shell: sh
    steps:
      - name: Guile-native source checkout
        run: |
          set -eu
          workspace="${GITHUB_WORKSPACE}"
          repository="${GITHUB_REPOSITORY}"
          sha="${GITHUB_SHA}"
          mkdir -p "${workspace}"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" init -q
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" remote remove origin >/dev/null 2>&1 || true
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" remote add origin \
              "https://github.com/${repository}.git"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" fetch --depth=1 origin "${sha}"
          guix shell --pure git nss-certs -- \
            git -C "${workspace}" checkout --detach "${sha}"
      - name: Audit repository surface
        env:
          CI_LANE: surface
        run: |
          guix time-machine -C .guix/channels.scm -- shell --pure -m .guix/manifest.scm -- guile .guix/ci.scm
