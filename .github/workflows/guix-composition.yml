name: Guix connected composition verification

on:
  push:
    branches: [main, guix-composition-ci]
    paths:
      - ".guix/**"
      - ".ci/**"
      - "oracle/**"
      - "Exotic/ERL/FullCoupled/**"
      - "Exotic/econlib/**"
      - ".github/workflows/guix-composition.yml"
  pull_request:
    branches: [main]
    paths:
      - ".guix/**"
      - ".ci/**"
      - "oracle/**"
      - "Exotic/ERL/FullCoupled/**"
      - "Exotic/econlib/**"
      - ".github/workflows/guix-composition.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: guix-connected-composition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agda-safe:
    name: Guix / Agda --safe connected theorem surface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: jas4711/guix@sha256:1ecca8f90bdc59d0fac97700aa18e6e0677de8b75dc9ffc16bf7452b240d8f52
    defaults:
      run:
        shell: guix shell --pure guile -- guile --no-auto-compile {0}
    steps:
      - name: Guile-native source checkout
        run: |
          (define workspace (getenv "GITHUB_WORKSPACE"))
          (define repository (getenv "GITHUB_REPOSITORY"))
          (define sha (getenv "GITHUB_SHA"))
          (system* "guix" "shell" "--pure" "git" "nss-certs" "--"
                   "git" "clone" "--filter=blob:none" "--no-checkout"
                   (string-append "https://github.com/" repository ".git")
                   workspace)
          (system* "guix" "shell" "--pure" "git" "nss-certs" "--"
                   "git" "-C" workspace "checkout" "--detach" sha)
      - name: Run pinned Guix Agda lane
        env:
          CI_LANE: agda-safe
        run: |
          (load ".guix/ci.scm")

  mercury:
    name: Guix / Mercury connected theorem and verifier lane
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: jas4711/guix@sha256:1ecca8f90bdc59d0fac97700aa18e6e0677de8b75dc9ffc16bf7452b240d8f52
    defaults:
      run:
        shell: guix shell --pure guile -- guile --no-auto-compile {0}
    steps:
      - name: Guile-native source checkout
        run: |
          (define workspace (getenv "GITHUB_WORKSPACE"))
          (define repository (getenv "GITHUB_REPOSITORY"))
          (define sha (getenv "GITHUB_SHA"))
          (system* "guix" "shell" "--pure" "git" "nss-certs" "--"
                   "git" "clone" "--filter=blob:none" "--no-checkout"
                   (string-append "https://github.com/" repository ".git")
                   workspace)
          (system* "guix" "shell" "--pure" "git" "nss-certs" "--"
                   "git" "-C" workspace "checkout" "--detach" sha)
      - name: Run pinned Guix Mercury lane
        env:
          CI_LANE: mercury
        run: |
          (load ".guix/ci.scm")

  discovery:
    name: Guix / Mercury finite discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: jas4711/guix@sha256:1ecca8f90bdc59d0fac97700aa18e6e0677de8b75dc9ffc16bf7452b240d8f52
    defaults:
      run:
        shell: guix shell --pure guile -- guile --no-auto-compile {0}
    steps:
      - name: Guile-native source checkout
        run: |
          (define workspace (getenv "GITHUB_WORKSPACE"))
          (define repository (getenv "GITHUB_REPOSITORY"))
          (define sha (getenv "GITHUB_SHA"))
          (system* "guix" "shell" "--pure" "git" "nss-certs" "--"
                   "git" "clone" "--filter=blob:none" "--no-checkout"
                   (string-append "https://github.com/" repository ".git")
                   workspace)
          (system* "guix" "shell" "--pure" "git" "nss-certs" "--"
                   "git" "-C" workspace "checkout" "--detach" sha)
      - name: Run pinned Mercury discovery lane
        env:
          CI_LANE: discovery
        run: |
          (load ".guix/ci.scm")
      - name: Verify discovery artifact is present
        run: |
          (if (file-exists? ".ci/discovery/last-search.json")
              (format #t "discovery-report=present~%")
              (begin
                (format #t "ERROR: discovery report missing~%")
                (exit 1)))

  surface:
    name: Guix / no Haskell, Python, JVM, JS, or alternate-language surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: jas4711/guix@sha256:1ecca8f90bdc59d0fac97700aa18e6e0677de8b75dc9ffc16bf7452b240d8f52
    defaults:
      run:
        shell: guix shell --pure guile -- guile --no-auto-compile {0}
    steps:
      - name: Guile-native source checkout
        run: |
          (define workspace (getenv "GITHUB_WORKSPACE"))
          (define repository (getenv "GITHUB_REPOSITORY"))
          (define sha (getenv "GITHUB_SHA"))
          (system* "guix" "shell" "--pure" "git" "nss-certs" "--"
                   "git" "clone" "--filter=blob:none" "--no-checkout"
                   (string-append "https://github.com/" repository ".git")
                   workspace)
          (system* "guix" "shell" "--pure" "git" "nss-certs" "--"
                   "git" "-C" workspace "checkout" "--detach" sha)
      - name: Audit repository surface
        env:
          CI_LANE: surface
        run: |
          (load ".guix/ci.scm")
