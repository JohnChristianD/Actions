name: Guix connected composition verification

on:
  push:
    branches: [main, guix-composition-ci]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: guix-connected-composition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  agda-safe:
    name: Guix / Agda --safe connected theorem surface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI_LANE: agda-safe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install prepared Guix action
        uses: ROCKTAKEY/guix-install-action@40615e98e5c16a451aec10fe01c214ed07cbaa77
        with:
          pullAfterInstall: false
      - name: Install Agda 2.8.0.2 and stdlib 2.4
        id: setup-agda
        uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - name: Run pinned Agda lane inside Guix
        run: |
          set -euo pipefail
          agda_path="${{ steps.setup-agda.outputs.agda-path }}"
          "$agda_path" --version
          export AGDA_COMMAND="$agda_path"
          guix shell --pure --preserve='^(AGDA_COMMAND|AGDA_DIR|HOME)$' -m .guix/manifest.scm -- guile .guix/ci.scm

  mercury:
    needs: [agda-safe]
    name: Guix / Mercury connected theorem and verifier lane
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI_LANE: mercury
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install prepared Guix action
        uses: ROCKTAKEY/guix-install-action@40615e98e5c16a451aec10fe01c214ed07cbaa77
        with:
          pullAfterInstall: false
      - name: Install Mercury 22.01.8
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          cd /tmp
          wget -q https://paul.bone.id.au/paul.asc
          sudo cp paul.asc /etc/apt/trusted.gpg.d/paulbone.asc
          echo "deb http://dl.mercurylang.org/deb/ jammy main" | sudo tee /etc/apt/sources.list.d/mercury.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y mercury-recommended
          mmc --version
          echo "MERCURY_COMMAND=$(command -v mmc)" >> "$GITHUB_ENV"
      - name: Run Mercury verifier lane
        run: |
          set -euo pipefail
          guix shell --pure --preserve='^(MERCURY_COMMAND|PATH|HOME)$' -m .guix/manifest.scm -- guile .guix/ci.scm

  discovery:
    needs: [agda-safe]
    name: Guix / Mercury semantic e-graph discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI_LANE: discovery
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install prepared Guix action
        uses: ROCKTAKEY/guix-install-action@40615e98e5c16a451aec10fe01c214ed07cbaa77
        with:
          pullAfterInstall: false
      - name: Install Mercury 22.01.8
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          cd /tmp
          wget -q https://paul.bone.id.au/paul.asc
          sudo cp paul.asc /etc/apt/trusted.gpg.d/paulbone.asc
          echo "deb http://dl.mercurylang.org/deb/ jammy main" | sudo tee /etc/apt/sources.list.d/mercury.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y mercury-recommended
          mmc --version
          echo "MERCURY_COMMAND=$(command -v mmc)" >> "$GITHUB_ENV"
      - name: Run semantic e-graph discovery lane
        run: |
          set -euo pipefail
          guix shell --pure --preserve='^(MERCURY_COMMAND|PATH|HOME)$' -m .guix/manifest.scm -- guile .guix/ci.scm
      - name: Verify forced endogenous theorem discovery artifact is present
        run: |
          set -euo pipefail
          test -f ".ci/discovery/novel-learner-theorem-discovery.json"
          printf '%s\n' "novel-learner-theorem-discovery-report=present"

  surface:
    needs: [agda-safe]
    name: Guix / canonical source-policy surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CI_LANE: surface
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install prepared Guix action
        uses: ROCKTAKEY/guix-install-action@40615e98e5c16a451aec10fe01c214ed07cbaa77
        with:
          pullAfterInstall: false
      - name: Audit repository surface
        run: |
          set -euo pipefail
          guix shell --pure -m .guix/manifest.scm -- guile .guix/ci.scm
