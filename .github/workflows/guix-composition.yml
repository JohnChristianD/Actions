name: Guix connected composition verification

on:
  push:
    branches: [main, guix-composition-ci]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: guix-connected-composition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  GH_TOKEN: ${{ github.token }}
  GUIX_INSTALL_ACTION: ROCKTAKEY/guix-install-action@40615e98e5c16a451aec10fe01c214ed07cbaa77

jobs:
  agda-safe:
    name: Guix / Agda --safe connected theorem surface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI_LANE: agda-safe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install prepared Guix action
        uses: ROCKTAKEY/guix-install-action@40615e98e5c16a451aec10fe01c214ed07cbaa77
        with:
          pullAfterInstall: true
      - name: Run pinned Guix Agda lane
        run: |
          set -euo pipefail
          guix --version
          guix describe -f channels
          set +e
          log="$(mktemp)"
          guix shell --pure -m .guix/manifest.scm -- guile .guix/ci.scm >"$log" 2>&1
          status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            builder_log="$(grep -o '/var/log/guix/drvs/[^[:space:]]*\\.gz' "$log" | tail -n 1)"
            if [ -n "$builder_log" ] && [ -f "$builder_log" ]; then
              details="$(gzip -cd "$builder_log" 2>/dev/null | tail -n 100)"
            else
              details="$(tail -n 100 "$log")"
            fi
            summary="$(printf '%s\\nGuix command output:\\n%s' "$(printf '%s' "$details" | tail -n 80)" "$(tail -n 20 "$log")" | cut -c1-8000)"
            payload="$(jq -n \
              --arg sha "$GITHUB_SHA" \
              --arg summary "$summary" \
              '{name:"Guix lane diagnostic",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"Guix lane failed",summary:$summary}}')"
            printf '%s' "$payload" | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/check-runs" \
              --input - >/dev/null || true
          fi
          rm -f "$log"
          exit "$status"

  mercury:
    needs: [agda-safe]
    name: Guix / Mercury connected theorem and verifier lane
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI_LANE: mercury
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install prepared Guix action
        uses: ROCKTAKEY/guix-install-action@40615e98e5c16a451aec10fe01c214ed07cbaa77
        with:
          pullAfterInstall: true
      - name: Run pinned Guix Mercury lane
        run: |
          set -euo pipefail
          guix --version
          guix describe -f channels
          set +e
          log="$(mktemp)"
          guix shell --pure -m .guix/manifest.scm -- guile .guix/ci.scm >"$log" 2>&1
          status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            builder_log="$(grep -o '/var/log/guix/drvs/[^[:space:]]*\\.gz' "$log" | tail -n 1)"
            if [ -n "$builder_log" ] && [ -f "$builder_log" ]; then
              details="$(gzip -cd "$builder_log" 2>/dev/null | tail -n 100)"
            else
              details="$(tail -n 100 "$log")"
            fi
            summary="$(printf '%s\\nGuix command output:\\n%s' "$(printf '%s' "$details" | tail -n 80)" "$(tail -n 20 "$log")" | cut -c1-8000)"
            payload="$(jq -n \
              --arg sha "$GITHUB_SHA" \
              --arg summary "$summary" \
              '{name:"Guix lane diagnostic",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"Guix lane failed",summary:$summary}}')"
            printf '%s' "$payload" | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/check-runs" \
              --input - >/dev/null || true
          fi
          rm -f "$log"
          exit "$status"

  discovery:
    needs: [agda-safe]
    name: Guix / Mercury semantic e-graph discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI_LANE: discovery
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install prepared Guix action
        uses: ROCKTAKEY/guix-install-action@40615e98e5c16a451aec10fe01c214ed07cbaa77
        with:
          pullAfterInstall: true
      - name: Run pinned Mercury semantic e-graph discovery lane
        run: |
          set -euo pipefail
          guix --version
          guix describe -f channels
          set +e
          log="$(mktemp)"
          guix shell --pure -m .guix/manifest.scm -- guile .guix/ci.scm >"$log" 2>&1
          status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            builder_log="$(grep -o '/var/log/guix/drvs/[^[:space:]]*\\.gz' "$log" | tail -n 1)"
            if [ -n "$builder_log" ] && [ -f "$builder_log" ]; then
              details="$(gzip -cd "$builder_log" 2>/dev/null | tail -n 100)"
            else
              details="$(tail -n 100 "$log")"
            fi
            summary="$(printf '%s\\nGuix command output:\\n%s' "$(printf '%s' "$details" | tail -n 80)" "$(tail -n 20 "$log")" | cut -c1-8000)"
            payload="$(jq -n \
              --arg sha "$GITHUB_SHA" \
              --arg summary "$summary" \
              '{name:"Guix lane diagnostic",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"Guix lane failed",summary:$summary}}')"
            printf '%s' "$payload" | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/check-runs" \
              --input - >/dev/null || true
          fi
          rm -f "$log"
          exit "$status"
      - name: Verify forced endogenous theorem discovery artifact is present
        run: |
          set -euo pipefail
          test -f ".ci/discovery/novel-learner-theorem-discovery.json"
          printf '%s\n' "novel-learner-theorem-discovery-report=present"

  surface:
    needs: [agda-safe]
    name: Guix / canonical source-policy surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CI_LANE: surface
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install prepared Guix action
        uses: ROCKTAKEY/guix-install-action@40615e98e5c16a451aec10fe01c214ed07cbaa77
        with:
          pullAfterInstall: true
      - name: Audit repository surface
        run: |
          set -euo pipefail
          guix --version
          guix describe -f channels
          set +e
          log="$(mktemp)"
          guix shell --pure -m .guix/manifest.scm -- guile .guix/ci.scm >"$log" 2>&1
          status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            builder_log="$(grep -o '/var/log/guix/drvs/[^[:space:]]*\\.gz' "$log" | tail -n 1)"
            if [ -n "$builder_log" ] && [ -f "$builder_log" ]; then
              details="$(gzip -cd "$builder_log" 2>/dev/null | tail -n 100)"
            else
              details="$(tail -n 100 "$log")"
            fi
            summary="$(printf '%s\\nGuix command output:\\n%s' "$(printf '%s' "$details" | tail -n 80)" "$(tail -n 20 "$log")" | cut -c1-8000)"
            payload="$(jq -n \
              --arg sha "$GITHUB_SHA" \
              --arg summary "$summary" \
              '{name:"Guix lane diagnostic",head_sha:$sha,status:"completed",conclusion:"failure",output:{title:"Guix lane failed",summary:$summary}}')"
            printf '%s' "$payload" | gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/check-runs" \
              --input - >/dev/null || true
          fi
          rm -f "$log"
          exit "$status"
