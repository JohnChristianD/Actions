name: Agda kernel live gate
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Repair known syntax
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize q-retraction local declaration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '''      initialForm : QRun_v142.projection
          (initialQRun_v142 D budget p x) ≡ p =
'''
          if old in s:
              s = s.replace(old, '      initialForm =\n', 1)
          p.write_text(s)
          PY
      - name: Authoritative Agda safe check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
