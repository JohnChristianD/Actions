name: Agda kernel live gate
on:
  push:
    branches: ['ci/agda-v147-kernel-live']
# Minimal standalone kernel gate. No tooling job can mask an Agda failure.
name: Agda kernel live gate
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Repair known syntax
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize CompleteSafe Nat/Ring namespaces
        run: python3 .ci/normalize-completesafe-namespaces.py
      - name: Normalize CompleteSafe typed let bindings
        run: python3 .ci/normalize-completesafe-let-bindings.py
      - name: Normalize CompleteSafe initialForm binding
        run: python3 .ci/normalize-completesafe-initial-form.py
      - name: Normalize terminal projection uniqueness
        run: python3 .ci/normalize-terminal-uniqueness.py
      - name: Final exact OrderedRing qualification
        run: python3 .ci/final-qualify-ordered-fields.py
      - name: Kernel-check shared forward/Efficient-CHAD program
        run: agda --safe Exotic/ERL/FullCoupled/SharedNetworkCHAD.agda
      - name: Kernel-check first-class finite recurrent CHAD program
        run: agda --safe Exotic/ERL/FullCoupled/FirstClassRecurrentCHAD.agda
      - name: Normalize q-retraction local declaration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '''      initialForm : QRun_v142.projection
          (initialQRun_v142 D budget p x) ≡ p =
'''
          if old in s:
              s = s.replace(old, '      initialForm =\n', 1)
          p.write_text(s)
          PY
      - name: Authoritative Agda safe check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
