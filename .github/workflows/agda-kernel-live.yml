name: Agda kernel live gate
on:
  push:
    branches: ['ci/agda-v147-kernel-live']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Repair known syntax
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize CompleteSafe Nat/Ring namespaces
        run: python3 .ci/normalize-completesafe-namespaces.py
      - name: Normalize CompleteSafe initialForm binding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          pattern = r'(?m)^(\\s*)initialForm\\s*:\\s*QRun_v142\\.projection\\s*\\n\\1\\s+\\(initialQRun_v142 D budget p x\\)\\s+≡\\s+p\\s*='
          s2, count = re.subn(pattern, r'\\1initialForm =', s, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one initialForm binding, found {count}')
          p.write_text(s2)
          PY
      - name: Normalize terminal projection uniqueness
        run: python3 .ci/normalize-terminal-uniqueness.py
      - name: Authoritative Agda safe check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
