name: Agda kernel live gate
on:
  push:
    branches: ['ci/agda-v147-kernel-live']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Repair known syntax
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize CompleteSafe Nat/Ring namespaces
        run: python3 .ci/normalize-completesafe-namespaces.py
      - name: Normalize CompleteSafe typed let bindings
        run: python3 .ci/normalize-completesafe-let-bindings.py
      - name: Normalize terminal projection uniqueness
        run: python3 .ci/normalize-terminal-uniqueness.py
      - name: Diagnose transformed CompleteSafe parser frontier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          lines = p.read_text().splitlines()
          for n in range(max(1, 2532), min(len(lines), 2552) + 1):
              print(f'{n}: {lines[n-1]}')
          for n, line in enumerate(lines, 1):
              if re.search(r'^\s+[A-Za-z][A-Za-z0-9_]*\s*:\s*.+\s=', line):
                  print(f'possible-typed-let={n}:{line}')
          PY
      - name: Authoritative Agda safe check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
