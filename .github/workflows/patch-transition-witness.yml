name: One-shot TransitionWitness field repair

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  patch:
    if: "startsWith(github.event.head_commit.message, 'bootstrap: patch transition witness')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply local field rename
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Exotic/ERL/FullCoupled/GeneralFullCoupledTheoremsMonolith.agda')
          text = path.read_text()
          old = '''record TransitionWitness (C A : Set) : Set₁ where\n  constructor transitionWitness\n  field\n    decode : C → A\n    cnnStep : C → C\n    learnerStep : A → A\n    commute : ∀ c → decode (cnnStep c) ≡ learnerStep (decode c)\nopen TransitionWitness public\n\nCNNEquivalent : ∀ {C A} → TransitionWitness C A → C → C → Set\nCNNEquivalent W x y = decode W x ≡ decode W y\n\ncnnStep-preserves-equivalence : ∀ {C A} (W : TransitionWitness C A) {x y : C} →\n  CNNEquivalent W x y → CNNEquivalent W (cnnStep W x) (cnnStep W y)\ncnnStep-preserves-equivalence W eq =\n  trans (commute W _) (trans (cong (learnerStep W) eq) (sym (commute W _)))\n\niterateCNN : ∀ {C A} (W : TransitionWitness C A) → Nat → C → C\niterateCNN W zero c = c\niterateCNN W (suc n) c = cnnStep W (iterateCNN W n c)\n\niterateLearnerWitness : ∀ {C A} (W : TransitionWitness C A) → Nat → A → A\niterateLearnerWitness W zero a = a\niterateLearnerWitness W (suc n) a = learnerStep W (iterateLearnerWitness W n a)\n'''
          new = '''record TransitionWitness (C A : Set) : Set₁ where\n  constructor transitionWitness\n  field\n    decode : C → A\n    cnnStep : C → C\n    transitionStep : A → A\n    commute : ∀ c → decode (cnnStep c) ≡ transitionStep (decode c)\nopen TransitionWitness public\n\nCNNEquivalent : ∀ {C A} → TransitionWitness C A → C → C → Set\nCNNEquivalent W x y = decode W x ≡ decode W y\n\ncnnStep-preserves-equivalence : ∀ {C A} (W : TransitionWitness C A) {x y : C} →\n  CNNEquivalent W x y → CNNEquivalent W (cnnStep W x) (cnnStep W y)\ncnnStep-preserves-equivalence W eq =\n  trans (commute W _) (trans (cong (transitionStep W) eq) (sym (commute W _)))\n\niterateCNN : ∀ {C A} (W : TransitionWitness C A) → Nat → C → C\niterateCNN W zero c = c\niterateCNN W (suc n) c = cnnStep W (iterateCNN W n c)\n\niterateLearnerWitness : ∀ {C A} (W : TransitionWitness C A) → Nat → A → A\niterateLearnerWitness W zero a = a\niterateLearnerWitness W (suc n) a = transitionStep W (iterateLearnerWitness W n a)\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one TransitionWitness block to patch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit source repair and remove patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-transition-witness.yml
          git add Exotic/ERL/FullCoupled/GeneralFullCoupledTheoremsMonolith.agda .github/workflows/patch-transition-witness.yml
          git commit -m "fix: rename transition witness learner field"
          git push origin HEAD:main
