name: v149 accumulate lambda repair

on:
  push:
    branches: ['ci/v149-monolith-dedupe']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply exact lambda repair
        run: python3 .ci/v149-accumulate-lambda.py
      - name: Kernel-check repaired monolith
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Persist kernel-checked source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            echo 'accumulate helper already canonical'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: lift accumulate with-clause lambda'
          git push origin HEAD:ci/v149-monolith-dedupe
