name: v147 algebraic closure multi-language

on:
  push:
    branches: ["main", "v147-q-chad-agda-safe"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  algebraic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby and Rails
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'

      - name: Set up Python and SymPy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: '1.11.1.1413'

      - name: Install Scala and Elixir
        run: |
          sudo apt-get update
          sudo apt-get install -y scala elixir

      - name: Install symbolic oracle
        run: python -m pip install 'sympy==1.14.0'

      - name: Install Rails dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Nine-language algebraic closure gate plus Rails smoke lane
        run: ruby tools/solve_v147_algebra.rb

  agda:
    runs-on: ubuntu-latest
    needs: algebraic
    steps:
      - uses: actions/checkout@v4
      - name: Set up Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'
      - name: Install Agda through Cabal
        run: cabal update && cabal install Agda
      - name: Exact source required
        run: test -f Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Safe kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
