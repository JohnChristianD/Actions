name: v147 algebraic closure four-oracle

on:
  push:
    branches: ["main", "v147-q-chad-agda-safe"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  algebraic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Set up Kotlin
        uses: fwilhe2/setup-kotlin@main
        with:
          version: '2.0.21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic oracle
        run: python -m pip install 'sympy==1.14.0'
      - name: Four-oracle algebraic gate
        run: ruby tools/solve_v147_algebra.rb

  agda:
    runs-on: ubuntu-latest
    needs: algebraic
    steps:
      - uses: actions/checkout@v4
      - name: Set up Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'
      - name: Install Agda through Cabal
        run: cabal update && cabal install Agda
      - name: Exact source required
        run: test -f Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Safe kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
