name: v147 predictive algebraic gate

on:
  push:
    branches: ["main", "v147-q-chad-agda-safe"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  predictive-prescriptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'

      - name: Set up Python and SymPy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Scala
        run: sudo apt-get update && sudo apt-get install -y scala

      - name: Install SymPy
        run: python -m pip install 'sympy==1.14.0'

      - name: Haskell predictive prescription
        run: runhaskell oracles/QClosurePredictive_v147.hs

      - name: Scala predictive prescription
        run: |
          mkdir -p /tmp/v147-scala
          scalac -deprecation -unchecked -d /tmp/v147-scala oracles/QClosurePredictive_v147_scala.scala
          scala -cp /tmp/v147-scala QClosurePredictiveV147

      - name: SymPy predictive prescription
        run: python tools/sympy_solver_v147.py

      - name: Fast predictive gate
        run: |
          echo 'predictive-prescriptions=haskell+scala+sympy:PASS'
          echo 'ruby-rails-oracles=removed'
          echo 'remaining-oracle-sources=retained-for-full-suite'

  agda-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'
          cabal-update: true
      - name: Install Agda through Cabal
        run: cabal install Agda --overwrite-policy=always --installdir="$HOME/.local/bin"
      - name: Verify Agda executable
        run: agda --version
      - name: Exact source required
        run: test -f Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Safe kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
