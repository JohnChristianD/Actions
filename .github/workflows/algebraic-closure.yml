name: v147 predictive algebraic gate

on:
  push:
    branches: ["main", "v147-q-chad-agda-safe"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-agda-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v147-q-chad-agda-safe'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic CI syntax repair to v147 Agda
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text(encoding='utf-8')
          old = '''  accumulate : Fin n → R → EState → EState\n  accumulate i c (state s) = state (λ j with finDecEq j i\n    ... | yes _ = s j + c\n    ... | no _ = s j)\n'''
          new = '''  accumulateAt : Fin n → R → Cot → Cot\n  accumulateAt i c s j with finDecEq j i\n  ... | yes _ = s j + c\n  ... | no _ = s j\n\n  accumulate : Fin n → R → EState → EState\n  accumulate i c (state s) = state (accumulateAt i c s)\n'''
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('applied deterministic Agda parser repair')
          else:
              print('Agda parser repair already present')
          PY
      - name: Verify repaired source digest
        run: |
          test "$(wc -c < Exotic/ERL/FullCoupled/CompleteSafe_v147.agda)" = "125018"
          test "$(sha256sum Exotic/ERL/FullCoupled/CompleteSafe_v147.agda | cut -d' ' -f1)" = "d0e299412ca6db52ee3d7ad42334660d86ba8ad0dc45c8d8a8365111352a4d5b"
      - name: Commit exact Agda repair
        run: |
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            echo 'no Agda source change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'Repair v147 Agda safe syntax from CI'
          git push origin HEAD:v147-q-chad-agda-safe

  haskell-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Haskell compiler
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'
      - name: Native compile and run Haskell oracle
        run: |
          ghc -O2 -o /tmp/q_closure_predictive_v147_hs oracles/QClosurePredictive_v147.hs
          /tmp/q_closure_predictive_v147_hs

  scala-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JVM compiler
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Scala compiler
        run: sudo apt-get update && sudo apt-get install -y scala
      - name: Native compile and run Scala oracle
        run: |
          mkdir -p /tmp/v147-scala
          scalac -deprecation -unchecked -d /tmp/v147-scala oracles/QClosurePredictive_v147_scala.scala
          scala -cp /tmp/v147-scala QClosurePredictiveV147

  elixir-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Elixir/OTP compiler
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
          install-hex: false
          install-rebar: false
      - name: Run native BEAM oracle
        run: elixir oracles/q_closure_predictive_v147.exs

  clojure-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JVM
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Clojure compiler
        uses: DeLaGuardo/setup-clojure@3.7.0
        with:
          cli: '1.12.4.1597'
      - name: Run Clojure oracle
        run: clojure -M oracles/QClosurePredictive_v147.clj

  rust-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native compile and run Rust oracle
        run: |
          rustc --edition=2021 -O oracles/QClosurePredictive_v147.rs -o /tmp/q_closure_predictive_v147
          /tmp/q_closure_predictive_v147

  sympy-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python and SymPy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SymPy
        run: python -m pip install 'sympy==1.14.0'
      - name: Run symbolic algebra oracle
        run: python tools/sympy_solver_v147.py

  agda-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Agda installation
        run: agda --version
      - name: Exact source required
        run: test -f Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Verify repaired v147 source SHA-256
        run: |
          test "$(wc -c < Exotic/ERL/FullCoupled/CompleteSafe_v147.agda)" = "125018"
          test "$(sha256sum Exotic/ERL/FullCoupled/CompleteSafe_v147.agda | cut -d' ' -f1)" = "d0e299412ca6db52ee3d7ad42334660d86ba8ad0dc45c8d8a8365111352a4d5b"
      - name: Safe kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Safe interpolation kernel check
        run: agda --safe Exotic/ERL/FullCoupled/CIInterpolation_v147.agda

  proof-interpolation:
    if: always()
    needs:
      - haskell-oracle
      - scala-oracle
      - elixir-oracle
      - clojure-oracle
      - rust-oracle
      - sympy-oracle
      - agda-safe
    runs-on: ubuntu-latest
    env:
      ORACLE_HASKELL: ${{ needs.haskell-oracle.result }}
      ORACLE_SCALA: ${{ needs.scala-oracle.result }}
      ORACLE_ELIXIR: ${{ needs.elixir-oracle.result }}
      ORACLE_CLOJURE: ${{ needs.clojure-oracle.result }}
      ORACLE_RUST: ${{ needs.rust-oracle.result }}
      ORACLE_SYMPY: ${{ needs.sympy-oracle.result }}
      ORACLE_AGDA: ${{ needs.agda-safe.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Agda installation
        run: agda --version
      - name: Run automated proof interpolation
        run: python3 tools/proof_interpolate_v147.py
      - name: Publish interpolation report and proof inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v147-proof-interpolation
          path: artifacts/
          if-no-files-found: error

  oracle-gate:
    if: always()
    needs:
      - haskell-oracle
      - scala-oracle
      - elixir-oracle
      - clojure-oracle
      - rust-oracle
      - sympy-oracle
      - agda-safe
      - proof-interpolation
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on any executable or proof-interpolation check
        run: |
          test "${{ needs.haskell-oracle.result }}" = success
          test "${{ needs.scala-oracle.result }}" = success
          test "${{ needs.elixir-oracle.result }}" = success
          test "${{ needs.clojure-oracle.result }}" = success
          test "${{ needs.rust-oracle.result }}" = success
          test "${{ needs.sympy-oracle.result }}" = success
          test "${{ needs.agda-safe.result }}" = success
          test "${{ needs.proof-interpolation.result }}" = success
          echo 'predictive-prescriptions=agda+haskell+scala+elixir+clojure+rust+sympy:PASS'
          echo 'agda-ci-interpolation=PASS'
          echo 'swift-ruby-ci=omitted-by-design'
