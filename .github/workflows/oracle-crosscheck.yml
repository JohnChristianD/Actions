name: Functional exact-rational oracle cross-check

on:
  push:
    branches: ['main', 'ci/v149-monolith-dedupe']
    paths:
      - 'Exotic/ERL/**/*.agda'
      - 'oracle/haskell_oracle.hs'
      - 'oracle/elixir_oracle.exs'
      - 'oracle/q_certificate.exs'
      - '.github/workflows/oracle-crosscheck.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'Exotic/ERL/**/*.agda'
      - 'oracle/haskell_oracle.hs'
      - 'oracle/q_certificate.exs'
      - '.github/workflows/oracle-crosscheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rational-oracles:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        oracle: [haskell, elixir]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell
        if: matrix.oracle == 'haskell'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'

      - name: Run Haskell exact-Rational oracle
        if: matrix.oracle == 'haskell'
        run: runghc .ci/exact_rational_oracle_v150.hs > oracle-output.txt

      - name: Set up Elixir
        if: matrix.oracle == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          install-hex: true
          install-rebar: false

      - name: Run Elixir exact-Rational oracle
        if: matrix.oracle == 'elixir'
        run: elixir oracle/elixir_oracle.exs > oracle-output.txt

      - name: Upload oracle output
        uses: actions/upload-artifact@v4
        with:
          name: exact-rational-${{ matrix.oracle }}
          path: oracle-output.txt
          if-no-files-found: error

  exact-rational-consistency:
    runs-on: ubuntu-24.04
    needs: exact-rational-oracles
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exact-rational-*
          path: oracle-results
          merge-multiple: false
      - name: Compare independent exact-Rational traces
        shell: bash
        run: |
          set -euo pipefail
          for f in oracle-results/exact-rational-*/oracle-output.txt; do
            sed -i 's/\r$//' "$f"
          done
          for f in oracle-results/exact-rational-*/oracle-output.txt; do
            grep -v '^oracle=' "$f" | grep -v '^status=' > "$f.normalized"
          done
          diff -u oracle-results/exact-rational-haskell/oracle-output.txt.normalized oracle-results/exact-rational-elixir/oracle-output.txt.normalized
          test "$(tail -n 1 oracle-results/exact-rational-haskell/oracle-output.txt)" = 'status=PASS'
          test "$(tail -n 1 oracle-results/exact-rational-elixir/oracle-output.txt)" = 'status=PASS'
          echo 'exact-rational-haskell-elixir-consistency=PASS'

  q-certificate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          install-hex: true
          install-rebar: false
      - name: Run Elixir exact-Rational q-projection certificate
        run: elixir oracle/q_certificate.exs
