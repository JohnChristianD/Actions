name: Functional and symbolic oracle cross-check

on:
  push:
    branches: ['ci/agda-v147-kernel-live']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-crosscheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Agda for shared CHAD gate
        uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'

      - name: Kernel-check shared finite CHAD program
        run: agda --safe Exotic/ERL/FullCoupled/SharedNetworkCHAD.agda

      - name: Install Haskell and Elixir oracle runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y ghc elixir

      - name: Produce Haskell trace
        run: runghc oracle/haskell_oracle.hs > oracle/haskell.csv

      - name: Produce Elixir trace
        run: elixir oracle/elixir_oracle.exs > oracle/elixir.csv

      - name: Compare independent functional traces
        run: |
          set -euo pipefail
          diff -u oracle/haskell.csv oracle/elixir.csv
          echo 'oracle-cross-check=PASS'

      - name: Emit ChatGPT-native prescriptive candidate surface
        run: |
          set -euo pipefail
          test -s oracle/prescriptive_candidates.txt
          grep -E '^(compose|iterate|reverse|normalize)\(' oracle/prescriptive_candidates.txt
          echo 'prescriptive-candidate-surface=READY-FOR-AGDA-CERTIFICATION'
