name: Functional exact-rational oracle cross-check

on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-crosscheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'

      - name: Run Haskell exact-rational LSTM oracle
        run: runghc oracle/haskell_oracle.hs > oracle/haskell.csv

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          hexpm: true
          rebar3: false

      - name: Run Elixir exact-rational LSTM oracle
        run: elixir oracle/elixir_oracle.exs > oracle/elixir.csv

      - name: Run Ruby exact Rational certificate
        run: ruby oracle/rational_certificate.rb

      - name: Run SymPy exact Rational certificate
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir sympy
          python3 oracle/sympy_rational_certificate.py

      - name: Compare exact rational functional traces
        run: |
          set -euo pipefail
          diff -u oracle/haskell.csv oracle/elixir.csv
          echo 'exact-rational-functional-oracle-cross-check=PASS'
