name: Functional LSTM oracle cross-check

on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-crosscheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Native Ruby exact certificate
        run: ruby oracle/rational_certificate.rb

      - name: Native SymPy exact certificate
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir sympy
          python3 oracle/sympy_rational_certificate.py
