name: Functional exact-rational oracle cross-check

on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-crosscheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'

      - name: Run Haskell exact-rational LSTM oracle
        run: runghc oracle/haskell_oracle.hs > oracle/haskell.csv

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          hexpm: true
          rebar3: false

      - name: Run Elixir exact-rational LSTM oracle
        run: elixir oracle/elixir_oracle.exs > oracle/elixir.csv

      - name: Compare exact rational functional traces
        run: |
          set -euo pipefail
          sed 's/\r$//' oracle/haskell.csv | sed '/^$/d' > oracle/haskell.normalized.csv
          sed 's/\r$//' oracle/elixir.csv | sed '/^$/d' > oracle/elixir.normalized.csv
          diff -u oracle/haskell.normalized.csv oracle/elixir.normalized.csv
          echo 'exact-rational-functional-oracle-cross-check=PASS'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run Ruby exact Rational certificate
        run: ruby oracle/rational_certificate.rb
