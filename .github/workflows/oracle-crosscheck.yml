name: Functional oracle cross-check

on:
  push:
    branches: ['ci/agda-v147-kernel-live']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-crosscheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Haskell and Elixir oracle runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y ghc elixir

      - name: Produce Haskell oracle trace
        run: runghc oracle/haskell_oracle.hs > oracle/haskell.csv

      - name: Produce Elixir oracle trace
        run: elixir oracle/elixir_oracle.exs > oracle/elixir.csv

      - name: Cross-check independent functional traces
        run: |
          set -euo pipefail
          diff -u oracle/haskell.csv oracle/elixir.csv
          echo 'oracle-cross-check=haskell-elixir=PASS'
