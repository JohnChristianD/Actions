name: Functional and symbolic oracle cross-check

on:
  push:
    branches: ['ci/agda-v147-kernel-live']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-crosscheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Haskell and Elixir oracle runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y ghc elixir python3-pip
          python3 -m pip install --break-system-packages sympy

      - name: Produce symbolic golden trace
        run: python3 oracle/sympy_oracle.py > oracle/golden.csv

      - name: Produce Haskell trace
        run: runghc oracle/haskell_oracle.hs > oracle/haskell.csv

      - name: Produce Elixir trace
        run: elixir oracle/elixir_oracle.exs > oracle/elixir.csv

      - name: Compare independent traces
        run: |
          set -euo pipefail
          diff -u oracle/golden.csv oracle/haskell.csv
          diff -u oracle/golden.csv oracle/elixir.csv
          echo 'oracle-cross-check=PASS'

      - name: Emit prescriptive candidate surface
        run: python3 oracle/prescriptive_search.py > oracle/prescriptive_candidates.txt
