name: Functional exact-rational oracle cross-check

on:
  pull_request:
    branches: ['main']
    paths:
      - 'oracle/**'
      - '.github/workflows/oracle-crosscheck.yml'

permissions:
  contents: read

jobs:
  oracle-crosscheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
      - name: Run Haskell exact-rational oracle
        run: runghc oracle/haskell_oracle.hs > oracle/haskell.csv
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          hexpm: true
          rebar3: false
      - name: Run Elixir exact-rational oracle
        run: elixir oracle/elixir_oracle.exs > oracle/elixir.csv
      - name: Compare exact rational functional traces
        run: |
          set -euo pipefail
          sed 's/\r$//' oracle/haskell.csv | sed '/^$/d' > oracle/haskell.normalized.csv
          sed 's/\r$//' oracle/elixir.csv | sed '/^$/d' > oracle/elixir.normalized.csv
          diff -u oracle/haskell.normalized.csv oracle/elixir.normalized.csv
          echo 'exact-rational-functional-oracle-cross-check=PASS'
