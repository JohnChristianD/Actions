name: Agda v152 composed double-sign safe gate

on:
  push:
    branches: ['ci/v149-monolith-dedupe']
    paths:
      - 'Exotic/ERL/FullCoupled/EfficientCHAD_DoubleSign_v151.agda'
      - 'Exotic/ERL/FullCoupled/EfficientCHAD_DoubleSign_Composed_v152.agda'
      - '.github/workflows/agda-double-sign-v152.yml'
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - run: agda --safe Exotic/ERL/FullCoupled/EfficientCHAD_DoubleSign_Composed_v152.agda
