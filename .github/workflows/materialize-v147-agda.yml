name: materialize exact v147 Agda source

on:
  push:
    branches: ["v147-q-chad-agda-safe"]
    paths:
      - "transfer/v147_payload_*.b64"
      - ".github/workflows/materialize-v147-agda.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-v147]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Exotic/ERL/FullCoupled
          cat \
            transfer/v147_payload_00.b64 \
            transfer/v147_payload_01.b64 \
            transfer/v147_payload_02.b64 \
            | base64 --decode \
            | gzip --decompress \
            > Exotic/ERL/FullCoupled/CompleteSafe_v147.agda

      - name: Verify exact byte count
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < Exotic/ERL/FullCoupled/CompleteSafe_v147.agda)" = "124939"

      - name: Verify exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "1e0036e35b85109a3dc822cda7663b363d5085a8c85869c545dd0c982109ad13  Exotic/ERL/FullCoupled/CompleteSafe_v147.agda" | sha256sum -c -

      - name: Commit authoritative Agda source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m "Commit exact CompleteSafe_v147 Agda source [materialized-v147]"
          git push origin HEAD:v147-q-chad-agda-safe

      - name: Remove transfer payload after successful commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f transfer/v147_payload_00.b64 transfer/v147_payload_01.b64 transfer/v147_payload_02.b64
          git commit -m "Remove v147 source transfer payload [materialized-v147]"
          git push origin HEAD:v147-q-chad-agda-safe
