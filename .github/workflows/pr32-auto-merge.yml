name: PR32 auto-merge after green CI

on:
  workflow_run:
    workflows:
      - Canonical Agda safe gate
      - Representation primitive algebra safe gate
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  arm-auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'pr31-prune-ssm-prefix'
    runs-on: ubuntu-24.04
    steps:
      - name: Arm PR32 auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr merge 32 --repo "$GH_REPO" --auto --squash --delete-branch
