name: JAX execution reference

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jax-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned JAX only
        run: |
          python -m pip install --disable-pip-version-check --no-input "jax==0.11.2"
      - name: Compile and shape-check execution mirrors
        run: |
          python tools/jax_reference.py
