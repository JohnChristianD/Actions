name: Agda kernel and Haskell transpilation

on:
  push:
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

concurrency:
  group: agda-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.repair.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Agda 2.8.0
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - name: Repair one known malformed lambda
        id: repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '''  accumulate : Fin n → R → EState → EState
  accumulate i c (state s) = state (λ j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j)
'''
          new = '''  accumulate : Fin n → R → EState → EState
  accumulate i c (state s) = state (accumAt i c s)
    where
    accumAt : Fin n → R → Cot → Fin n → R
    accumAt i c s j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j
'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print('changed=true')
              with open('/tmp/changed', 'w') as f:
                  f.write('true')
          else:
              print('changed=false')
              with open('/tmp/changed', 'w') as f:
                  f.write('false')
          PY
          echo "changed=$(cat /tmp/changed)" >> "$GITHUB_OUTPUT"

      - name: Commit source repair
        if: ${{ steps.repair.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: repair malformed Agda lambda syntax'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  kernel:
    needs: repair
    if: ${{ needs.repair.outputs.changed != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Agda 2.8.0
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - name: Verify Agda
        run: |
          set -euo pipefail
          agda --version

      - name: Verify target source
        run: |
          set -euo pipefail
          test -f Exotic/ERL/FullCoupled/CompleteSafe_v147.agda

      - name: Authoritative Agda --safe check
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          echo 'agda --safe: PASS'

      - name: Generate Haskell backend
        run: |
          set -euo pipefail
          agda --safe --compile --ghc-dont-call-ghc Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          test -d MAlonzo
          find MAlonzo -type f -name '*.hs' -print | sort
          echo 'Agda -> Haskell transpilation: PASS'
