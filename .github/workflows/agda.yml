# Kernel closure verification trigger; Agda --safe remains authoritative.
name: Agda CI, tooling, and closure persistence
on:
  push:
    paths: ['**/*.agda', '.github/workflows/agda.yml', '.ci/repair-agda-syntax.py']
  pull_request:
    paths: ['**/*.agda', '.github/workflows/agda.yml', '.ci/repair-agda-syntax.py']
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
concurrency:
  group: agda-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  kernel:
    if: ${{ github.event_name != 'pull_request_review' || github.event.pull_request != null }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Agda Setup Action
        uses: agda/agda-setup-action@v1.0.0
        with: {agda-version: '2.8.0'}
      - name: Verify Agda executable
        run: command -v agda && agda --version
      - name: Repair known Agda syntax
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize CompleteSafe initialForm binding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '''      initialForm : QRun_v142.projection
          (initialQRun_v142 D budget p x) ≡ p =
        trans
          refl
          (trans
            (cong (λ mu → qCandidate_v142 D mu
              (allActive_v147 {n = _}) p x) muZero)
            (qCandidateZero_v147 D p x hp))
'''
          new = '''      initialForm =
        trans
          refl
          (trans
            (cong (λ mu → qCandidate_v142 D mu
              (allActive_v147 {n = _}) p x) muZero)
            (qCandidateZero_v147 D p x hp))
'''
          if old not in s:
              raise SystemExit('expected initialForm binding not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Authoritative Agda --safe kernel check
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          echo agda-kernel-check=PASS
