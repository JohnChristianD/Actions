name: Agda authoritative safe gate

on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad', 'main']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Verify Agda executable
        run: agda --version
      - name: Safe-check combined self-contained surface
        run: agda --safe Exotic/ERL/FullCoupled/AllSafeCombined.agda
      - name: Safe-check full Efficient-CHAD source-to-source transliteration
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHADSourceToSource.agda
      - name: Safe-check isolated linear coupled learner
        run: agda --safe Exotic/ERL/FullCoupled/LinearCoupledLearnerNoNormLSTM.agda
      - name: Safe-check first-class finite recurrent CHAD
        run: agda --safe Exotic/ERL/FullCoupled/FirstClassRecurrentCHAD.agda
      - name: Safe-check shared network CHAD
        run: agda --safe Exotic/ERL/FullCoupled/SharedNetworkCHAD.agda
      - name: Safe-check authoritative complete closure
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
