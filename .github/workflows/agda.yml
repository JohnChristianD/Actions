name: Agda kernel and Haskell transpilation

on:
  push:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Agda 2.8.0
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - name: Verify Agda
        run: agda --version

      - name: Canonical structural repair
        run: python3 .ci/repair-agda-syntax.py

      - name: Canonical finite grammar and scope normalization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()

          s = s.replace(
              'open import Agda.Builtin.Nat using (Nat; zero; suc; _+_)',
              'open import Agda.Builtin.Nat using (Nat; suc) renaming (zero to natZero)')
          s = s.replace(
              'open import Agda.Builtin.Equality using (_≡_; refl; sym; trans; cong; subst)',
              'open import Agda.Builtin.Equality using (_≡_; refl)')
          s = s.replace('[] : Vec A zero', '[] : Vec A natZero')
          s = s.replace('sumFin _ z zero _ = z', 'sumFin _ z natZero _ = z')
          s = s.replace('tabulateV {zero} f = []', 'tabulateV {natZero} f = []')
          s = s.replace('\nopen Ring\n\nrecord OrderedRing', '\nrecord OrderedRing')

          helper = '''\nsym : ∀ {A : Set} {x y : A} → x ≡ y → y ≡ x\nsym refl = refl\n\ntrans : ∀ {A : Set} {x y z : A} → x ≡ y → y ≡ z → x ≡ z\ntrans refl yz = yz\n\ncong : ∀ {A B : Set} (f : A → B) {x y : A} → x ≡ y → f x ≡ f y\ncong f refl = refl\n\nsubst : ∀ {A : Set} (P : A → Set) {x y : A} → x ≡ y → P x → P y\nsubst P refl px = px\n'''
          marker = '_≠_ : {A : Set} → A → A → Set\nx ≠ y = ¬ (x ≡ y)\n'
          if helper.strip() not in s and marker in s:
              s = s.replace(marker, marker + helper, 1)

          # Replace the fragile local shift helper by one total finite map.
          shift_sig = 'shiftMaybeD_v142 : ∀ {m} → MaybeD (Fin m) → MaybeD (Fin (suc m))'
          if shift_sig not in s:
              marker = '\nqFirstNegative_v142 : ∀ {S n}'
              helper_shift = '''\nshiftMaybeD_v142 : ∀ {m} → MaybeD (Fin m) → MaybeD (Fin (suc m))\nshiftMaybeD_v142 nothing = nothing\nshiftMaybeD_v142 (justD i) = justD (fsuc i)\n'''
              if marker in s:
                  s = s.replace(marker, helper_shift + marker, 1)
          s = s.replace('... | false = shift (qFirstNegative_v142 D bs as xs mu)',
                        '... | false = shiftMaybeD_v142 (qFirstNegative_v142 D bs as xs mu)')
          s = s.replace('...   | no _ = shift (qFirstNegative_v142 D bs as xs mu)',
                        '...   | no _ = shiftMaybeD_v142 (qFirstNegative_v142 D bs as xs mu)')
          local_shift = '''\n  where\n  shift : ∀ {m} → MaybeD (Fin m) → MaybeD (Fin (suc m))\n  shift nothing = nothing\n  shift (justD i) = justD (fsuc i)\n'''
          s = s.replace(local_shift, '\n', 1)

          # Explicitly bind dependent indices used by nested local types.
          s = re.sub(r'(?m)^qRunStep_v142\s+r\s+with',
                     'qRunStep_v142 {S} {n} r with', s, count=1)
          s = re.sub(r'(?m)^qCandidate_v142\s+D\s+mu\s+m\s+alpha\s+x\s*=',
                     'qCandidate_v142 {S} {n} D mu m alpha x =', s, count=1)

          replacements = {
              '  alpha * (x * x) < mu * ((x * x) * (x * x))':
                  '  (alpha * (x * x)) < (mu * ((x * x) * (x * x)))',
              'alpha + Ring.neg (OrderedRing.ring (SmoothAlgebra.orderedRing S))\n    (mu * (x * x)) < zero':
                  '(alpha + Ring.neg (OrderedRing.ring (SmoothAlgebra.orderedRing S))\n    (mu * (x * x))) < zero',
              'eval y ρ * coeff x ρ i + eval x ρ * coeff y ρ i':
                  '(eval y ρ * coeff x ρ i) + (eval x ρ * coeff y ρ i)',
              '→ a + c ≤ b + d': '→ (a + c) ≤ (b + d)',
              '→ a + c < b + d': '→ (a + c) < (b + d)',
              '→ c + a < c + b': '→ (c + a) < (c + b)',
              '→ a + neg b < zero': '→ (a + neg b) < zero',
              '→ a + neg b ≤ zero': '→ (a + neg b) ≤ zero',
              'abs (x + y) ≤ abs x + abs y': 'abs (x + y) ≤ (abs x + abs y)',
              '→ zero ≤ a * b': '→ zero ≤ (a * b)',
              '→ c * a ≤ c * b': '→ (c * a) ≤ (c * b)',
              '→ c * a < c * b': '→ (c * a) < (c * b)',
              '→ zero < a * b': '→ zero < (a * b)',
              '→ zero < x * x': '→ zero < (x * x)',
              '→ zero ≤ x * x': '→ zero ≤ (x * x)',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Rebind fragile inferred locals with explicit dependent types.
          s = s.replace(
              'record LSTMState (S : SmoothAlgebra) (hidden : Nat) : Set where\n  field hidden cell : VecS S hidden',
              'record LSTMState (S : SmoothAlgebra) (hiddenDim : Nat) : Set where\n  field hidden cell : VecS S hiddenDim')
          s = s.replace(
              '  μ = vSum xs * SmoothAlgebra.recip S (SmoothAlgebra.fromNat S d)\n  centered x = x + neg μ',
              '  μ = vSum xs * SmoothAlgebra.recip S (SmoothAlgebra.fromNat S d)\n  centered : Scalar S → Scalar S\n  centered x = x + neg μ')
          s = s.replace(
              '  invStd = SmoothAlgebra.recip S\n    (SmoothAlgebra.sqrt S (variance + LayerNorm.epsilon ln))\n  normalise x = centered x * invStd',
              '  invStd = SmoothAlgebra.recip S\n    (SmoothAlgebra.sqrt S (variance + LayerNorm.epsilon ln))\n  normalise : Scalar S → Scalar S\n  normalise x = centered x * invStd')
          s = s.replace('LSTMGates.gates', 'LSTMBlock.gates')
          s = s.replace('residual_v140 mu alpha x i =', 'residual_v140 {S} mu alpha x i =')

          p.write_text(s)
          PY

      - name: Authoritative Agda --safe check
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          echo 'agda --safe: PASS'

      - name: Generate Haskell backend
        run: |
          set -euo pipefail
          agda --safe --compile --ghc-dont-call-ghc Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          test -d MAlonzo
          echo 'Agda -> Haskell transpilation: PASS'

      - name: Persist proof-gated source
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: persist proof-gated Agda normalization'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
