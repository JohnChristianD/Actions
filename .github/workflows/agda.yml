name: Agda authoritative safe gate

on:
  push:
    branches: ['main', 'ci/v148-firstclass-lstm-chad', 'ci/v149-monolith-dedupe', 'ci/v149-monolith-final']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
      - '.ci/v149-*.py'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
      - '.ci/v149-*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Verify Agda executable
        run: agda --version
      - name: Apply deterministic v149 monolith repair
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-dedupe-monolith.py
      - name: Remove duplicate v149 SmoothAlgebra
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-dedupe-duplicate-smooth.py
      - name: Normalize duplicate v149 LayerNorm
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-layernorm-dedupe.py
      - name: Normalize v149 hidden aliases
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-hidden-aliases.py
      - name: Normalize v149 zero-vector scope
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-zero-vector-scope.py
      - name: Normalize v149 square parser boundary
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-square-parser.py
      - name: Normalize v149 inequality notation
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-neq-parser.py
      - name: Normalize v149 Nat namespace
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/normalize-nat-namespace.py
      - name: Qualify v149 OrderedRing fields
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/final-qualify-ordered-fields.py
      - name: Normalize v149 LayerNorm denominator domain
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-final' || github.head_ref == 'ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final'
        run: python3 .ci/v149-layernorm-parser.py
      - name: Normalize v149 CVT insertion parser
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-final' || github.head_ref == 'ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final'
        run: python3 .ci/v149-cvt-parser.py
      - name: Normalize v149 diagonal proof parser
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-diagonal-parser.py
      - name: Normalize v149 typed let bindings
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-let-bindings.py
      - name: Normalize v149 residual carrier
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-final' || github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-residual-carrier.py
      - name: Normalize v149 reciprocal nonnegative proof
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-final' || github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-reciprocal-parser.py
      - name: Normalize v149 EfficientCHAD carrier scope
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-efficientchad-scope.py
      - name: Normalize v149 EfficientCHAD product parser
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-efficientchad-product-parser.py
      - name: Normalize v149 equality primitives
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        run: python3 .ci/v149-equality-primitives.py
      - name: Debug transformed monolith declaration window
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        shell: bash
        run: |
          set -euo pipefail
          grep -nE '^cong :|^sym :|^trans :|^subst :|^record LayerNorm|^layerNormMean|^layerNormVariance|^record RecurrentAffine' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Safe-check combined self-contained surface
        run: agda --safe Exotic/ERL/FullCoupled/AllSafeCombined.agda
      - name: Safe-check full Efficient-CHAD source-to-source transliteration
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHADSourceToSource.agda
      - name: Safe-check isolated linear coupled learner
        run: agda --safe Exotic/ERL/FullCoupled/LinearCoupledLearnerNoNormLSTM.agda
      - name: Safe-check first-class finite recurrent CHAD
        run: agda --safe Exotic/ERL/FullCoupled/FirstClassRecurrentCHAD.agda
      - name: Safe-check shared network CHAD
        run: agda --safe Exotic/ERL/FullCoupled/SharedNetworkCHAD.agda
      - name: Safe-check representation primitive algebra
        run: agda --safe Exotic/ERL/FullCoupled/RepresentationPrimitiveAlgebra.agda
      - name: Safe-check domain-carrying LayerNorm closure
        run: agda --safe Exotic/ERL/FullCoupled/RepresentationLayerNormClosure.agda
      - name: Safe-check authoritative complete closure
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Persist kernel-checked v149 source repair
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe' || github.head_ref == 'ci/v149-monolith-final' || github.ref == 'refs/heads/ci/v149-monolith-final'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            echo 'no v149 monolith source repair to persist'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: persist kernel-checked v149 monolith algebra'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
