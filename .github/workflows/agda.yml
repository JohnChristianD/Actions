name: Canonical self-contained learner gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject forbidden theorem families, holes, and postulates
        run: runghc .ci/CheckForbiddenTheorems.hs

      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Verify Agda executable
        run: agda --version && agda --print-agda-app-dir && test -f "$(agda --print-agda-app-dir)/libraries"

      - name: Check generalized self-contained learner monolith
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/GeneralFullCoupledLearnerMonolith.agda

      - name: Check generalized theorem monolith
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/GeneralFullCoupledTheoremsMonolith.agda

      - name: Check generalized theorem closure
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/GeneralFullCoupledTheoremClosure.agda

      - name: Check generalized closed-loop benchmark
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/GeneralClosedLoopBenchV2.agda

      - name: Check additional deterministic benchmark ports
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/AdditionalBenchmarkPorts.agda

      - name: Check self-contained canonical learner
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agda

      - name: Check canonical learner regression
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalLearnerMonolith_test.agda

      - name: Check closed-loop interface
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalClosedLoopInterface.agda

      - name: Check closed-loop interface regression
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalClosedLoopInterface_test.agda

      - name: Check exact closed-loop benchmark suite
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalClosedLoopBenchV2.agda

      - name: Check finite environment ports
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalGamePorts.agda

      - name: Check faithful finite map variants
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalFaithfulGameVariants.agda

      - name: Check finite parameter completeness
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/FiniteParameterCompleteness.agda

      - name: Check finite norm algebra
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/FiniteNormAlgebra.agda

      - name: Check control and observability definitions
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalControlObservability.agda

      - name: Check CNN log-pyramid preservation
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CNNLogPyramidPreservation.agda

      - name: Check complete CNN factorization theorem
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CNNLogPyramidComplete.agda

      - name: Check CNN transition bisimulation
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CNNTransitionBisimulation.agda

      - name: Check CNN transition bisimulation regression
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CNNTransitionBisimulation_test.agda

      - name: Check negative-Munchausen signed-scale theory
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalNegativeMunchausenTheory.agda

      - name: Check finite negative-Munchausen ablation
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalMunchausenAblation.agda

      - name: Check negative-Munchausen ceteris-paribus regression
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalMunchausenAblation_test.agda

      - name: Check Jensen convex-concave sandwich
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/JensenMinMaxSandwich.agda

      - name: Check finite Sion saddle sandwich
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/FiniteSionSaddleSandwich.agda

      - name: Check Gymnax CartPole closed loop
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/GymnaxCartPoleClosedLoop_test.agda

      - name: Check canonical policy CartPole closed loop
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/GymnaxCartPolePolicyClosedLoop_test.agda

      - name: Check end-to-end closed-loop benchmark interface
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalClosedLoopBench.agda

      - name: Check GameTheory port
        run: timeout 90s agda --safe Exotic/econlib/GameTheory.agda

      - name: Check Econlib equilibrium port
        run: timeout 90s agda --safe Exotic/econlib/Equilibrium.agda

      - name: Check Matching Pennies port
        run: timeout 90s agda --safe Exotic/econlib/MatchingPennies.agda

      - name: Check learner game execution regression
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalLearnerGameExecution_test.agda

      - name: Set up Haskell generator runtime
        run: sudo apt-get update && sudo apt-get install -y ghc

      - name: Audit redundant learner modules
        run: runghc .ci/discovery/PruneRedundantLearnerModules.hs
