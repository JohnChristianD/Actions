name: Agda authoritative safe gate

on:
  push:
    branches: ['main', 'ci/v149-monolith-dedupe']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
      - '.ci/normalize_v150.exs'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
      - '.ci/normalize_v150.exs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          install-hex: true
          install-rebar: false
      - name: Verify Agda and Elixir
        run: |
          set -euo pipefail
          agda --version
          elixir --version
      - name: Elixir repair normalization gate
        run: elixir .ci/normalize_v150.exs
      - name: Safe-check self-contained LayerNorm-free theorem target
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHAD_SignedQIDBD_Tsallis2_Complete_v154.agda
      - name: Safe-check authoritative complete closure
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Persist idempotent Elixir normalization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            echo 'no normalized monolith delta'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: persist Elixir-normalized Agda monolith'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
