name: Agda authoritative safe gate

on:
  push:
    branches: ['main', 'ci/v149-monolith-dedupe']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
      - '.ci/v150-monolith-repair.rb'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
      - '.ci/v150-monolith-repair.rb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Verify Agda and Ruby
        run: |
          set -euo pipefail
          agda --version
          ruby --version
      - name: Apply one-time LayerNorm-free monolith migration
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe'
        run: ruby .ci/v150-monolith-repair.rb
      - name: Safe-check combined self-contained surface
        run: agda --safe Exotic/ERL/FullCoupled/AllSafeCombined.agda
      - name: Safe-check full Efficient-CHAD source-to-source transliteration
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHADSourceToSource.agda
      - name: Safe-check isolated linear coupled learner
        run: agda --safe Exotic/ERL/FullCoupled/LinearCoupledLearnerNoNormLSTM.agda
      - name: Safe-check first-class finite recurrent CHAD
        run: agda --safe Exotic/ERL/FullCoupled/FirstClassRecurrentCHAD.agda
      - name: Safe-check shared network CHAD
        run: agda --safe Exotic/ERL/FullCoupled/SharedNetworkCHAD.agda
      - name: Safe-check representation primitive algebra
        run: agda --safe Exotic/ERL/FullCoupled/RepresentationPrimitiveAlgebra.agda
      - name: Safe-check LayerNorm-free CReLU Tsallis-2 theorem target
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHAD_CReLU_Tsallis2_v150.agda
      - name: Safe-check authoritative complete closure
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Persist kernel-checked migration
        if: github.head_ref == 'ci/v149-monolith-dedupe' || github.ref == 'refs/heads/ci/v149-monolith-dedupe'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            echo 'no monolith migration changes to persist'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: persist Ruby-kernel-checked monolith migration'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
