name: Agda authoritative safe gate

on:
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Verify Agda executable
        run: agda --version
      - name: Safe-check v156 canonical finite ordered Efficient-CHAD
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHAD_v156.agda
      - name: Verify active target exclusions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'LayerNorm|BatchNorm|BatchRenorm|StoSignSGDv2|Newton|Certificate|setup-python|ruby/setup-ruby|python3' Exotic/ERL/FullCoupled/EfficientCHAD_v156.agda
