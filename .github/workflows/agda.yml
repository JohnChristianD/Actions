name: Agda authoritative safe gate

on:
  push:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
      - run: python3 .ci/repair-agda-syntax.py
      - name: Normalize q-retraction declaration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '''      initialForm : QRun_v142.projection
          (initialQRun_v142 D budget p x) ≡ p =
        trans
          refl
          (trans
            (cong (λ mu → qCandidate_v142 D mu
              (allActive_v147 {n = _}) p x) muZero)
            (qCandidateZero_v147 D p x hp))
'''
          new = '''      initialForm : (QRun_v142.projection
          (initialQRun_v142 D budget p x) ≡ p) =
        trans
          refl
          (trans
            (cong (λ mu → qCandidate_v142 D mu
              (allActive_v147 {n = _}) p x) muZero)
            (qCandidateZero_v147 D p x hp))
'''
          if old not in s:
              raise SystemExit('q-retraction declaration boundary not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
