# Kernel closure verification trigger; Agda --safe remains authoritative.
name: Agda CI, tooling, and closure persistence
on:
  push:
    paths: ['**/*.agda', '.github/workflows/agda.yml', '.ci/repair-agda-syntax.py', '.ci/normalize-completesafe-namespaces.py', '.ci/normalize-terminal-uniqueness.py']
  pull_request:
    paths: ['**/*.agda', '.github/workflows/agda.yml', '.ci/repair-agda-syntax.py', '.ci/normalize-completesafe-namespaces.py', '.ci/normalize-terminal-uniqueness.py']
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
concurrency:
  group: agda-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  kernel:
    if: ${{ github.event_name != 'pull_request_review' || github.event.pull_request != null }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Agda Setup Action
        uses: agda/agda-setup-action@v1.0.0
        with: {agda-version: '2.8.0'}
      - name: Verify Agda executable
        run: command -v agda && agda --version
      - name: Repair known Agda syntax
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize CompleteSafe Nat/Ring namespaces
        run: python3 .ci/normalize-completesafe-namespaces.py
      - name: Normalize CompleteSafe initialForm binding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          pattern = r'(?m)^(\s*)initialForm\s*:\s*QRun_v142\.projection\s*\n\1\s+\(initialQRun_v142 D budget p x\)\s+≡\s+p\s*='
          s2, count = re.subn(pattern, r'\1initialForm =', s, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one initialForm binding, found {count}')
          p.write_text(s2)
          PY
      - name: Normalize terminal projection uniqueness
        run: python3 .ci/normalize-terminal-uniqueness.py
      - name: Authoritative Agda --safe kernel check
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          echo agda-kernel-check=PASS
