- name: Agda Setup Action
  # You may pin to the exact commit or the version.
  # uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
  uses: agda/agda-setup-action@v1.0.0
  with:
    # Version of Agda to install (e.g., 2.8.0)
    agda-version: # default is 2.8.0
    # Version of Agda standard library to install (e.g., 2.3). If not specified, the standard library will not be installed.
    agda-stdlib-version: # optional, default is 

- name: Transform Agda HTML Documentation
  # You may pin to the exact commit or the version.
  # uses: will-break-it/agda-web-docs-lib@c2f383f06a7baed65ed923585d64a5dcbc1c0bc2
  uses: will-break-it/agda-web-docs-lib@v1
  with:
    # Directory containing the HTML files to transform
    input-dir: 
    # Directory to output the transformed HTML files (defaults to input-dir for in-place transformation)
    output-dir: # optional, default is 
    # Path to the agda-docs configuration file
    config-file: # optional, default is agda-docs.config.json
    # URL for the back button (overrides config file)
    back-button-url: # optional, default is 
    # Comma-separated list of module prefixes (overrides config file)
    modules: # optional, default is 
    # GitHub repository URL for source links (overrides config file)
    github-url: # optional, default is 
    # Node.js options (e.g., --max-old-space-size=4096 for large documentation sets)
    node-options: # optional, default is --max-old-space-size=2048 --expose-gc
    # Path to package-lock.json for npm caching (if not provided, caching will be disabled)
    cache-dependency-path: # optional, default is 

- name: Codeball AI Code Review
  # You may pin to the exact commit or the version.
  # uses: sturdy-dev/codeball-action@102067b9f537482cee112577655c85fda56d8926
  uses: sturdy-dev/codeball-action@v2.6.0
  with:
    # If "true", the action will submit an approving review if the Codeball AI approves the contribution
    approvePullRequests: # optional, default is true
    # If "true", the action will add `codeball:approved` label to the PR if the Codeball AI confidence is above the configured approve threshold
    labelPullRequestsWhenApproved: # optional, default is true
    # If "true", the action will add `codeball:needs-review` label to the PR if the Codeball AI confidence is between the "approve" and "careful" thresholds
    labelPullRequestsWhenReviewNeeded: # optional, default is false
    # If "true", the action will add `codeball:needs-careful-review` label to the PR if the Codeball AI confidence is below the configured careful threshold
    labelPullRequestsWhenCarefulReviewNeeded: # optional, default is true
    # The threshold to use for "approving" (greater than or equal to). A number between 0 and 1. Must be specified with 3 decimals.
    approveThreshold: # optional, default is 0.935
    # The threshold to use for "careful review" actions (less than). A number between 0 and 1. Must be specified with 3 decimals.
    carefulReviewThreshold: # optional, default is 0.300
    # If "true", the action will exit with status code 1 if the Codeball AI does not approve the contribution
    failJobsWhenReviewNeeded: # optional, default is false
    # If "true", Codeball will read generate code suggestions from comments made in Pull Requests (beta)
    codeSuggestionsFromComments: # optional, default is false

- name: ChatGPT Integration
  # You may pin to the exact commit or the version.
  # uses: kxxt/chatgpt-action@38f2677d65175a69c385fe965254cb2885194ffd
  uses: kxxt/chatgpt-action@v0.3
  with:
    # ID of Pull Request or Issue
    number: 
    # Your ChatGPT session token.
    sessionToken: 
    # Mode
    mode: # default is pr
    # Should I split the prompt and how to split it?
    split: # default is yolo

- name: PR ChatGPT Review
  # You may pin to the exact commit or the version.
  # uses: agogear/chatgpt-pr-review@f613d7c0de926669d97feaab0d5adb3575709923
  uses: agogear/chatgpt-pr-review@0.0.17
  with:
    # OpenAI API Key
    openai_api_key: 
    # Github API Key
    github_token: 
    # Github PR ID
    github_pr_id: 
    # Comma separated list of files to target for review
    files: # optional, default is *
    # GPT-5 model name.
    openai_model: # optional, default is gpt-5-nano
    # Sampling temperature, [0, 1]. Higher values mean the model will take more risks when generating answers.
    openai_temperature: # optional, default is 1
    # The maximum number of tokens to generate in the completion.
    openai_max_tokens: # optional, default is 8192
    # The level to log at. One of [debug, info, warning, error]
    logging: # optional, default is warning

- name: Cache
  uses: actions/cache@v5.1.0
  with:
    # A list of files, directories, and wildcard patterns to cache and restore
    path: 
    # An explicit key for restoring and saving the cache
    key: 
    # An ordered multiline string listing the prefix-matched keys, that are used for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.
    restore-keys: # optional
    # The chunk size used to split up large files during upload, in bytes
    upload-chunk-size: # optional
    # An optional boolean when enabled, allows windows runners to save or restore caches that can be restored or saved respectively on other platforms
    enableCrossOsArchive: # optional, default is false
    # Fail the workflow if cache entry is not found
    fail-on-cache-miss: # optional, default is false
    # Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache
    lookup-only: # optional, default is false
    # Run the post step to save the cache even if another step before fails
    save-always: # optional, default is false

- name: The Determinate Nix Installer
  # You may pin to the exact commit or the version.
  # uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
  uses: DeterminateSystems/nix-installer-action@v22
  with:
    # The setting for `RUST_BACKTRACE` (see https://doc.rust-lang.org/std/backtrace/index.html#environment-variables)
    backtrace: # optional
    # Whether to install [Determinate Nix](https://determinate.systems/enterprise) and log in to FlakeHub for private Flakes and binary caches.

    determinate: # optional, default is true
    # Extra args to pass to the planner (prefer using structured `with:` arguments unless using a custom planner!)
    extra-args: # optional
    # Extra configuration lines for `/etc/nix/nix.conf` (includes `access-tokens` with `secrets.GITHUB_TOKEN` automatically if `github-token` is set)
    extra-conf: # optional
    # Deprecated. Implies `determinate`.
    flakehub: # optional
    # Force using other methods than systemd to launch the daemon. This setting is automatically enabled when necessary.
    force-no-systemd: # optional
    # A GitHub token for making authenticated requests (which have a higher rate-limit quota than unauthenticated requests)
    github-token: # optional, default is ${{ github.token }}
    # The URL for the GitHub server, to use with the `github-token` token. Defaults to the current GitHub server, supporting GitHub Enterprise Server automatically. Only change this value if the provided `github-token` is for a different GitHub server than the current server.
    github-server-url: # optional, default is ${{ github.server_url }}
    # The init system to configure, requires `planner: linux-multi` (allowing the choice between `none` or `systemd`)
    init: # optional
    # The overall status of the job. Set automatically, for aggregate analysis of Nix stability.
    job-status: # optional, default is ${{ job.status }}
    # Automatically configure the GitHub Actions Runner for NixOS test supports, if the host supports it.
    kvm: # optional, default is true
    # A local `nix-installer` binary root, overrides any settings which change the `nix-installer` used (binaries should be named `nix-installer-$ARCH-$OS`, eg. `nix-installer-x86_64-linux`)
    local-root: # optional
    # A list of Tracing directives, comma separated, `-`s replaced with `_` (eg. `nix_installer=trace`, see https://docs.rs/tracing-subscriber/latest/tracing_subscriber/filter/struct.EnvFilter.html#directives)
    log-directives: # optional
    # The logger to use for install (eg. `pretty`, `json`, `full`, `compact`)
    logger: # optional
    # An SSL cert to use (if any), used for fetching Nix and sets `NIX_SSL_CERT_FILE` for Nix
    ssl-cert-file: # optional
    # The proxy to use (if any), valid proxy bases are `https://$URL`, `http://$URL` and `socks5://$URL`
    proxy: # optional
    # Use a case sensitive volume (`planner: macos` only)
    mac-case-sensitive: # optional
    # Force encryption on the volume (`planner: macos` only)
    mac-encrypt: # optional
    # The root disk of the target (`planner: macos` only)
    mac-root-disk: # optional
    # The label for the created APFS volume (`planner: macos` only)
    mac-volume-label: # optional
    # Modify the user profile to automatically load nix
    modify-profile: # optional, default is true
    # The Nix build group GID
    nix-build-group-id: # optional
    # The Nix build group name
    nix-build-group-name: # optional
    # The Nix build user base UID (ascending)
    nix-build-user-base: # optional
    # Number of build users to create
    nix-build-user-count: # optional
    # The Nix build user prefix (user numbers will be postfixed)
    nix-build-user-prefix: # optional
    # Run a version of the nix-installer binary from somewhere already on disk. Conflicts with all other `source-*` options. Intended only for testing this Action.
    source-binary: # optional
    # The branch of `nix-installer` to use (conflicts with `source-tag`, `source-revision`, `source-pr`)
    source-branch: # optional
    # The PR of `nix-installer` to use (conflicts with `source-tag`, `source-revision`, `source-branch`)
    source-pr: # optional
    # The revision of `nix-installer` to use (conflicts with `source-tag`, `source-branch`, `source-pr`)
    source-revision: # optional
    # The tag of `nix-installer` to use (conflicts with `source-revision`, `source-branch`, `source-pr`)
    source-tag: # optional
    # A URL pointing to a `nix-installer` executable
    source-url: # optional
    # The Nix package URL
    nix-package-url: # optional
    # A planner to use
    planner: # optional
    # Force a reinstall if an existing installation is detected (consider backing up `/nix/store`)
    reinstall: # optional
    # If the daemon should be started, requires `planner: linux`
    start-daemon: # optional, default is true
    # Diagnostic endpoint url where the installer sends data to. To disable set this to an empty string.
    diagnostic-endpoint: # optional, default is -
    # Whether to make the runner user trusted by the Nix daemon
    trust-runner-user: # optional, default is true
    # Whether to add a build summary and timeline chart to the GitHub job summary
    summarize: # optional, default is true
    # (deprecated) The branch of `nix-installer` to use (conflicts with `nix-installer-tag`, `nix-installer-revision`, `nix-installer-pr`)
    nix-installer-branch: # optional
    # (deprecated) The PR of `nix-installer` to use (conflicts with `nix-installer-tag`, `nix-installer-revision`, `nix-installer-branch`)
    nix-installer-pr: # optional
    # (deprecated) The revision of `nix-installer` to use (conflicts with `nix-installer-tag`, `nix-installer-branch`, `nix-installer-pr`)
    nix-installer-revision: # optional
    # (deprecated) The tag of `nix-installer` to use (conflicts with `nix-installer-revision`, `nix-installer-branch`, `nix-installer-pr`)
    nix-installer-tag: # optional
    # (deprecated) A URL pointing to a `nix-installer.sh` script
    nix-installer-url: # optional
    # Whether to fail when any errors are thrown. Used only to test the Action; do not set this in your own workflows.
    _internal-strict-mode: # optional

