name: Canonical self-contained learner gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: agda-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  learner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Mercury
        env:
          MERCURY_VERSION: "22.01.9"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils
          curl -fsSLO "https://dl.mercurylang.org/release/mercury-srcdist-${MERCURY_VERSION}.tar.xz"
          curl -fsSLO "https://dl.mercurylang.org/release/mercury-srcdist-${MERCURY_VERSION}.tar.xz.sha512"
          sha512sum -c "mercury-srcdist-${MERCURY_VERSION}.tar.xz.sha512"
          tar -xf "mercury-srcdist-${MERCURY_VERSION}.tar.xz"
          cd "mercury-srcdist-${MERCURY_VERSION}"
          ./configure             --prefix="$RUNNER_TEMP/mercury"             --enable-minimal-install             --disable-csharp-grade             --disable-java-grade
          make -j2
          make install
          echo "$RUNNER_TEMP/mercury/bin" >> "$GITHUB_PATH"
          mmc --version
      - name: Reject forbidden theorem families, holes, and postulates
        run: |
          cd .ci
          mmc --make check_forbidden_theorems
          timeout 120s ./check_forbidden_theorems


      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Verify Agda executable
        run: agda --version && agda --print-agda-app-dir && test -f "$(agda --print-agda-app-dir)/libraries"

      - name: Check generalized self-contained learner monolith
        run: timeout 180s agda --safe Exotic/ERL/FullCoupled/GeneralFullCoupledLearnerMonolith.agda

      - name: Check generalized theorem monolith
        run: timeout 180s agda --safe Exotic/ERL/FullCoupled/GeneralFullCoupledTheoremsMonolith.agda

      - name: Check full-composition reservoir theorem
        run: timeout 180s agda --safe Exotic/ERL/FullCoupled/MonolithCompositeReservoirTheorem.agda

      - name: Check finite cyclic norm-pair certificate
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/FiniteCyclicNormPairCertificate.agda

      - name: Check functional Walsh vector bridge
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/FunctionalWalshBridge.agda

      - name: Check finite simulation boundary
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/FiniteUniversalBoundary.agda

      - name: Check signed divisibility bridge
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/SignedDivisibilityBridge.agda

      - name: Check sparse accumulation complexity
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/FiniteSparseAccumulationComplexity.agda

      - name: Check proof-carrying inverse vectors
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/FiniteInverseVector.agda

      - name: Check connected operator complexity
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/ConnectedOperatorComplexity.agda

      - name: Check connected operator composition complexity
        run: timeout 120s agda --safe Exotic/ERL/FullCoupled/ConnectedOperatorCompositionComplexity.agda

      - name: Check generalized closed-loop benchmark
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/GeneralClosedLoopBenchV2.agda

      - name: Check additional deterministic benchmark ports
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/AdditionalBenchmarkPorts.agda

      - name: Check self-contained canonical learner
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agda

      - name: Check canonical learner regression
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalLearnerMonolith_test.agda

      - name: Check finite environment ports
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalGamePorts.agda

      - name: Check faithful finite map variants
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalFaithfulGameVariants.agda

      - name: Check Gymnax CartPole closed loop
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/GymnaxCartPoleClosedLoop_test.agda

      - name: Check canonical policy CartPole closed loop
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/GymnaxCartPolePolicyClosedLoop_test.agda

      - name: Check end-to-end closed-loop benchmark interface
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalClosedLoopBench.agda

      - name: Check GameTheory port
        run: timeout 90s agda --safe Exotic/econlib/GameTheory.agda

      - name: Check Econlib equilibrium port
        run: timeout 90s agda --safe Exotic/econlib/Equilibrium.agda

      - name: Check Matching Pennies port
        run: timeout 90s agda --safe Exotic/econlib/MatchingPennies.agda

      - name: Check learner game execution regression
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalLearnerGameExecution_test.agda

      - name: Audit redundant learner modules
        run: |
          cd .ci/discovery
          mmc --make prune_redundant_learner_modules
          timeout 120s ./prune_redundant_learner_modules


      - name: Audit Mercury surface
        run: |
          if find . -name '*.hs' -print -quit | grep -q .; then
            echo "ERROR: Haskell source remains"
            exit 1
          fi
