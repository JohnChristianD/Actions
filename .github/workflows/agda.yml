name: Agda CI, tooling, and closure persistence

on:
  push:
    paths: ['**/*.agda', '.github/workflows/agda.yml', '.ci/repair-agda-syntax.py']
  pull_request:
    paths: ['**/*.agda', '.github/workflows/agda.yml', '.ci/repair-agda-syntax.py']
  workflow_dispatch:

concurrency:
  group: agda-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  agda:
    runs-on: ubuntu-24.04
    env:
      CHATGPT_SESSION_TOKEN: ${{ secrets.CHATGPT_SESSION_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Agda Setup Action
        uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'

      - name: Verify Agda executable
        run: |
          set -euo pipefail
          command -v agda
          agda --version

      - name: Cache
        uses: actions/cache@v5.1.0
        continue-on-error: true
        with:
          path: .agda
          key: agda-${{ runner.os }}-${{ hashFiles('**/*.agda') }}
          restore-keys: agda-${{ runner.os }}-

      - name: Discover Agda sources
        run: |
          set -euo pipefail
          find . -type f -name '*.agda' -not -path './.git/*' -print0 | sort -z > agda-sources.list
          test -s agda-sources.list
          tr '\0' '\n' < agda-sources.list

      - name: Repair known Agda extended-lambda syntax
        run: |
          set -euo pipefail
          python3 .ci/repair-agda-syntax.py

      - name: Authoritative Agda --safe kernel check
        run: |
          set -euo pipefail
          : > agda-kernel.out
          while IFS= read -r -d '' AG; do
            echo "=== agda --safe $AG ===" | tee -a agda-kernel.out
            agda --safe "$AG" 2>&1 | tee -a agda-kernel.out
            test "${PIPESTATUS[0]}" -eq 0
          done < agda-sources.list
          echo agda-kernel-check=PASS | tee -a agda-kernel.out

      - name: Persist Agda closure certificate
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          mkdir -p .ci/closure
          OUT=.ci/closure/agda-closure.txt
          {
            echo status=closed
            echo repository=${{ github.repository }}
            echo source-commit=${{ github.sha }}
            echo agda-version="$(agda --version)"
            echo source-count="$(tr -cd '\0' < agda-sources.list | wc -c)"
            echo kernel-check=agda --safe PASS
            while IFS= read -r -d '' AG; do echo "$AG sha256=$(sha256sum "$AG" | cut -d' ' -f1)"; done < agda-sources.list
          } > "$OUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Exotic .ci/closure
          git commit -m 'Persist Agda closure certificate [agda-closure-persist]' || true
          git push origin HEAD:main

      - name: The Determinate Nix Installer
        uses: DeterminateSystems/nix-installer-action@v22
        continue-on-error: true

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        continue-on-error: true
        with: {use-gha-cache: enabled}

      - name: Restore and save Nix Store
        uses: nix-community/cache-nix-action@v7
        continue-on-error: true
        with:
          primary-key: agda-nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: agda-nix-${{ runner.os }}-
          nix: true
          save: true
          paths: /nix

      - name: Transform Agda HTML Documentation
        if: ${{ hashFiles('agda-docs.config.json') != '' }}
        uses: will-break-it/agda-web-docs-lib@v1
        continue-on-error: true
        with:
          input-dir: .
          config-file: agda-docs.config.json

      - name: Automatic Haskell project integration test to Nixpkgs
        uses: Anton-Latukha/test-haskell-nixpkgs-integration-action@v1.0.2
        continue-on-error: true

      - name: Codeball AI Code Review
        if: ${{ github.event_name == 'pull_request' }}
        uses: sturdy-dev/codeball-action@v2.6.0
        continue-on-error: true

      - name: ChatGPT Integration
        if: ${{ github.event_name == 'pull_request' && env.CHATGPT_SESSION_TOKEN != '' }}
        uses: kxxt/chatgpt-action@v0.3
        continue-on-error: true
        with:
          number: ${{ github.event.pull_request.number }}
          sessionToken: ${{ env.CHATGPT_SESSION_TOKEN }}
          mode: pr
          split: yolo

      - name: PR ChatGPT Review
        if: ${{ github.event_name == 'pull_request' && env.OPENAI_API_KEY != '' }}
        uses: agogear/chatgpt-pr-review@0.0.17
        continue-on-error: true
        with:
          openai_api_key: ${{ env.OPENAI_API_KEY }}
          github_token: ${{ github.token }}
          github_pr_id: ${{ github.event.pull_request.number }}
          files: '*'
          openai_model: gpt-5-nano
          openai_temperature: '1'
          openai_max_tokens: '8192'
          logging: warning

      - name: Upload Agda kernel log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agda-kernel-log
          path: agda-kernel.out
          if-no-files-found: ignore

      - name: Upload closure certificate
        if: ${{ success() && hashFiles('.ci/closure/agda-closure.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: agda-closure-certificate
          path: .ci/closure/agda-closure.txt
          if-no-files-found: ignore
