name: Agda source repair

on:
  push:
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair known malformed Agda lambda
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '''  accumulate : Fin n → R → EState → EState
  accumulate i c (state s) = state (λ j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j)
'''
          new = '''  accumulate : Fin n → R → EState → EState
  accumulate i c (state s) = state (accumAt i c s)
    where
    accumAt : Fin n → R → Cot → Fin n → R
    accumAt i c s j with finDecEq j i
    ... | yes _ = s j + c
    ... | no _ = s j
'''
          if old not in s:
              raise SystemExit('known malformed lambda not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit source repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair malformed Agda lambda syntax'
          git push
