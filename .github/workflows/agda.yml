name: Canonical Agda safe gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - 'oracle/**'
      - '.ci/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - '.github/workflows/agda.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          install-hex: true
          install-rebar: false
      - name: Validate canonical v161 source
        run: elixir .ci/normalize_v161.exs
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Verify Agda executable
        run: agda --version
      - name: Agda safe check
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHAD_v161.agda
      - name: Agda safe regression check
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHAD_v161_test.agda
      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
      - name: Run Haskell exact-rational oracle
        run: runghc oracle/haskell_oracle.hs > oracle/haskell.csv
      - name: Run Elixir exact-rational oracle
        run: elixir oracle/elixir_oracle.exs > oracle/elixir.csv
      - name: Compare exact-rational Haskell and Elixir traces
        shell: bash
        run: |
          set -euo pipefail
          sed 's/\r$//' oracle/haskell.csv | sed '/^$/d' > oracle/haskell.normalized.csv
          sed 's/\r$//' oracle/elixir.csv | sed '/^$/d' > oracle/elixir.normalized.csv
          diff -u oracle/haskell.normalized.csv oracle/elixir.normalized.csv
          echo 'exact-rational-functional-oracle-cross-check=PASS'

  efficient_chad_upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned Tom Smeding Efficient-CHAD source
        run: |
          set -euo pipefail
          git clone https://github.com/tomsmeding/efficient-chad-agda.git .ci/external/efficient-chad-agda
          git -C .ci/external/efficient-chad-agda checkout --detach 0be45ee9e7498a69c083a25ac9ba29bba4431a71
          test -f .ci/external/efficient-chad-agda/chad-cost.agda
          echo 'tom-smeding-efficient-chad-pinned=PASS'
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.6.3'
      - name: Fetch the upstream declared standard-library version
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.7.2 https://github.com/agda/agda-stdlib.git .ci/external/agda-stdlib
          mkdir -p "$HOME/.agda"
          printf '%s/standard-library.agda-lib\n' "$GITHUB_WORKSPACE/.ci/external/agda-stdlib" > "$HOME/.agda/libraries"
          printf 'standard-library\n' > "$HOME/.agda/defaults"
      - name: Agda safe check of upstream Efficient-CHAD proof
        run: agda --safe -i .ci/external/efficient-chad-agda .ci/external/efficient-chad-agda/chad-cost.agda
