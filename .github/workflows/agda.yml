name: Canonical Agda safe gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - 'oracle/**'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin Tom Smeding Efficient-CHAD source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tomsmeding/efficient-chad-agda.git .ci/external/efficient-chad-agda
          git -C .ci/external/efficient-chad-agda fetch --depth 1 origin 0be45ee9e7498a69c083a25ac9ba29bba4431a71
          git -C .ci/external/efficient-chad-agda checkout --detach 0be45ee9e7498a69c083a25ac9ba29bba4431a71
          test -f .ci/external/efficient-chad-agda/chad-cost.agda
          test -f .ci/external/efficient-chad-agda/chad-preserves-primal.agda
          echo 'tom-smeding-efficient-chad-pinned=PASS'
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          install-hex: true
          install-rebar: false
      - name: Validate canonical v164 source
        run: elixir .ci/normalize_v164.exs
      - name: Prune upstream Efficient-CHAD to local dependency closure
        shell: bash
        run: bash .ci/audit_tom_smeding.sh
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Verify Agda executable
        run: agda --version
      - name: Audit upstream Efficient-CHAD imports
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/external/efficient-chad-agda
          imports=$(mktemp)
          grep -RhoE '^[[:space:]]*(open[[:space:]]+)?import[[:space:]]+[A-Za-z0-9_.-]+' --include='*.agda' . | sort -u > "$imports"
          echo 'upstream-imports:'
          cat "$imports"
          if ! grep -Eq '(^| )(Data|Function|Relation)(\.|$)' "$imports"; then
            echo 'expected standard-library import families were not found'
            exit 1
          fi
          echo 'tom-smeding-stdlib-dependency=DETECTED'
      - name: Probe upstream Efficient-CHAD with no standard library
        shell: bash
        run: |
          set -uo pipefail
          cd .ci/external/efficient-chad-agda
          isolated_agda_dir=$(mktemp -d)
          : > "$isolated_agda_dir/libraries"
          : > "$isolated_agda_dir/defaults"
          set +e
          AGDA_DIR="$isolated_agda_dir" agda --safe chad-cost.agda > /tmp/tom-smeding-no-stdlib.log 2>&1
          status=$?
          set -e
          cat /tmp/tom-smeding-no-stdlib.log
          if [ "$status" -eq 0 ]; then
            echo 'unexpected-success: upstream Efficient-CHAD resolved without standard library'
            exit 1
          fi
          if ! grep -Eq 'Failed to find source|Failed to find source of module|Cannot find module|not found' /tmp/tom-smeding-no-stdlib.log; then
            echo 'unexpected failure mode from no-stdlib probe'
            exit 1
          fi
          echo 'tom-smeding-no-stdlib-probe=EXPECTED-FAIL'
      - name: Agda safe check
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHAD_v164.agda
      - name: Agda safe regression check
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHAD_v164_test.agda
      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
      - name: Run Haskell exact-rational oracle
        run: runghc oracle/haskell_oracle.hs > oracle/haskell.csv
      - name: Run Elixir exact-rational oracle
        run: elixir oracle/elixir_oracle.exs > oracle/elixir.csv
      - name: Compare exact-rational functional oracles
        shell: bash
        run: |
          set -euo pipefail
          sed 's/\r$//' oracle/haskell.csv | sed '/^$/d' > oracle/haskell.normalized.csv
          sed 's/\r$//' oracle/elixir.csv | sed '/^$/d' > oracle/elixir.normalized.csv
          diff -u oracle/haskell.normalized.csv oracle/elixir.normalized.csv
          echo 'exact-rational-functional-oracle-cross-check=PASS'
