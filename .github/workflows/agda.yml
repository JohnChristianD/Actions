# Kernel closure verification trigger; Agda --safe remains authoritative.
name: Agda CI, tooling, and closure persistence
on:
  push:
    paths: ['**/*.agda', '.github/workflows/agda.yml', '.ci/repair-agda-syntax.py']
  pull_request:
    paths: ['**/*.agda', '.github/workflows/agda.yml', '.ci/repair-agda-syntax.py']
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
concurrency:
  group: agda-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  kernel:
    if: ${{ github.event_name != 'pull_request_review' || github.event.pull_request != null }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Agda Setup Action
        uses: agda/agda-setup-action@v1.0.0
        with: {agda-version: '2.8.0'}
      - name: Verify Agda executable
        run: command -v agda && agda --version
      - name: Repair known Agda syntax
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize remaining fragile local proofs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          initial = re.compile(
              r'(?m)^(\s*)initialForm\s*:\s*QRun_v142\.projection\s*\n'
              r'\1\s+\(initialQRun_v142 D budget p x\)\s+≡\s+p\s*='
          )
          s = initial.sub(r'\1initialForm =', s)
          marker = 'qTerminalProjectionUnique_v147 t u ha hx hmu ='
          start = s.find(marker)
          if start >= 0:
              sep = s.find('\n------------------------------------------------------------------------', start)
              replacement = '''qTerminalProjectionUnique_v147 t u refl refl refl =
  vectorExt_v147 (λ i →
    trans
      (QTerminalSolution_v147.stationarity _ i)
      (sym (QTerminalSolution_v147.stationarity _ i)))
'''
              if sep >= 0:
                  s = s[:start] + replacement + s[sep:]
          p.write_text(s)
          PY
      - name: Authoritative Agda --safe kernel check
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          echo agda-kernel-check=PASS
