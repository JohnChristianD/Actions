name: Canonical Agda safe gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_MANIFEST: .ci/canonical-module.txt

jobs:
  canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve canonical composition
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t canonical < "$CANONICAL_MANIFEST"
          test "${#canonical[@]}" -eq 2
          test -f "${canonical[0]}"
          test -f "${canonical[1]}"
          {
            echo "CANONICAL_SOURCE=${canonical[0]}"
            echo "CANONICAL_TEST=${canonical[1]}"
          } >> "$GITHUB_ENV"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          install-hex: true
          install-rebar: false

      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Verify Agda executable and standard library
        shell: bash
        run: |
          set -euo pipefail
          agda --version
          agda --print-agda-app-dir
          test -f "$(agda --print-agda-app-dir)/libraries"

      - name: Audit Tom Smeding upstream proof without rewriting it
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/external/efficient-chad-agda
          git clone --depth 1 https://github.com/tomsmeding/efficient-chad-agda.git .ci/external/efficient-chad-agda
          test -f .ci/external/efficient-chad-agda/chad-cost.agda
          test -f .ci/external/efficient-chad-agda/spec.agda
          test -f .ci/external/efficient-chad-agda/setup.agda
          git -C .ci/external/efficient-chad-agda status --short
          test -z "$(git -C .ci/external/efficient-chad-agda status --short)"

      - name: Check canonical Agda source
        run: agda --safe "$CANONICAL_SOURCE"

      - name: Check canonical Agda regression
        run: agda --safe "$CANONICAL_TEST"

      - name: Probe unchanged Tom Smeding proof under current Agda
        shell: bash
        run: |
          set -uo pipefail
          agda --safe -i .ci/external/efficient-chad-agda .ci/external/efficient-chad-agda/chad-cost.agda > /tmp/tom-smeding.log 2>&1
          status=$?
          cat /tmp/tom-smeding.log
          if [ "$status" -ne 0 ]; then
            echo 'tom-smeding-current-toolchain=INCOMPATIBLE'
            exit "$status"
          fi
          echo 'tom-smeding-current-toolchain=PASS'

      - name: Set up Haskell exact-rational oracle
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'

      - name: Run Haskell exact-rational oracle
        run: runghc oracle/haskell_oracle.hs > oracle/haskell.csv

      - name: Run Elixir exact-rational oracle
        run: elixir oracle/elixir_oracle.exs > oracle/elixir.csv

      - name: Compare exact-rational functional oracles
        shell: bash
        run: |
          set -euo pipefail
          sed 's/\r$//' oracle/haskell.csv | sed '/^$/d' > oracle/haskell.normalized.csv
          sed 's/\r$//' oracle/elixir.csv | sed '/^$/d' > oracle/elixir.normalized.csv
          diff -u oracle/haskell.normalized.csv oracle/elixir.normalized.csv
          echo 'exact-rational-functional-oracle-cross-check=PASS'
