- name: Magic Nix Cache
  # You may pin to the exact commit or the version.
  # uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
  uses: DeterminateSystems/magic-nix-cache-action@v14
  with:
    # Whether to upload build results to the Github Actions cache.
Set to "no-preference" or null to have the GitHub Actions cache turn on if it is available, and FlakeHub Cache is not available (default).
Set to "enabled" or true to explicitly request the GitHub Actions Cache.
Set to "disabled" or false to explicitly disable the GitHub Actions Cache.

    use-gha-cache: # optional
    # The host and port to listen on.
    listen: # optional, default is 127.0.0.1:37515
    # Your preferred upstream cache. Store paths in this store will not be cached in GitHub Actions' cache.
    upstream-cache: # optional, default is https://cache.nixos.org
    # Diagnostic endpoint url where diagnostics and performance data is sent. To disable set this to an empty string.
    diagnostic-endpoint: # optional, default is -
    # Whether to upload build results to FlakeHub Cache.
Set to "no-preference" or null to have FlakeHub Cache turn on opportunistically (default).
Set to "enabled" or true to explicitly request FlakeHub Cache.
Set to "disabled" or false to explicitly disable FlakeHub Cache.

    use-flakehub: # optional
    # The FlakeHub binary cache server.
    flakehub-cache-server: # optional, default is https://cache.flakehub.com
    # The FlakeHub API server.
    flakehub-api-server: # optional, default is https://api.flakehub.com
    # The name of your flake on FlakeHub. The empty string will autodetect your FlakeHub flake.
    flakehub-flake-name: # optional, default is 
    # The port magic-nix-cache uses for daemon startup notification.
    startup-notification-port: # optional, default is 41239
    # Whether or not to diff the store before and after Magic Nix Cache runs
    diff-store: # optional
    # Run a version of the cache binary from somewhere already on disk. Conflicts with all other `source-*` options.
    source-binary: # optional
    # The branch of `magic-nix-cache` to use. Conflicts with all other `source-*` options.
    source-branch: # optional
    # The PR of `magic-nix-cache` to use. Conflicts with all other `source-*` options.
    source-pr: # optional
    # The revision of `nix-magic-nix-cache` to use. Conflicts with all other `source-*` options.
    source-revision: # optional
    # The tag of `magic-nix-cache` to use. Conflicts with all other `source-*` options.
    source-tag: # optional
    # A URL pointing to a `magic-nix-cache` binary. Overrides all other `source-*` options.
    source-url: # optional
    # Whether to fail when any errors are thrown. Used only to test the Action; do not set this in your own workflows.
    _internal-strict-mode: # optional


- name: Restore and save Nix Store
  # You may pin to the exact commit or the version.
  # uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
  uses: nix-community/cache-nix-action@v7
  with:
    # - When a non-empty string, the action uses this key for restoring and saving a cache.
- Otherwise, the action fails.

    primary-key: 
    # - When a newline-separated non-empty list of non-empty key prefixes, when there's a miss on the `primary-key`, 
  the action searches in this list for the first prefix
  for which there exists a cache whose key has this prefix,
  and the action tries to restore that cache.
- Otherwise, this input has no effect.

    restore-prefixes-first-match: # optional, default is 
    # - When a newline-separated non-empty list of non-empty key prefixes, when there's a miss on the `primary-key`,
  the action tries to restore all caches whose keys have these prefixes.
  - Tries caches across all refs to make use of caches created 
    on the current, base, and default branches 
    (see [docs](https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache)).
- Otherwise, this input has no effect.

    restore-prefixes-all-matches: # optional, default is 
    # - When `true`, when there's a hit on the `primary-key`, the action doesn't restore any cache.
- Otherwise, the action can restore caches.
- Doesn't change the behavior of cache saving in any case.

    lookup-only: # optional, default is false
    # - Input form: `<key type>.<result>`.
- `<key type>` options: `primary-key`, `first-match`.
- `<result>` options: `miss`, `not-restored`.
- When the input satisfies the input form, when the event described in the input happens, the action fails.
  - Example:
    - Input: `primary-key.not-restored`.
    - Event: a cache could not be restored via the `primary-key`.
- Otherwise, this input has no effect.

    fail-on: # optional, default is 
    # - Can have an effect only when the action runs on a `Linux` or a `macOS` runner.
- When `true`, the action can do Nix-specific things.
- Otherwise, the action doesn't do them.

    nix: # optional, default is true
    # - When `true`, the action can save a cache with the `primary-key`.
- Otherwise, the action can't save a cache.

    save: # optional, default is true
    # - When `nix: true`, the action uses `["/nix"]` as default paths.
- Otherwise, the action uses an empty list as default paths.
- When a newline-separated non-empty list of non-empty path patterns (see [`@actions/glob`](https://github.com/actions/toolkit/tree/main/packages/glob) for supported patterns), the action appends it to default paths and uses the resulting list for restoring and saving caches.
- Otherwise, the action uses default paths for restoring and saving caches.

    paths: # optional, default is 
    # - Overrides `paths`.
- Can have an effect only when the action runs on a `macOS` runner.

    paths-macos: # optional, default is 
    # - Overrides `paths`.
- Can have an effect only when the action runs on a `Linux` runner.

    paths-linux: # optional, default is 
    # Choose an implementation of the `cache` package.
- When `actions`, use the [actions version](https://github.com/actions/toolkit/tree/main/packages/cache) from [here](https://github.com/nix-community/cache-nix-action/tree/actions-toolkit/packages/cache).
- When `buildjet`, use the [BuildJet version](https://github.com/BuildJet/toolkit/tree/main/packages/cache-buildjet) from [here](https://github.com/nix-community/cache-nix-action/tree/buildjet-toolkit/packages/cache).

    backend: # optional, default is actions
    # - Can have an effect only when `nix: true`, `save: true`.
- The input has no effect if "primary-key" hit occurs when starting to save the new cache.
- When a non-negative integer number (possibly with a suffix), the action collects garbage (via `nix store gc --max ...`) until the Nix store size (in bytes) is at most this number just before the action tries to save a new cache.
- If you specify a suffix, it must be `K` (kibibytes, 2 ^ 10 bytes), `M` (mebibytes, 2 ^ 20 bytes) or `G` (gibibytes, 2 ^ 30 bytes), where `2 ^ N` means `2 to the power N`.
  Examples: `5G` (same as `5368709120`), `20M` (same as `20971520`).
- Otherwise, this input has no effect.

    gc-max-store-size: # optional, default is 
    # - Overrides `gc-max-store-size`.
- Can have an effect only when the action runs on a `macOS` runner.

    gc-max-store-size-macos: # optional, default is 
    # - Overrides `gc-max-store-size`.
- Can have an effect only when the action runs on a `Linux` runner.

    gc-max-store-size-linux: # optional, default is 
    # - When `true`, the action purges (possibly zero) caches.
- The action purges only caches scoped to the current [GITHUB_REF](https://docs.github.com/en/actions/learn-github-actions/variables#default-environment-variables).
- Otherwise, this input has no effect.

    purge: # optional, default is false
    # - Can have an effect only when `purge: true`.
- When `always`, the action always purges the cache with the `primary-key`.
- When `never`, the action never purges the cache with the `primary-key`.
- Otherwise, this input has no effect.

    purge-primary-key: # optional, default is 
    # - Can have an effect only when `purge: true`.
- When a newline-separated non-empty list of non-empty cache key prefixes, the action selects for purging all caches whose keys match some of these prefixes.
- Otherwise, this input has no effect.

    purge-prefixes: # optional, default is 
    # - Can have an effect only when `purge: true`.
- When a non-negative number or a string in the [ISO 8601 duration format](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Temporal/Duration#iso_8601_duration_format),
  the action purges selected caches that were last accessed more than this number of seconds or this duration before the start of the `Post Restore` phase. Examples: `0` (0 seconds), `P1DT12H` (1 day and 12 hours).
- Otherwise, this input has no effect.

    purge-last-accessed: # optional, default is 
    # - Can have an effect only when `purge: true`.
- When a non-negative number or a string in the [ISO 8601 duration format](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Temporal/Duration#iso_8601_duration_format),
  the action purges selected caches that were created more than this number of seconds or this duration before the start of the `Post Restore` phase. Examples: `0` (0 seconds), `P1DT12H` (1 day and 12 hours).
- Otherwise, this input has no effect.

    purge-created: # optional, default is 
    # - When a non-negative number, the action uses it as the chunk size (in bytes) to split up large files during upload.
- Otherwise, the action uses the default value `33554432` (32MB).

    upload-chunk-size: # optional, default is 
    # - The action uses it to communicate with GitHub API.
- If you use a personal access token, it must have the `repo` scope ([link](https://docs.github.com/en/rest/actions/cache?apiVersion=2022-11-28#delete-github-actions-caches-for-a-repository-using-a-cache-key)).

    token: # optional, default is ${{ github.token }}
