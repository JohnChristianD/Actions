name: Agda authoritative safe gate

on:
  push:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Runner probe
        run: |
          set -euo pipefail
          echo 'GitHub Actions runner: PASS'
