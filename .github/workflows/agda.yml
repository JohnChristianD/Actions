name: Focused Agda learner theorem gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject forbidden theorem families
        run: python3 .ci/check-forbidden-theorems.py

      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Verify Agda executable and standard library
        shell: bash
        run: |
          set -euo pipefail
          agda --version
          agda --print-agda-app-dir
          test -f "$(agda --print-agda-app-dir)/libraries"

      - name: Set up Haskell generator runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ghc

      - name: Generate canonical learner theorem report
        run: runghc .ci/discovery/ExplorationTheoremGenerator.hs

      - name: Check shared Int8 algebra
        run: agda --safe Exotic/efficient_chad/Int8.agda

      - name: Check canonical fixed-temperature sparsemax learner monolith
        run: agda --safe Exotic/ERL/FullCoupled/CanonicalSparsemaxLearner.agda

      - name: Check canonical fixed-temperature sparsemax learner regression
        run: agda --safe Exotic/ERL/FullCoupled/CanonicalSparsemaxLearner_test.agda

      - name: Check canonical generated theorem report
        run: agda --safe Exotic/ERL/Exploration/Generated/ExplorationCandidates.agda

      - name: Check focused coupled sparsemax Watkins regression
        run: agda --safe Exotic/ERL/FullCoupled/SparsemaxWatkinsMonolith_test.agda

      - name: Check strict count-memory exclusion
        run: agda --safe Exotic/ERL/FullCoupled/CountMemoryCycleTheorem.agda

      - name: Check strict count-memory regression
        run: agda --safe Exotic/ERL/FullCoupled/CountMemoryCycleTheorem_test.agda

      - name: Check semidirect recurrent signReLU composition
        run: agda --safe Exotic/ERL/FullCoupled/SignReLUSemidirectCycleComposition.agda

      - name: Check semidirect recurrent signReLU regression
        run: agda --safe Exotic/ERL/FullCoupled/SignReLUSemidirectCycleComposition_test.agda

      - name: Check concrete persistent GRU semidirect bridge
        run: agda --safe Exotic/ERL/FullCoupled/ConnectedGRUSemidirectQSA.agda
