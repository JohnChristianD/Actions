name: Agda authoritative safe gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/normalize_v155.exs'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/normalize_v155.exs'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          hexpm: true
          rebar3: false
      - name: Normalize v155 source
        run: elixir .ci/normalize_v155.exs
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Verify Agda executable
        run: agda --version
      - name: Safe-check v155 finite ordered Efficient-CHAD target
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHAD_v155.agda
      - name: Verify active target exclusions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'StoSignSGDv2|StoSignSGD|LayerNorm|BatchNorm|BatchRenorm|DiagonalNewton|NewtonRaphson|Certificate|setup-python|ruby/setup-ruby|python3' Exotic/ERL/FullCoupled/EfficientCHAD_v155.agda
