name: Authoritative Agda safe theorem gate

on:
  push:
    branches: ['main', 'ci/v149-monolith-final']
    paths:
      - 'Exotic/**/*.agda'
      - '.ci/**/*.exs'
      - '.github/workflows/*.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'Exotic/**/*.agda'
      - '.ci/**/*.exs'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
          hexpm: true
          rebar3: false
      - name: Verify runtimes
        run: |
          agda --version
          elixir --version
      - name: Deterministic normalisation and hygiene
        run: |
          set -euo pipefail
          elixir .ci/normalise_agda.exs
          test -z "$(find .ci .github/workflows oracle -type f \( -name '*.py' -o -name '*.rb' \) -print)"
          ! grep -RInE 'python3?|ruby|\.rb' .ci .github/workflows oracle
      - name: Kernel-check canonical composed theorem
        run: agda --safe Exotic/ERL/FullCoupled/SignQIDBDComposed_v153.agda
      - name: Kernel-check normalisation certificate
        run: agda --safe Exotic/ERL/FullCoupled/NormaliseAgda_v153.agda
      - name: Kernel-check interpolation and staged algebra
        run: |
          agda --safe Exotic/ERL/Stages/Stage01_FiniteAlgebra.agda
          agda --safe Exotic/ERL/FullCoupled/CIInterpolation_v147.agda
