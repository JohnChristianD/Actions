name: Agda authoritative safe gate

on:
  push:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
      - name: Canonical repair
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize q-retraction declaration
        run: python3 -c 'from pathlib import Path; p=Path("Exotic/ERL/FullCoupled/CompleteSafe_v147.agda"); s=p.read_text(); s=s.replace("      initialForm : QRun_v142.projection\n", "      initialForm : (QRun_v142.projection\n", 1).replace("(initialQRun_v142 D budget p x) ≡ p =", "(initialQRun_v142 D budget p x) ≡ p) =", 1); p.write_text(s)'
      - run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
