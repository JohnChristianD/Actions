name: Focused Agda learner theorem gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject forbidden theorem families
        run: runghc .ci/CheckForbiddenTheorems.hs

      - name: Set up Haskell generator runtime
        run: sudo apt-get update && sudo apt-get install -y ghc

      - name: Audit redundant canonical components
        run: runghc .ci/discovery/PruneRedundantComponents.hs

      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Verify Agda executable and standard library
        run: agda --version && agda --print-agda-app-dir && test -f "$(agda --print-agda-app-dir)/libraries"

      - name: Generate canonical learner theorem report
        run: runghc .ci/discovery/ExplorationTheoremGenerator.hs

      - name: Check shared Int8 algebra
        run: agda --safe Exotic/efficient_chad/Int8.agda

      - name: Check finite Mobius rational boundary
        run: agda --safe Exotic/ERL/FullCoupled/MobiusRational.agda

      - name: Check finite Mobius recurrent state
        run: agda --safe Exotic/ERL/FullCoupled/DyadicGRU.agda

      - name: Check normalized Walsh-Hadamard boundary
        run: agda --safe Exotic/ERL/FullCoupled/FrozenOrthonormalWalshGRU.agda

      - name: Check direct Watkins critic-only layer
        run: agda --safe Exotic/ERL/FullCoupled/SparsemaxCriticWatkins.agda

      - name: Check direct Watkins critic-only regression
        run: agda --safe Exotic/ERL/FullCoupled/SparsemaxCriticWatkins_test.agda

      - name: Check canonical fixed-temperature sparsemax learner monolith
        run: agda --safe Exotic/ERL/FullCoupled/CanonicalSparsemaxLearnerV2.agda

      - name: Check canonical fixed-temperature sparsemax learner regression
        run: agda --safe Exotic/ERL/FullCoupled/CanonicalSparsemaxLearnerV2_test.agda

      - name: Check canonical generated theorem report
        run: agda --safe Exotic/ERL/Exploration/Generated/ExplorationCandidates.agda

      - name: Check strict count-memory exclusion
        run: agda --safe Exotic/ERL/FullCoupled/CountMemoryCycleTheorem.agda

      - name: Check strict count-memory regression
        run: agda --safe Exotic/ERL/FullCoupled/CountMemoryCycleTheorem_test.agda

      - name: Check Mobius semidirect recurrent composition
        run: agda --safe Exotic/ERL/FullCoupled/MobiusSemidirectCycleComposition.agda
