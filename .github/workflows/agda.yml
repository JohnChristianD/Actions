name: Canonical self-contained learner gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject forbidden theorem families, holes, and postulates
        run: runghc .ci/CheckForbiddenTheorems.hs

      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Verify Agda executable
        run: agda --version && agda --print-agda-app-dir && test -f "$(agda --print-agda-app-dir)/libraries"

      - name: Check self-contained canonical learner
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agda

      - name: Check canonical learner regression
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalLearnerMonolith_test.agda

      - name: Check finite environment ports
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalGamePorts.agda

      - name: Check faithful finite map variants
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalFaithfulGameVariants.agda

      - name: Check finite parameter completeness
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/FiniteParameterCompleteness.agda

      - name: Check finite norm algebra
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/FiniteNormAlgebra.agda

      - name: Check control and observability definitions
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalControlObservability.agda

      - name: Check CNN log-pyramid preservation
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CNNLogPyramidPreservation.agda

      - name: Check GameTheory port
        run: timeout 90s agda --safe Exotic/econlib/GameTheory.agda

      - name: Check learner game execution regression
        run: timeout 90s agda --safe Exotic/ERL/FullCoupled/CanonicalLearnerGameExecution_test.agda

      - name: Set up Haskell generator runtime
        run: sudo apt-get update && sudo apt-get install -y ghc

      - name: Audit redundant learner modules
        run: runghc .ci/discovery/PruneRedundantLearnerModules.hs

      - name: Generate canonical learner theorem report
        run: runghc .ci/discovery/ExplorationTheoremGenerator.hs

      - name: Check generated theorem report
        run: timeout 60s agda --safe Exotic/ERL/Exploration/Generated/ExplorationCandidates.agda
