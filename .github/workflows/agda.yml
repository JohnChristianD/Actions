name: Agda authoritative safe gate

on:
  push:
    branches: ['ci/v148-firstclass-lstm-chad', 'main', 'ci/v149-representation-algebra', 'ci/v149-representation-layernorm-closure']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-monolith-namespace:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/v149-representation-layernorm-closure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Repair only finite namespace/algebra prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()

          old = 'open import Agda.Builtin.Nat using (Nat; zero; suc; _+_)'
          new = 'open import Agda.Builtin.Nat using (Nat; suc)'
          if old in s:
              s = s.replace(old, new, 1)
              for rold, rnew in [
                  ('  [] : Vec A zero\n', '  [] : Vec A Nat.zero\n'),
                  ('        go {zero} ()\n', '        go {Nat.zero} ()\n'),
                  ('  dot {zero} v w = Ring.zero Rg\n', '  dot {Nat.zero} v w = Ring.zero Rg\n'),
              ]:
                  if s.count(rold) == 1:
                      s = s.replace(rold, rnew, 1)
                  elif s.count(rnew) != 1:
                      raise SystemExit(f'finite namespace occurrence missing: {rold!r}')
          elif s.count(new) != 1:
              raise SystemExit('unexpected Nat import state')

          old_plus = 'open import Agda.Builtin.Nat using (Nat; suc; _+_)'
          if old_plus in s:
              s = s.replace(old_plus, new, 1)

          if 'record SmoothAlgebra : Set₁ where' not in s:
              marker = '------------------------------------------------------------------------\n-- Seven coupled parameter blocks and finite parameter indices\n------------------------------------------------------------------------\n'
              algebra = '''------------------------------------------------------------------------
-- Minimal finite smooth algebra interface used by the monolithic recurrent
-- boundary. All non-ring operations remain explicit primitives; their
-- domains and reverse laws can therefore be witnessed algebraically.
------------------------------------------------------------------------

record SmoothAlgebra : Set₁ where
  field
    orderedRing : OrderedRing
    exp log tanh sigmoid :
      Ring.R (OrderedRing.base orderedRing) → Ring.R (OrderedRing.base orderedRing)
    dexp dlog dtanh dsigmoid :
      Ring.R (OrderedRing.base orderedRing) → Ring.R (OrderedRing.base orderedRing)
    sqrt recip :
      Ring.R (OrderedRing.base orderedRing) → Ring.R (OrderedRing.base orderedRing)
    Nonzero SqrtDomain : Ring.R (OrderedRing.base orderedRing) → Set
    invLaw : ∀ {x} → Nonzero x →
      Ring._*_ (OrderedRing.base orderedRing) x (recip x) ≡
      Ring.one (OrderedRing.base orderedRing)
    sqrtLaw : ∀ {x} → SqrtDomain x →
      Ring._*_ (OrderedRing.base orderedRing) (sqrt x) (sqrt x) ≡ x

Scalar : SmoothAlgebra → Set
Scalar S = Ring.R (OrderedRing.base (SmoothAlgebra.orderedRing S))

VecS : SmoothAlgebra → Nat → Set
VecS S n = Fin n → Scalar S

MatS : SmoothAlgebra → Nat → Nat → Set
MatS S m n = Fin m → Fin n → Scalar S

A : Set
A = Nat

------------------------------------------------------------------------
'''
              if marker not in s:
                  raise SystemExit('SmoothAlgebra insertion marker missing')
              s = s.replace(marker, algebra + marker, 1)

          s = s.replace('Rg = OrderedRing.ring orderedRing', 'Rg = OrderedRing.base orderedRing', 1)
          p.write_text(s)
          PY
          git diff --check
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
      - name: Commit only after kernel check
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            echo 'no repair needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: restore finite SmoothAlgebra prerequisite for monolith'
          git push origin HEAD:ci/v149-representation-layernorm-closure

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Verify Agda executable
        run: agda --version
      - name: Safe-check combined self-contained surface
        run: agda --safe Exotic/ERL/FullCoupled/AllSafeCombined.agda
      - name: Safe-check full Efficient-CHAD source-to-source transliteration
        run: agda --safe Exotic/ERL/FullCoupled/EfficientCHADSourceToSource.agda
      - name: Safe-check isolated linear coupled learner
        run: agda --safe Exotic/ERL/FullCoupled/LinearCoupledLearnerNoNormLSTM.agda
      - name: Safe-check first-class finite recurrent CHAD
        run: agda --safe Exotic/ERL/FullCoupled/FirstClassRecurrentCHAD.agda
      - name: Safe-check shared network CHAD
        run: agda --safe Exotic/ERL/FullCoupled/SharedNetworkCHAD.agda
      - name: Safe-check representation primitive algebra
        run: agda --safe Exotic/ERL/FullCoupled/RepresentationPrimitiveAlgebra.agda
      - name: Safe-check domain-carrying LayerNorm closure
        run: agda --safe Exotic/ERL/FullCoupled/RepresentationLayerNormClosure.agda
      - name: Safe-check authoritative complete closure
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
