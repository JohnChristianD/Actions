name: Agda kernel and Haskell transpilation

on:
  push:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Agda 2.8.0
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - name: Verify Agda
        run: agda --version

      - name: Repair checked-in Agda syntax
        run: python3 .ci/repair-agda-syntax.py

      - name: Normalize initialForm binding
        run: |
          set -euo pipefail
          perl -0pi -e 's/^([ \t]*)initialForm[ \t]*:[ \t]*QRun_v142\.projection[^\n]*\n[ \t]*\(initialQRun_v142 D budget p x\)[ \t]*≡[ \t]*p[ \t]*=[ \t]*\n/${1}initialForm =\n/m' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda

      - name: Normalize terminal projection proof
        run: |
          set -euo pipefail
          perl -0pi -e 's/qTerminalProjectionUnique_v147 t u ha hx hmu =.*?\n\nqTerminalConfluence_v147/qTerminalProjectionUnique_v147 t u refl refl refl =\n  vectorExt_v147 (λ i →\n    trans\n      (QTerminalSolution_v147.stationarity t i)\n      (sym (QTerminalSolution_v147.stationarity u i)))\n\nqTerminalConfluence_v147/s' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda

      - name: Normalize Nat and algebra grammar
        run: |
          set -euo pipefail
          f='Exotic/ERL/FullCoupled/CompleteSafe_v147.agda'
          python3 - "$f" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('open import Agda.Builtin.Nat using (Nat; zero; suc; _+_)', 'open import Agda.Builtin.Nat using (Nat; suc) renaming (zero to natZero)')
          s = s.replace('open import Agda.Builtin.Equality using (_≡_; refl; sym; trans; cong; subst)', 'open import Agda.Builtin.Equality using (_≡_; refl)')
          s = s.replace('[] : Vec A zero', '[] : Vec A natZero')
          s = s.replace('sumFin _ z zero _ = z', 'sumFin _ z natZero _ = z')
          s = s.replace('tabulateV {zero} f = []', 'tabulateV {natZero} f = []')
          s = s.replace('\nopen Ring\n\nrecord OrderedRing', '\nrecord OrderedRing')
          s = s.replace('\n¬ A = A → ⊥\n', '\n¬ A = A → ⊥\n\n_≠_ : {A : Set} → A → A → Set\nx ≠ y = ¬ (x ≡ y)\n')
          s = s.replace('Rg = OrderedRing.ring (SmoothAlgebra.orderedRing S)\n  minus x y = Ring._+_ Rg x (Ring.neg Rg y)', 'Rg = OrderedRing.ring (SmoothAlgebra.orderedRing S)\n  minus : Scalar S → Scalar S → Scalar S\n  minus x y = Ring._+_ Rg x (Ring.neg Rg y)')
          start = s.find('module EfficientCHAD ')
          stop = s.find('\n------------------------------------------------------------------------\n-- Concrete neural network components', start)
          if start >= 0 and stop >= 0:
              chunk = s[start:stop]
              chunk = re.sub(r'(?<!Ring\.)\bR\b', 'CR', chunk)
              s = s[:start] + chunk + s[stop:]
          s = s.replace('eval y ρ * coeff x ρ i + eval x ρ * coeff y ρ i', '(eval y ρ * coeff x ρ i) + (eval x ρ * coeff y ρ i)')
          for old, new in {
              '→ a + c ≤ b + d': '→ (a + c) ≤ (b + d)',
              '→ a + c < b + d': '→ (a + c) < (b + d)',
              '→ c + a < c + b': '→ (c + a) < (c + b)',
              '→ a + neg b < zero': '→ (a + neg b) < zero',
              '→ a + neg b ≤ zero': '→ (a + neg b) ≤ zero',
              'abs (x + y) ≤ abs x + abs y': 'abs (x + y) ≤ (abs x + abs y)',
              '→ zero ≤ a * b': '→ zero ≤ (a * b)',
              '→ c * a ≤ c * b': '→ (c * a) ≤ (c * b)',
              '→ c * a < c * b': '→ (c * a) < (c * b)',
              '→ zero < a * b': '→ zero < (a * b)',
              '→ zero < x * x': '→ zero < (x * x)',
              '→ zero ≤ x * x': '→ zero ≤ (x * x)',
          }.items():
              s = s.replace(old, new)
          helper = '''\nsym : ∀ {A : Set} {x y : A} → x ≡ y → y ≡ x\nsym refl = refl\n\ntrans : ∀ {A : Set} {x y z : A} → x ≡ y → y ≡ z → x ≡ z\ntrans refl yz = yz\n\ncong : ∀ {A B : Set} (f : A → B) {x y : A} → x ≡ y → f x ≡ f y\ncong f refl = refl\n\nsubst : ∀ {A : Set} (P : A → Set) {x y : A} → x ≡ y → P x → P y\nsubst P refl px = px\n'''
          marker = '_≠_ : {A : Set} → A → A → Set\nx ≠ y = ¬ (x ≡ y)\n'
          if helper.strip() not in s:
              s = s.replace(marker, marker + helper)
          s = s.replace('record LSTMState (S : SmoothAlgebra) (hidden : Nat) : Set where\n  field hidden cell : VecS S hidden', 'record LSTMState (S : SmoothAlgebra) (hiddenDim : Nat) : Set where\n  field hidden cell : VecS S hiddenDim')
          s = s.replace('  μ = vSum xs * SmoothAlgebra.recip S (SmoothAlgebra.fromNat S d)\n  centered x = x + neg μ', '  μ = vSum xs * SmoothAlgebra.recip S (SmoothAlgebra.fromNat S d)\n  centered : Scalar S → Scalar S\n  centered x = x + neg μ')
          s = s.replace('  invStd = SmoothAlgebra.recip S\n    (SmoothAlgebra.sqrt S (variance + LayerNorm.epsilon ln))\n  normalise x = centered x * invStd', '  invStd = SmoothAlgebra.recip S\n    (SmoothAlgebra.sqrt S (variance + LayerNorm.epsilon ln))\n  normalise : Scalar S → Scalar S\n  normalise x = centered x * invStd')
          s = s.replace('LSTMGates.gates', 'LSTMBlock.gates')
          s = s.replace('residual_v140 mu alpha x i =', 'residual_v140 {S} mu alpha x i =')
          s = s.replace('if b then\n      SmoothAlgebra.max S zero (residual_v140 mu (a ∷ as) (xv ∷ xs) fzero)\n        ∷ candidate bs as xs\n    else\n      zero ∷ candidate bs as xs', 'if b then\n      (SmoothAlgebra.max S zero (residual_v140 mu (a ∷ as) (xv ∷ xs) fzero)\n        ∷ candidate bs as xs)\n    else\n      (zero ∷ candidate bs as xs)')
          q = 'alpha + Ring.neg (OrderedRing.ring (SmoothAlgebra.orderedRing S))\n    (mu * (x * x)) < zero'
          s = s.replace(q, '(alpha + Ring.neg (OrderedRing.ring (SmoothAlgebra.orderedRing S))\n    (mu * (x * x))) < zero')
          s = s.replace('qProjectionCross_v141 ha hr =', 'qProjectionCross_v141 {S} {alpha = alpha} {mu = mu} {x = x} ha hr =')
          p.write_text(s)
          PY

      - name: Audit and normalize all implicit theorem binders
        run: |
          set -euo pipefail
          f='Exotic/ERL/FullCoupled/CompleteSafe_v147.agda'
          python3 - "$f" <<'PY'
          from pathlib import Path
          import re, sys

          p = Path(sys.argv[1])
          lines = p.read_text().splitlines()
          ident = r'[A-Za-z_][A-Za-z0-9_\']*'
          changed = []

          def implicit_names(signature):
              names = []
              for body in re.findall(r'\{([^{}]*)\}', signature):
                  left = body.split(':', 1)[0]
                  for token in re.findall(ident, left):
                      if token not in {'Set', 'Set₁'} and token not in names:
                          names.append(token)
              return names

          i = 0
          while i < len(lines):
              sig = re.match(r'^(' + ident + r')\s*:\s*.*$', lines[i])
              if sig is None:
                  i += 1
                  continue
              name = sig.group(1)
              j = i + 1
              signature_lines = [lines[i]]
              equation_index = None
              while j < len(lines):
                  if re.match(r'^' + ident + r'\s*:\s*', lines[j]) and not lines[j].startswith(' '):
                      break
                  eq = re.match(r'^' + re.escape(name) + r'(\s+.*)?\s*=\s*', lines[j])
                  if eq is not None:
                      equation_index = j
                      break
                  signature_lines.append(lines[j])
                  j += 1
              if equation_index is None:
                  i = j
                  continue

              names = implicit_names('\n'.join(signature_lines))
              if names:
                  line = lines[equation_index]
                  lhs, rhs = line.split('=', 1)
                  for n in names:
                      if not re.search(r'(?<![A-Za-z0-9_\'])' + re.escape(n) + r'(?![A-Za-z0-9_\'])', lhs):
                          lhs = lhs.rstrip() + ' {' + n + ' = ' + n + '}'
                  new_line = lhs + '=' + rhs
                  if new_line != line:
                      lines[equation_index] = new_line
                      changed.append(f'{name}:{equation_index + 1}')
              i = equation_index + 1

          p.write_text('\n'.join(lines) + '\n')
          print('implicit-binder-normalizations=' + str(len(changed)))
          print('implicit-binder-sites=' + ','.join(changed))

          # Independent postcondition: no versioned top-level equation may
          # leave an implicit parameter from its own signature absent from the LHS.
          remaining = []
          i = 0
          while i < len(lines):
              sig = re.match(r'^(' + ident + r')\s*:\s*.*$', lines[i])
              if sig is None:
                  i += 1
                  continue
              name = sig.group(1)
              j = i + 1
              signature_lines = [lines[i]]
              equation_index = None
              while j < len(lines):
                  if re.match(r'^' + ident + r'\s*:\s*', lines[j]) and not lines[j].startswith(' '):
                      break
                  if re.match(r'^' + re.escape(name) + r'(\s+.*)?\s*=\s*', lines[j]):
                      equation_index = j
                      break
                  signature_lines.append(lines[j])
                  j += 1
              if equation_index is not None:
                  names = implicit_names('\n'.join(signature_lines))
                  lhs = lines[equation_index].split('=', 1)[0]
                  missing = [n for n in names if not re.search(r'(?<![A-Za-z0-9_\'])' + re.escape(n) + r'(?![A-Za-z0-9_\'])', lhs)]
                  if missing and '_v' in name:
                      remaining.append(f'{name}:{equation_index + 1}:missing={"/".join(missing)}')
                  i = equation_index + 1
              else:
                  i = j
          if remaining:
              for item in remaining:
                  print('UNBOUND-IMPLICIT=' + item)
              raise SystemExit(1)
          PY
          grep -n -A5 '^residualSquareNonzero_v140' "$f"
          grep -n -A5 '^qProjectionCross_v141' "$f"

      - name: Agda2HS diagnostic probe
        continue-on-error: true
        run: |
          set -o pipefail
          bin="$RUNNER_TEMP/agda2hs-bin"
          mkdir -p "$bin"
          if ! command -v agda2hs >/dev/null 2>&1; then
            if command -v cabal >/dev/null 2>&1; then
              cabal install agda2hs --constraint='Agda == 2.8.0' --installdir="$bin" --install-method=copy --overwrite-policy=always 2>&1 | tee "$RUNNER_TEMP/agda2hs-install.log"
            else
              echo 'Agda2HS diagnostic skipped: cabal is unavailable'
              exit 0
            fi
          fi
          command -v agda2hs || true
          "$bin/agda2hs" Exotic/ERL/FullCoupled/CompleteSafe_v147.agda 2>&1 | tee "$RUNNER_TEMP/agda2hs.log"

      - name: Authoritative Agda --safe check
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          echo 'agda --safe: PASS'

      - name: Generate Haskell backend
        run: |
          set -euo pipefail
          agda --safe --compile --ghc-dont-call-ghc Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          test -d MAlonzo
          echo 'Agda -> Haskell transpilation: PASS'

      - name: Persist repaired source after proof gate
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: normalize Agda source syntax after safe check'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
