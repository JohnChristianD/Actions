# Authoritative kernel gate; source proof remains unchanged until Agda accepts it.
name: Agda authoritative safe gate

on:
  push:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
    paths: ['**/*.agda', '.github/workflows/agda.yml', '.ci/repair-agda-syntax.py', '.ci/normalize-completesafe-namespaces.py', '.ci/normalize-completesafe-let-bindings.py', '.ci/normalize-completesafe-initial-form.py', '.ci/normalize-terminal-uniqueness.py']
  pull_request:
    paths: ['**/*.agda', '.github/workflows/agda.yml', '.ci/repair-agda-syntax.py', '.ci/normalize-completesafe-namespaces.py', '.ci/normalize-completesafe-let-bindings.py', '.ci/normalize-completesafe-initial-form.py', '.ci/normalize-terminal-uniqueness.py']
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
      - name: Canonical repair
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize q-retraction declaration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          old = '''      initialForm : QRun_v142.projection
          (initialQRun_v142 D budget p x) ≡ p =
'''
          new = '''      initialForm =
'''
          if old not in s:
              raise SystemExit('q-retraction typed local-let declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
  pull-requests: read
jobs:
  kernel:
    if: ${{ github.event_name != 'pull_request_review' || github.event.pull_request != null }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Agda 2.8.0
        uses: agda/agda-setup-action@v1.0.0
        with: {agda-version: '2.8.0'}
      - name: Verify Agda executable
        run: command -v agda && agda --version
      - name: Repair known Agda syntax
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize CompleteSafe Nat/Ring namespaces
        run: python3 .ci/normalize-completesafe-namespaces.py
      - name: Normalize CompleteSafe typed let bindings
        run: python3 .ci/normalize-completesafe-let-bindings.py
      - name: Normalize CompleteSafe initialForm binding
        run: python3 .ci/normalize-completesafe-initial-form.py
      - name: Normalize terminal projection uniqueness
        run: python3 .ci/normalize-terminal-uniqueness.py
      - name: Authoritative Agda --safe kernel check
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          echo agda-kernel-check=PASS
