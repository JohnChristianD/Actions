name: Agda authoritative safe gate

on:
  push:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
      - run: agda --version
      - name: Canonical repair
        run: python3 .ci/repair-agda-syntax.py
      - name: Normalize malformed KKT boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          start = s.find('-- The theorem to be exported after kernel checking is:')
          if start < 0:
              raise SystemExit('KKT documentation marker not found')
          sep = s.find('\n------------------------------------------------------------------------', start)
          if sep < 0:
              raise SystemExit('KKT boundary separator not found')
          replacement = ('-- The old audited KKT placeholder was documentation, not a theorem.\n'
                         '-- The executable constructive KKT theorem is defined below.\n')
          s = s[:start] + replacement + s[sep:]
          p.write_text(s)
          PY
      - run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
