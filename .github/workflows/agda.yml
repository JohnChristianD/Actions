name: Agda kernel and Haskell transpilation

on:
  push:
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
      - '.ci/repair-agda-syntax.py'
  pull_request:
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
      - '.ci/repair-agda-syntax.py'
  workflow_dispatch:

concurrency:
  group: agda-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Agda 2.8.0
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - name: Verify Agda
        run: |
          set -euo pipefail
          agda --version

      - name: Repair checked-in Agda syntax
        run: python3 .ci/repair-agda-syntax.py

      - name: Normalize multiline initialForm binding
        run: |
          set -euo pipefail
          perl -0pi -e 's/^([ \t]*)initialForm[ \t]*:[ \t]*QRun_v142\.projection[^\n]*\n[ \t]*\(initialQRun_v142 D budget p x\)[ \t]*≡[ \t]*p[ \t]*=[ \t]*\n/${1}initialForm =\n/m' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda

      - name: Normalize terminal projection proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          start = s.index('qTerminalProjectionUnique_v147 t u ha hx hmu =')
          end = s.index('\n\nqTerminalConfluence_v147', start)
          replacement = '''qTerminalProjectionUnique_v147 t u refl refl refl =
  vectorExt_v147 (λ i →
    trans
      (QTerminalSolution_v147.stationarity t i)
      (sym (QTerminalSolution_v147.stationarity u i)))'''
          p.write_text(s[:start] + replacement + s[end:])
          PY

      - name: Authoritative Agda --safe check
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          echo 'agda --safe: PASS'

      - name: Generate Haskell backend
        run: |
          set -euo pipefail
          agda --safe --compile --ghc-dont-call-ghc Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          test -d MAlonzo
          find MAlonzo -type f -name '*.hs' -print | sort
          echo 'Agda -> Haskell transpilation: PASS'

      - name: Persist repaired Agda source after proof gate
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: normalize Agda source syntax after safe check'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
