name: Canonical Agda safe gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - '.github/workflows/agda.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_MANIFEST: .ci/canonical-module.txt

jobs:
  canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve canonical composition
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t canonical < "$CANONICAL_MANIFEST"
          test "${#canonical[@]}" -eq 2
          test -f "${canonical[0]}"
          test -f "${canonical[1]}"
          {
            echo "CANONICAL_SOURCE=${canonical[0]}"
            echo "CANONICAL_TEST=${canonical[1]}"
          } >> "$GITHUB_ENV"

      - name: Reject banned canonical mechanisms and proof bypasses
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -i 'Munchausen|Tsallis-2|TrueOnlineTD|OpenES|MR15|softmax|postulate|--unsafe|OPTIONS[[:space:]]+--unsafe' -- \
            'Exotic/ERL/FullCoupled/CanonicalLearner.agda' \
            'Exotic/ERL/FullCoupled/CanonicalTransformer.agda' \
            'Exotic/ERL/FullCoupled/FiniteVJP.agda'; then
            echo 'canonical-banned-mechanism-or-proof-bypass=FOUND'
            exit 1
          fi
          echo 'canonical-banned-mechanism-or-proof-bypass=ABSENT'

      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Verify Agda executable and standard library
        shell: bash
        run: |
          set -euo pipefail
          agda --version
          agda --print-agda-app-dir
          test -f "$(agda --print-agda-app-dir)/libraries"

      - name: Set up GHC for Agda2HS tooling
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'

      - name: Install Agda2HS from the Cabal toolchain
        shell: bash
        run: |
          set -euo pipefail
          cabal update
          cabal install agda2hs --install-method=copy
          agda2hs --help >/dev/null
          agda2hs locate >> "$(agda --print-agda-app-dir)/libraries"

      - name: Audit Tom Smeding Efficient-CHAD source without rewriting it
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/external/efficient-chad-agda
          git clone --depth 1 https://github.com/tomsmeding/efficient-chad-agda.git .ci/external/efficient-chad-agda
          test -f .ci/external/efficient-chad-agda/chad-cost.agda
          test -f .ci/external/efficient-chad-agda/spec.agda
          test -f .ci/external/efficient-chad-agda/setup.agda
          test -z "$(git -C .ci/external/efficient-chad-agda status --short)"

      - name: Normalise canonical Agda source before checking
        shell: bash
        run: .ci/agda-repair.sh normalize "$CANONICAL_SOURCE"

      - name: Check canonical Agda source
        shell: bash
        run: |
          set -uo pipefail
          if agda --safe "$CANONICAL_SOURCE" >/tmp/canonical-source.log 2>&1; then
            cat /tmp/canonical-source.log
            exit 0
          fi
          cat /tmp/canonical-source.log
          .ci/agda-repair.sh repair "$CANONICAL_SOURCE" /tmp/canonical-source.log
          agda --safe "$CANONICAL_SOURCE"

      - name: Check canonical Agda regression
        shell: bash
        run: |
          set -uo pipefail
          if agda --safe "$CANONICAL_TEST" >/tmp/canonical-test.log 2>&1; then
            cat /tmp/canonical-test.log
            exit 0
          fi
          cat /tmp/canonical-test.log
          .ci/agda-repair.sh repair "$CANONICAL_TEST" /tmp/canonical-test.log
          agda --safe "$CANONICAL_TEST"

      - name: Check finite VJP and canonical composition layers
        shell: bash
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/FiniteVJP.agda
          agda --safe Exotic/ERL/FullCoupled/CanonicalTransformer.agda
          agda --safe Exotic/ERL/FullCoupled/CanonicalLearner.agda
          agda --safe Exotic/ERL/FullCoupled/CanonicalLearner_test.agda
          agda --safe Exotic/ERL/Exploration/FiniteNoise.agda
          agda --safe Exotic/ERL/Exploration/NoisyNetFinite.agda

      - name: Extract the canonical learner with Agda2HS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/agda2hs-out
          mkdir -p .ci/agda2hs-out
          agda2hs Exotic/ERL/FullCoupled/CanonicalLearner.agda -o .ci/agda2hs-out
          test -s .ci/agda2hs-out/Exotic/ERL/FullCoupled/CanonicalLearner.hs

      - name: Compile generated canonical Haskell surface
        shell: bash
        run: |
          set -euo pipefail
          ghc -fno-code .ci/agda2hs-out/Exotic/ERL/FullCoupled/CanonicalLearner.hs

      - name: Probe unchanged Efficient-CHAD proof under current Agda
        shell: bash
        run: |
          set -uo pipefail
          agda --safe -i .ci/external/efficient-chad-agda .ci/external/efficient-chad-agda/chad-cost.agda > /tmp/tom-smeding.log 2>&1
          status=$?
          cat /tmp/tom-smeding.log
          if [ "$status" -ne 0 ]; then
            echo 'tom-smeding-current-toolchain=INCOMPATIBLE'
            exit "$status"
          fi
          echo 'tom-smeding-current-toolchain=PASS'
