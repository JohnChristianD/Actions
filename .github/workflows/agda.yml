name: Canonical Agda safe gate

on:
  push:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.agda'
      - '.ci/**'
      - 'docs/**'
      - '.github/workflows/agda.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_SOURCE: Exotic/ERL/FullCoupled/AllSafeCombined.agda
  CANONICAL_TEST: Exotic/ERL/FullCoupled/AllSafeCombined_test.agda

jobs:
  canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject forbidden theorem families and non-dyadic numeric imports
        run: runghc .ci/check-forbidden-theorems.hs

      - name: Set up Agda and standard library
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'
          agda-stdlib-version: '2.4'

      - name: Verify Agda executable and standard library
        run: agda --version

      - name: Check canonical Agda source
        run: agda --safe "$CANONICAL_SOURCE"

      - name: Check canonical Agda regression
        run: agda --safe "$CANONICAL_TEST"

      - name: Check MR15 exploration proof
        run: agda --safe Exotic/ERL/Exploration/MR15Reachability.agda

      - name: Check OpenES exploration proof
        run: agda --safe Exotic/ERL/Exploration/OpenESDyadic.agda

      - name: Check coupled NoisyNet exploration proof
        run: agda --safe Exotic/ERL/FullCoupled/NoisyNetCoupled.agda

      - name: Check flat eligibility proof
        run: agda --safe Exotic/ERL/Exploration/FlatDyadicEligibility.agda

      - name: Check dyadic law algebra
        run: agda --safe Exotic/ERL/Exploration/DyadicLaws.agda

      - name: Check recurrent GRU algebra
        run: agda --safe Exotic/ERL/FullCoupled/DyadicGRU.agda

      - name: Check GRU composition algebra and invariant
        run: agda --safe Exotic/ERL/FullCoupled/GRUCompositionAlgebra.agda

      - name: Check DPG recurrent parameter perturbation
        run: agda --safe Exotic/ERL/FullCoupled/DPGRecurrentPerturbation.agda

      - name: Check global optimizer invariant
        run: agda --safe Exotic/ERL/FullCoupled/GlobalOptimizer.agda

      - name: Check global L2 invariant
        run: agda --safe Exotic/ERL/FullCoupled/GlobalL2.agda

      - name: Check finite norm-pair boundary
        run: agda --safe Exotic/ERL/FullCoupled/NormPair.agda

      - name: Check finite Mobius group algebra
        run: agda --safe Exotic/ERL/FullCoupled/MobiusGroup.agda

      - name: Check finite Haar sparsemax RoPE composition
        run: agda --safe Exotic/ERL/FullCoupled/FiniteHaarSparsemaxRoPE.agda

      - name: Check Int8 curse-of-dimensionality accounting
        run: agda --safe Exotic/ERL/FullCoupled/Int8CurseDimensionality.agda

      - name: Check Mobius recurrent composition
        run: agda --safe Exotic/ERL/FullCoupled/MobiusGRU.agda

      - name: Check finite representation composition
        run: agda --safe Exotic/ERL/FullCoupled/DyadicRepresentation.agda

      - name: Check finite DPG theorem
        run: agda --safe Exotic/ERL/FullCoupled/Int8DPG.agda

      - name: Check full method-law coupling
        run: agda --safe Exotic/ERL/FullCoupled/DyadicMethodLawCoupling.agda

      - name: Check Econlib equilibrium fragment
        run: agda --safe Exotic/econlib/Equilibrium.agda

      - name: Check Econlib equilibrium folder port
        run: agda --safe Exotic/econlib/Equilibrium/Finite.agda

      - name: Check Econlib game-theory fragment
        run: agda --safe Exotic/econlib/GameTheory.agda

      - name: Check Econlib game-theory folder port
        run: agda --safe Exotic/econlib/GameTheory/Finite.agda

      - name: Check Econlib optimization fragment
        run: agda --safe Exotic/econlib/Optimization.agda

      - name: Check Econlib optimization folder port
        run: agda --safe Exotic/econlib/Optimization/Finite.agda

      - name: Check finite Econlib dyadic umbrella
        run: agda --safe Exotic/econlib/dyadic/Econlib.agda

      - name: Check dyadic algebra
        run: agda --safe Exotic/efficient_chad/Dyadic.agda

      - name: Check Efficient CHAD dyadic fragment
        run: agda --safe Exotic/efficient_chad/DyadicCHAD.agda

      - name: Check endogenous parallel-prefix algebra
        run: agda --safe Exotic/efficient_chad/ParallelPrefix.agda

      - name: Set up Haskell discovery compiler
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'

      - name: Generate and check exploration theorem status
        run: runghc .ci/discovery/ExplorationTheoremGenerator.hs

      - name: Check generated exploration theorem report
        run: agda --safe Exotic/ERL/Exploration/Generated/ExplorationCandidates.agda
