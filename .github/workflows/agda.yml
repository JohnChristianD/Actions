# Authoritative kernel gate; source proof remains unchanged until Agda accepts it.
name: Agda authoritative safe gate

on:
  push:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  pull_request:
    paths:
      - '**/*.agda'
      - '.ci/repair-agda-syntax.py'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Agda 2.8.0
        uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Canonical structural repair
        run: python3 .ci/repair-agda-syntax.py
      - name: Canonical local-proof normalization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('Exotic/ERL/FullCoupled/CompleteSafe_v147.agda')
          s = p.read_text()
          initial = re.compile(
              r'(?m)^(\s*)initialForm\s*:\s*QRun_v142\.projection\s*\n'
              r'\1\s+\(initialQRun_v142 D budget p x\)\s+≡\s+p\s*='
          )
          s2 = initial.sub(r'\1initialForm =', s)
          if s2 == s:
              initial2 = re.compile(
                  r'(?m)^(\s*)initialForm\s*:\s*QRun_v142\.projection\s*\n'
                  r'\s*\(initialQRun_v142 D budget p x\)\s+≡\s+p\s*='
              )
              s2 = initial2.sub(r'\1initialForm =', s)
          s = s2
          marker = 'qTerminalProjectionUnique_v147 t u ha hx hmu ='
          start = s.find(marker)
          if start >= 0:
              sep = s.find('\n------------------------------------------------------------------------', start)
              if sep >= 0:
                  s = s[:start] + '''qTerminalProjectionUnique_v147 t u refl refl refl =
  vectorExt_v147 (λ i →
    trans
      (QTerminalSolution_v147.stationarity _ i)
      (sym (QTerminalSolution_v147.stationarity _ i)))
''' + s[sep:]
          p.write_text(s)
          PY
      - name: Authoritative Agda --safe
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          echo 'agda --safe: PASS'
