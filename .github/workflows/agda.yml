name: Agda kernel and Haskell transpilation

on:
  push:
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
      - '.ci/repair-agda-syntax.py'
  pull_request:
    paths:
      - '**/*.agda'
      - '.github/workflows/agda.yml'
      - '.ci/repair-agda-syntax.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Agda 2.8.0
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - name: Verify Agda
        run: agda --version

      - name: Repair checked-in Agda syntax
        run: python3 .ci/repair-agda-syntax.py

      - name: Normalize initialForm binding
        run: |
          set -euo pipefail
          perl -0pi -e 's/^([ \t]*)initialForm[ \t]*:[ \t]*QRun_v142\.projection[^\n]*\n[ \t]*\(initialQRun_v142 D budget p x\)[ \t]*≡[ \t]*p[ \t]*=[ \t]*\n/${1}initialForm =\n/m' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda

      - name: Normalize terminal projection proof
        run: |
          set -euo pipefail
          perl -0pi -e 's/qTerminalProjectionUnique_v147 t u ha hx hmu =.*?\n\nqTerminalConfluence_v147/qTerminalProjectionUnique_v147 t u refl refl refl =\n  vectorExt_v147 (λ i →\n    trans\n      (QTerminalSolution_v147.stationarity t i)\n      (sym (QTerminalSolution_v147.stationarity u i)))\n\nqTerminalConfluence_v147/s' Exotic/ERL/FullCoupled/CompleteSafe_v147.agda

      - name: Normalize Nat and algebra grammar
        run: |
          set -euo pipefail
          f='Exotic/ERL/FullCoupled/CompleteSafe_v147.agda'
          python3 - "$f" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace(
              'open import Agda.Builtin.Nat using (Nat; zero; suc; _+_)',
              'open import Agda.Builtin.Nat using (Nat; suc) renaming (zero to natZero)')
          s = s.replace('[] : Vec A zero', '[] : Vec A natZero')
          s = s.replace('sumFin _ z zero _ = z', 'sumFin _ z natZero _ = z')
          s = s.replace('tabulateV {zero} f = []', 'tabulateV {natZero} f = []')
          s = s.replace('\nopen Ring\n\nrecord OrderedRing', '\nrecord OrderedRing')
          s = s.replace('\n¬ A = A → ⊥\n', '\n¬ A = A → ⊥\n\n_≠_ : {A : Set} → A → A → Set\nx ≠ y = ¬ (x ≡ y)\n')
          for old, new in {
              '→ a + c ≤ b + d': '→ (a + c) ≤ (b + d)',
              '→ a + c < b + d': '→ (a + c) < (b + d)',
              '→ c + a < c + b': '→ (c + a) < (c + b)',
              '→ a + neg b < zero': '→ (a + neg b) < zero',
              'abs (x + y) ≤ abs x + abs y': 'abs (x + y) ≤ (abs x + abs y)',
              '→ zero ≤ a * b': '→ zero ≤ (a * b)',
              '→ c * a ≤ c * b': '→ (c * a) ≤ (c * b)',
              '→ c * a < c * b': '→ (c * a) < (c * b)',
              '→ zero < a * b': '→ zero < (a * b)',
              '→ zero < x * x': '→ zero < (x * x)',
          }.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Authoritative Agda --safe check
        run: |
          set -euo pipefail
          agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          echo 'agda --safe: PASS'

      - name: Generate Haskell backend
        run: |
          set -euo pipefail
          agda --safe --compile --ghc-dont-call-ghc Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          test -d MAlonzo
          echo 'Agda -> Haskell transpilation: PASS'

      - name: Persist repaired source after proof gate
        run: |
          set -euo pipefail
          if git diff --quiet -- Exotic/ERL/FullCoupled/CompleteSafe_v147.agda; then
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
          git commit -m 'fix: normalize Agda source syntax after safe check'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}