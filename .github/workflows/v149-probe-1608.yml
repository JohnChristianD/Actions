name: v149 probe parser boundary 1608
on:
  push:
    branches: ['ci/v149-monolith-dedupe']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: agda/agda-setup-action@v1.0.0
        with:
          agda-version: '2.8.0'
      - name: Apply deterministic normalization
        run: python3 .ci/v149-dedupe-monolith.py
      - name: Apply current parser normalizers
        run: |
          python3 .ci/v149-cvt-parser.py
          python3 .ci/v149-diagonal-parser.py
          python3 .ci/v149-let-bindings.py
          python3 .ci/v149-residual-carrier.py
      - name: Print exact parser context
        run: |
          nl -ba Exotic/ERL/FullCoupled/CompleteSafe_v147.agda | sed -n '1588,1622p'
      - name: Kernel-check
        run: agda --safe Exotic/ERL/FullCoupled/CompleteSafe_v147.agda
