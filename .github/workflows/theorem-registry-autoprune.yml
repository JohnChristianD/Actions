name: Auto-prune theorem registry metadata

on:
  push:
    branches:
      - main
  schedule:
    - cron: '47 3 * * 1'
      timezone: "Asia/Manila"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agda-sync-main
  cancel-in-progress: false

jobs:
  prune-and-verify:
    name: Reconcile theorem registries against Agda
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'

      - name: Resynchronize canonical Agda command and imports
        run: nix run .#mirth-agda-sync -- --write

      - name: Prune stale theorem registries
        run: nix run .#prune-theorem-registries

      - name: Kernel-check canonical Agda proof surfaces
        run: |
          set -euo pipefail
          nix develop .#default -c bash -euo pipefail -c '
            "$AGDA_COMMAND" --safe -i . FullCoupled/CanonicalLearnerMonolith.agda
            "$AGDA_COMMAND" --allow-exec -i . \
              FullCoupled/TheoremsMonolith.agda
          '

      - name: Re-check registry freshness and graph extraction
        run: nix run .#mercury-theorem-e2e

      - name: Commit registry reconciliation
        run: |
          set -euo pipefail
          if git diff --quiet -- .ci/actions_ci.dhall .ci/discovery/theorem_graph_search.m FullCoupled/CanonicalLearnerMonolith.agda FullCoupled/TheoremsMonolith.agda FullCoupled/FormalMethods; then
            echo "Theorem registries are already synchronized with the Agda proof surface."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/actions_ci.dhall .ci/discovery/theorem_graph_search.m FullCoupled/CanonicalLearnerMonolith.agda FullCoupled/TheoremsMonolith.agda FullCoupled/FormalMethods
          git commit -m "ci: resync Agda contracts and theorem registries"
          git push origin HEAD:main
