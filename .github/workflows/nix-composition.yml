name: Nix connected composition verification

on:
  push:
    branches: [main, nix-prune-mercury-ci]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: nix-connected-composition-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agda-learner:
    name: Nix / Agda learner proof surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Install Agda 2.8.0.2 and standard library 2.4
        id: setup-agda
        uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - name: Export Agda executable
        run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - name: Check learner sources
        run: |
          "$AGDA_COMMAND" --version
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/CanonicalLearnerMonolith_test.agda"
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agda"
      - name: Upload learner Agda interfaces
        uses: actions/upload-artifact@v4
        with:
          name: learner-agdai
          path: Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agdai
          if-no-files-found: error


  agda-theorem-part1:
    name: Nix / Agda theorem partition 1
    needs: agda-learner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        id: setup-agda
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: learner-agdai
          path: Exotic/ERL/FullCoupled
      - name: Enforce interface-only predecessor handoff
        run: |
          mkdir -p .ci/interface-shadow
          mv "Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agda" .ci/interface-shadow/
      - name: Check theorem partition 1a
        run: |
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1a.agda"
      - name: Check theorem partition 1b
        run: |
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1b.agda"
      - name: Check theorem partition 1c
        run: |
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1c.agda"
      - name: Check theorem partition 1 facade
        run: |
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1.agda"
      - name: Upload theorem partition 1 Agda interfaces
        uses: actions/upload-artifact@v4
        with:
          name: part1-agdai
          path: |
            Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1a.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1b.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1c.agdai
          if-no-files-found: error

  agda-theorem-part2:
    name: Nix / Agda theorem partition 2
    needs: agda-theorem-part1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        id: setup-agda
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: part1-agdai
          path: |
            Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1a.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1b.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1c.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part2.agdai
          if-no-files-found: error

  agda-theorem-part3:
    name: Nix / Agda theorem partition 3
    needs: agda-theorem-part2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        id: setup-agda
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: part2-agdai
          path: |
            Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1a.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1b.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1c.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part2.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part3.agdai
          if-no-files-found: error

  agda-theorem-part4:
    name: Nix / Agda theorem partition 4
    needs: agda-theorem-part3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        id: setup-agda
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: part3-agdai
          path: |
            Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1a.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1b.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1c.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part2.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part3.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part4.agdai
          if-no-files-found: error

  agda-theorem-part5:
    name: Nix / Agda theorem partition 5
    needs: agda-theorem-part4
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        id: setup-agda
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: part4-agdai
          path: |
            Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1a.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1b.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part1c.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part2.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part3.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part4.agdai
            Exotic/ERL/FullCoupled/TheoremsMonolith/Part5.agdai
          if-no-files-found: error

  agda-theorems:
    name: Nix / Agda canonical theorem facade
    needs: agda-theorem-part5
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        id: setup-agda
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: part5-agdai
          path: Exotic/ERL/FullCoupled
      - name: Enforce interface-only predecessor handoff
        run: |
          mkdir -p .ci/interface-shadow
          mv "Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agda" .ci/interface-shadow/
          mv "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1.agda" .ci/interface-shadow/
          mv "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1a.agda" .ci/interface-shadow/
          mv "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1b.agda" .ci/interface-shadow/
          mv "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1c.agda" .ci/interface-shadow/
          mv "Exotic/ERL/FullCoupled/TheoremsMonolith/Part2.agda" .ci/interface-shadow/
          mv "Exotic/ERL/FullCoupled/TheoremsMonolith/Part3.agda" .ci/interface-shadow/
          mv "Exotic/ERL/FullCoupled/TheoremsMonolith/Part4.agda" .ci/interface-shadow/
          mv "Exotic/ERL/FullCoupled/TheoremsMonolith/Part5.agda" .ci/interface-shadow/
      - run: |
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/TheoremsMonolith.agda"

  mercury-discovery-surface:
    name: Nix / Mercury discovery and canonical surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Install Agda 2.8.0.2 and standard library 2.4
        id: setup-agda
        uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - name: Export Agda executable
        run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - name: Run Mercury, discovery, surface, and version checks
        run: |
          nix develop --command bash -lc '
            bash ./.ci/ci.sh mercury
            bash ./.ci/ci.sh discovery
            bash ./.ci/ci.sh surface
            bash ./.ci/ci.sh versions
          '
