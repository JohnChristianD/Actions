name: Nix connected composition verification

on:
  push:
    branches: [main, nix-prune-mercury-ci]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  agda:
    name: Agda learner + theorem monoliths
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        id: setup-agda
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - name: Provision swap
        run: |
          if ! swapon --show=NAME | grep -qx '/swapfile'; then
            sudo fallocate -l 4G /swapfile || true
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile || true
            sudo swapon /swapfile || true
          fi
      - name: Check canonical learner test
        timeout-minutes: 15
        run: nix run .#ci -- agda-learner
      - name: Check theorem monolith
        if: always()
        timeout-minutes: 15
        run: nix run .#ci -- agda-theorem
      - name: Check Agda version
        if: always()
        run: "$AGDA_COMMAND --version"

  mercury:
    name: Mercury theorem-only e-graph
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Run theorem-only Mercury discovery and canonical semantic contract
        timeout-minutes: 15
        run: |
          nix run .#ci -- mercury
          nix run .#ci -- discovery
          nix run .#ci -- semantic-contract
          nix run .#ci -- surface
