name: Nix connected composition verification

on:
  push:
    branches: [main, nix-prune-mercury-ci]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agda:
    name: Agda learner + theorem monoliths
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        id: setup-agda
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - name: Provision swap
        run: |
          if ! swapon --show=NAME | grep -qx '/swapfile'; then
            sudo fallocate -l 4G /swapfile || true
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile || true
            sudo swapon /swapfile || true
          fi
      - name: Check canonical learner monolith
        timeout-minutes: 15
        env:
          AGDA_COMMAND: ${{ steps.setup-agda.outputs.agda-path }}
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.AgdaLearner'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Check theorem monolith
        if: always()
        timeout-minutes: 15
        env:
          AGDA_COMMAND: ${{ steps.setup-agda.outputs.agda-path }}
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.AgdaTheorem'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Check Agda/Mercury/Dhall tool versions
        if: always()
        env:
          AGDA_COMMAND: ${{ steps.setup-agda.outputs.agda-path }}
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.Versions'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

  mercury:
    name: Mercury theorem-only e-graph
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Run theorem-only Mercury discovery and canonical semantic contract
        timeout-minutes: 15
        env:
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.Mercury'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Discovery
        timeout-minutes: 15
        env:
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.Discovery'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Publish live theorem/economic graph artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theorem-economic-closure-graph
          if-no-files-found: ignore
          path: |
            .ci/discovery/theorem-monolith-egraph-sync.json
            .ci/discovery/economic-closure-graph.json

      - name: Cross-repo Econlib graph
        timeout-minutes: 15
        env:
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.EconlibCrossrepo'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Econlib equilibrium graph search
        timeout-minutes: 15
        env:
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.EconlibEquilibriumSearch'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Strict existence or impossibility graph
        timeout-minutes: 15
        env:
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.StrictExistenceImpossibility'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

      - name: Stationary distribution finite-cycle impossibility graph
        timeout-minutes: 15
        env:
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.StationaryCycleImpossibility'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'


      - name: Isomorphism transport closure
        timeout-minutes: 15
        env:
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.IsomorphismTransport'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Semantic contract
        timeout-minutes: 15
        env:
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.SemanticContract'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Surface contract
        timeout-minutes: 15
        env:
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | All >.Surface'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

  auto-merge:
    name: Enable auto-merge after full verification
    if: github.event_name == 'pull_request'
    needs: [agda, mercury]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Enable GitHub auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_LANE: '< AgdaLearner | AgdaTheorem | AgdaSafe | Mercury | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | AutoMerge | All >.AutoMerge'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

# PR verification: Dhall replacement is green on the equivalent verification branch.
