name: Nix connected composition verification

on:
  push:
    branches: [main, nix-prune-mercury-ci]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agda:
    name: Agda learner + theorem monoliths
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Provision swap
        run: |
          if ! swapon --show=NAME | grep -qx '/swapfile'; then
            sudo fallocate -l 4G /swapfile || true
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile || true
            sudo swapon /swapfile || true
          fi
      - name: Check canonical learner monolith
        timeout-minutes: 15
        env:
          CI_LANE: 'AgdaLearner'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Check theorem monolith
        if: always()
        timeout-minutes: 15
        env:
          CI_LANE: 'AgdaTheorem'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Check Agda/Mercury/Dhall tool versions
        if: always()
        env:
          CI_LANE: 'Versions'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

  vehicle:
    name: Vehicle direct executable
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Verify Vehicle Agda interface
        run: |
          set -euo pipefail
          vehicle_source="$(nix eval --raw .#vehicleAgdaSource)"
          test -f "$vehicle_source/Vehicle.agda"
          grep -Fq 'VEHICLE_COMMAND' "$vehicle_source/Vehicle.agda"
          grep -Fq -- '--allow-exec' "$vehicle_source/Vehicle.agda"
          echo "vehicle-agda-interface=pass"

  mercury:
    name: Mercury theorem-only e-graph
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Mercury purity gate
        timeout-minutes: 5
        env:
          CI_LANE: 'MercuryPurity'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

      - name: Run theorem-only Mercury discovery and canonical semantic contract
        timeout-minutes: 15
        env:
          CI_LANE: 'Mercury'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: MAlonzo + LiquidHaskell bridge
        timeout-minutes: 20
        env:
          CI_LANE: 'MAlonzoLiquid'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

      - name: Discovery
        timeout-minutes: 15
        env:
          CI_LANE: 'Discovery'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Publish live theorem/economic graph artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theorem-economic-closure-graph
          if-no-files-found: ignore
          path: |
            .ci/discovery/theorem-monolith-egraph-sync.dhall
            .ci/discovery/economic-closure-graph.dhall
            build/agda-haskell/liquid-agda-manifest.tsv
            build/agda-haskell/malonzo-files.txt

      - name: Cross-repo Econlib graph
        timeout-minutes: 15
        env:
          CI_LANE: 'EconlibCrossrepo'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Econlib equilibrium graph search
        timeout-minutes: 15
        env:
          CI_LANE: 'EconlibEquilibriumSearch'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Strict existence or impossibility graph
        timeout-minutes: 15
        env:
          CI_LANE: 'StrictExistenceImpossibility'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

      - name: Stationary distribution finite-cycle impossibility graph
        timeout-minutes: 15
        env:
          CI_LANE: 'StationaryCycleImpossibility'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'


      - name: Isomorphism transport closure
        timeout-minutes: 15
        env:
          CI_LANE: 'IsomorphismTransport'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Semantic contract
        timeout-minutes: 15
        env:
          CI_LANE: 'SemanticContract'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
      - name: Surface contract
        timeout-minutes: 15
        env:
          CI_LANE: 'Surface'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

  pages:
    name: Pages build verification
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Verify Mirth C99 fast-dirty synchronization
        timeout-minutes: 5
        env:
          CI_LANE: 'MirthFastDirty'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

      - name: Verify static Elm presentation build
        timeout-minutes: 15
        env:
          CI_LANE: 'Pages'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

  auto-merge:
    name: Enable auto-merge after full verification
    if: github.event_name == 'pull_request'
    needs: [agda, mercury, pages, vehicle]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Enable GitHub auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_LANE: 'AutoMerge'
        run: |
          set -euo pipefail
          nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'

# PR verification: Dhall replacement is green on the equivalent verification branch.
