name: Nix connected composition verification

on:
  push:
    branches: [main, nix-prune-mercury-ci]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: nix-connected-composition-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agda-learner:
    name: Nix / Agda learner proof surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Install Agda 2.8.0.2 and standard library 2.4
        id: setup-agda
        uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - name: Export Agda executable
        run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - name: Configure CI Agda project
        run: |
          cat > ci-composition.agda-lib <<'EOF'
          name: ci-composition
          include: .
          depend: standard-library
          EOF
      - name: Disable CI Agda project for local interface
        run: mv ci-composition.agda-lib ci-composition.agda-lib.disabled
      - name: Check learner monolith once
        run: |
          "$AGDA_COMMAND" --version
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agda"
      - name: Stage learner Agda interface
        run: |
          test -f Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agdai
          rm -rf interface-artifact
          mkdir -p interface-artifact
          cp --parents Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agdai interface-artifact/
          find interface-artifact -type f -name '*.agdai' -print
      - name: Upload learner Agda interfaces
        uses: actions/upload-artifact@v4
        with:
          name: learner-agdai
          path: interface-artifact
          if-no-files-found: error


  agda-theorem-part1:
    name: Nix / Agda theorem partition 1
    needs: agda-learner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881
        id: setup-agda
        with:
          agda-version: '2.8.0.2'
          agda-stdlib-version: '2.4'
      - run: echo "AGDA_COMMAND=${{ steps.setup-agda.outputs.agda-path }}" >> "$GITHUB_ENV"
      - name: Configure CI Agda project
        run: |
          cat > ci-composition.agda-lib <<'EOF'
          name: ci-composition
          include: .
          depend: standard-library
          EOF
      - uses: actions/download-artifact@v4
        with:
          name: learner-agdai
          path: .
      - name: Disable CI Agda project for local interfaces
        run: mv ci-composition.agda-lib ci-composition.agda-lib.disabled
      - name: Verify learner interface handoff
        run: |
          test -f Exotic/ERL/FullCoupled/CanonicalLearnerMonolith.agdai
      - name: Check theorem partition 1a
        run: |
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1a.agda"
      - name: Check theorem partition 1b
        run: |
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1b.agda"
      - name: Check theorem partition 1c
        run: |
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1c.agda"
      - name: Check theorem partition 1 facade
        run: |
          "$AGDA_COMMAND" --safe -l standard-library -i . "Exotic/ERL/FullCoupled/TheoremsMonolith/Part1.agda"
      - name: Stage theorem partition 1 Agda interfaces
        run: |
          mv ci-composition.agda-lib.disabled ci-composition.agda-lib
          rm -rf interface-artifact
          mkdir interface-artifact
          while IFS= read -r -d '' iface; do
            cp --parents "$iface" interface-artifact/
          done < <(find Exotic -type f -name '*.agdai' -print0)
          find interface-artifact -type f -name '*.agdai' | sort
      - name: Upload theorem partition 1 Agda interfaces
        uses: actions/upload-artifact@v4
        with:
          name: part1-agdai
          path: interface-artifact
          if-no-files-found: error

