      - name: Prefer downloaded Agda interfaces
        run: |
          mv ci-composition.agda-lib ci-composition.agda-lib.disabled
          while IFS= read -r -d '' iface; do
            rel="${iface#_build/2.8.0.2/agda/}"
            mkdir -p "$(dirname "$rel")"
            cp "$iface" "$rel"
          done < <(find _build/2.8.0.2/agda -type f -name '*.agdai' -print0)
      - name: Prefer downloaded Agda interface timestamps
