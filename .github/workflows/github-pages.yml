# CI receipt probe: trigger a fresh PR run without changing step semantics.
name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-pages.yml"
      - "FullCoupled/**"
      - ".ci/**"
      - "site/**"
      - "flake.nix"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/github-pages.yml"
      - "FullCoupled/**"
      - ".ci/**"
      - "site/**"
      - "flake.nix"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    name: Build Agda-synchronized Elm Pages surface
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'

      - name: Verify and compile static Elm presentation
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pages"
          CI_LANE=Pages PAGES_OUTPUT_DIR="${RUNNER_TEMP}/pages" \
            nix develop .#default -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
          test -s "${RUNNER_TEMP}/pages/elm.js"


      - name: Create Pages shell
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          cat > "${RUNNER_TEMP}/pages/index.html" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>${repo_name}</title>
            <style>
              :root { color-scheme: light dark; }
              body { max-width: 960px; margin: 0 auto; padding: 2rem; font: 16px/1.6 system-ui, sans-serif; }
              code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
              a { text-decoration-thickness: .08em; text-underline-offset: .15em; }
              .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
              .panel { border: 1px solid currentColor; border-radius: .6rem; padding: 1rem; opacity: .9; }
            </style>
          </head>
          <body>
            <div id="app"></div>
            <script src="elm.js"></script>
            <script>Elm.Main.init({ node: document.getElementById("app") });</script>
          </body>
          </html>
          HTML
          touch "${RUNNER_TEMP}/pages/.nojekyll"

      - name: Persist generated Elm branch bundle
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/pages/index.html" index.html
          cp "${RUNNER_TEMP}/pages/elm.js" elm.js
          if git diff --quiet -- index.html elm.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html elm.js
          git commit -m "chore(site): refresh generated Elm bundle [skip ci]"
          git push origin HEAD:main
