name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-pages.yml"
      - "FullCoupled/**"
      - ".ci/**"
      - "site/**"
      - "flake.nix"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    name: Build Agda-synchronized Elm Pages surface
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and compile static Elm presentation
        run: |
          set -euo pipefail
          nix develop --command bash -euo pipefail -c '
            tmp="${RUNNER_TEMP}/elm"
            rm -rf "$tmp"
            mkdir -p "$tmp/src"
            cp site/Main.elm "$tmp/src/Main.elm"
            mirthc "$GITHUB_WORKSPACE/.ci/mirth/agda_graph.mth" -o "$tmp/agda-graph.c"
            cc -std=c99 "$tmp/agda-graph.c" -o "$tmp/agda-graph"
            "$tmp/agda-graph" "$tmp/src/GeneratedAgdaGraph.elm" | bash -s -- "$tmp/src/GeneratedAgdaGraph.elm"
            mirthc "$GITHUB_WORKSPACE/.ci/mirth/agda_to_elm.mth" -o "$tmp/agda-to-elm.c"
            cc -std=c99 "$tmp/agda-to-elm.c" -o "$tmp/agda-to-elm"
            "$tmp/agda-to-elm" > "$tmp/src/GeneratedTheoremSurface.elm"
            test -s "$tmp/src/GeneratedTheoremSurface.elm"
            if LC_ALL=C grep -n '[^[:print:][:space:]]' "$tmp/src/GeneratedTheoremSurface.elm"; then exit 1; fi
            grep -Fq 'siteTitle : String' "$tmp/src/GeneratedTheoremSurface.elm"
            grep -Fq 'finiteMixedNash-brouwer-gru-egraph-astar-distribution-proof' "$tmp/src/GeneratedAgdaGraph.elm"
            dhall-to-json --file "$GITHUB_WORKSPACE/.ci/elm-application.dhall" > "$tmp/elm.json"
            test -s "$tmp/elm.json"
            mkdir -p "${RUNNER_TEMP}/pages"
            cd "$tmp"
            elm make src/Main.elm --optimize --output "${RUNNER_TEMP}/pages/elm.js"
            test -s "${RUNNER_TEMP}/pages/elm.js"
            test -s "$tmp/src/GeneratedAgdaGraph.elm"
            dhall type --file "${GITHUB_WORKSPACE}/.ci/presentation-contract.dhall" >/dev/null
            grep -Fq "module FullCoupled.CanonicalLearnerMonolith" "${GITHUB_WORKSPACE}/FullCoupled/CanonicalLearnerMonolith.agda"
            grep -Fq "module FullCoupled.TheoremsMonolith" "${GITHUB_WORKSPACE}/FullCoupled/TheoremsMonolith.agda"
          '

      - name: Create Pages shell
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          cat > "${RUNNER_TEMP}/pages/index.html" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>${repo_name}</title>
            <style>
              :root { color-scheme: light dark; }
              body { max-width: 960px; margin: 0 auto; padding: 2rem; font: 16px/1.6 system-ui, sans-serif; }
              code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
              a { text-decoration-thickness: .08em; text-underline-offset: .15em; }
              .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
              .panel { border: 1px solid currentColor; border-radius: .6rem; padding: 1rem; opacity: .9; }
            </style>
          </head>
          <body>
            <div id="app"></div>
            <script src="elm.js"></script>
            <script>Elm.Main.init({ node: document.getElementById("app") });</script>
          </body>
          </html>
          HTML
          touch "${RUNNER_TEMP}/pages/.nojekyll"

      - name: Persist generated Elm branch bundle
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/pages/index.html" index.html
          cp "${RUNNER_TEMP}/pages/elm.js" elm.js
          if git diff --quiet -- index.html elm.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html elm.js
          git commit -m "chore(site): refresh generated Elm bundle [skip ci]"
          git push origin HEAD:main
