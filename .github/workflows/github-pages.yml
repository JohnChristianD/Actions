name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    name: Build pure Elm Pages surface
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Elm application
        run: |
          set -euo pipefail
          nix develop --command bash -euo pipefail -c '
            tmp="${RUNNER_TEMP}/elm"
            rm -rf "$tmp"
            mkdir -p "$tmp/src"
            cp site/Main.elm "$tmp/src/Main.elm"
            cat > "$tmp/elm.json" <<'"'"'JSON'
          {
            "type": "application",
            "source-directories": ["src"],
            "elm-version": "0.19.1",
            "dependencies": {
              "direct": {
                "elm/browser": "1.0.2",
                "elm/core": "1.0.5",
                "elm/html": "1.0.0"
              },
              "indirect": {
                "elm/json": "1.1.3",
                "elm/time": "1.0.0",
                "elm/url": "1.0.0",
                "elm/virtual-dom": "1.0.3"
              }
            }
          }
          JSON
            mkdir -p "${RUNNER_TEMP}/pages"
            elm make "$tmp/src/Main.elm" --optimize --output "${RUNNER_TEMP}/pages/elm.js"
            test -s "${RUNNER_TEMP}/pages/elm.js"
          '

      - name: Create Pages shell
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/pages/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Actions — proof and dependency topology</title>
            <style>
              :root { color-scheme: light dark; }
              body { max-width: 960px; margin: 0 auto; padding: 2rem; font: 16px/1.6 system-ui, sans-serif; }
              code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
              a { text-decoration-thickness: .08em; text-underline-offset: .15em; }
              .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
              .panel { border: 1px solid currentColor; border-radius: .6rem; padding: 1rem; opacity: .9; }
            </style>
          </head>
          <body>
            <div id="app"></div>
            <script src="elm.js"></script>
            <script>Elm.Main.init({ node: document.getElementById("app") });</script>
          </body>
          </html>
          HTML
          touch "${RUNNER_TEMP}/pages/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    name: Deploy pure Elm Pages surface
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
